<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المطاعم - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
              'safra-line': '#e7e2d6',
              'safra-muted': '#7c7669',
            },
            fontFamily: {
              display: ['"El Messiri"', 'serif'],
              sans: ['"Cairo"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-display { font-family: 'El Messiri', serif; }

        /* ============ شريط البحث ============ */
        .search-field {
            position: relative;
        }
        .search-field input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: #fff;
            border: 1px solid #e7e2d6;
            border-radius: 14px;
            font-size: 14px;
            color: #1c1a16;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .search-field input::placeholder { color: #9a9384; }
        .search-field input:focus {
            outline: none;
            border-color: #2e6f40;
            box-shadow: 0 0 0 3px rgba(46,111,64,.12);
        }
        .search-field i {
            position: absolute;
            top: 50%; right: 16px;
            transform: translateY(-50%);
            color: #9a9384;
            font-size: 14px;
            pointer-events: none;
        }

        /* ============ شريط التصنيفات ============ */
        .category-rail {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-rail::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex: 0 0 auto;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 9999px;
            border: 1px solid #e7e2d6;
            background: #fff;
            color: #3a362c;
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .cat-chip i { font-size: 12px; opacity: .85; }
        .cat-chip:active { transform: scale(.96); }
        .cat-chip[aria-pressed="true"] {
            background: #0b3b2c;
            border-color: #0b3b2c;
            color: #fff;
        }
        .cat-chip[aria-pressed="true"] i { opacity: 1; }
        .cat-chip[disabled] {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ============ كروت المطاعم ============ */
        .resto-card { display: block; text-decoration: none; color: inherit; }
        .resto-house {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e7e2d6;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .resto-card:hover .resto-house {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -16px rgba(11,59,44,.35);
            border-color: #d8d1c0;
        }
        .resto-photo-wrap { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #f1ece0; }
        .resto-photo-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .5s ease, filter .3s ease;
        }
        .resto-card:hover .resto-photo-wrap img { transform: scale(1.05); }
        .resto-photo-wrap img.is-closed { filter: grayscale(.55) brightness(.85); }

        .resto-cat-badge {
            position: absolute; top: 8px; right: 8px; z-index: 2;
            display: flex; align-items: center; gap: 4px;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(2px);
            font-size: 10px; font-weight: 700; color: #0b3b2c;
            padding: 4px 9px; border-radius: 9999px;
        }
        .resto-cat-badge i { font-size: 9px; }

        .resto-closed-badge {
            position: absolute; top: 8px; left: 8px; z-index: 2;
            font-size: 10px; font-weight: 700; color: #fff;
            background: rgba(17,17,17,.72);
            padding: 4px 9px; border-radius: 9999px;
        }

        .resto-body { padding: 11px 12px 13px; }
        .resto-body h3 { font-size: 14.5px; line-height: 1.3; }
        .resto-desc {
            font-size: 11.5px; color: #8a8474; margin-top: 3px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .resto-meta {
            display: flex; align-items: center; gap: 12px;
            margin-top: 8px;
            font-size: 11px; color: #5c5646;
            border-top: 1px solid #f0ebdf;
            padding-top: 8px;
        }
        .resto-meta span { display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .resto-meta i { font-size: 11px; color: #9a9384; }
        .resto-meta .rating-item i { color: #d97706; }
        .resto-meta .rating-item.is-new { color: #7c7669; font-weight: 700; }

        /* ============ حالة التحميل (skeleton) ============ */
        .skeleton-card { border-radius: 16px; overflow: hidden; border: 1px solid #e7e2d6; background: #fff; }
        .skeleton-photo { aspect-ratio: 4/3; background: #eee7d8; }
        .skeleton-line { height: 9px; border-radius: 5px; background: #eee7d8; margin: 10px 12px 0; }
        .skeleton-pulse { animation: skeleton-pulse 1.4s ease-in-out infinite; }
        @keyframes skeleton-pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    </style>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <div class="mb-4">
            <h1 class="font-display text-2xl font-semibold text-safra-dark">المطاعم</h1>
            <p id="restaurant-count" class="text-[12.5px] text-safra-muted mt-0.5">جاري تحميل المطاعم القريبة منك...</p>
        </div>

        <!-- البحث -->
        <div class="search-field mb-4">
            <input type="text" id="search-input" placeholder="ابحث عن مطعم أو نوع أكل...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <!-- التصنيفات -->
        <div id="category-rail" class="category-rail mb-5"></div>

        <!-- حالات العرض -->
        <div id="loading" class="grid grid-cols-2 gap-3"></div>
        <div id="error" class="hidden text-center text-red-600 bg-red-50 border border-red-100 rounded-xl py-8 px-4 text-sm"></div>
        <div id="empty" class="hidden flex-col items-center text-center text-safra-muted py-14 px-4">
            <i class="fa-regular fa-face-frown text-3xl mb-3 text-safra-line"></i>
            <p class="text-sm font-semibold text-safra-dark">لا يوجد مطاعم مطابقة</p>
            <p class="text-xs mt-1">جرّب كلمة بحث مختلفة أو اختر تصنيفًا آخر</p>
        </div>

        <div id="restaurants-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script>
        // ============ تصنيفات سفرة ============
        const categories = [
            { key: "طبيخ",             icon: "fa-utensils" },
            { key: "حلويات",           icon: "fa-cookie" },
            { key: "مقبلات",           icon: "fa-bowl-food" },
            { key: "معجنات",           icon: "fa-bread-slice" },
            { key: "فطور",             icon: "fa-egg" },
            { key: "سلطات",            icon: "fa-leaf" },
            { key: "مشروبات",          icon: "fa-mug-hot" },
            { key: "مونة",             icon: "fa-jar" },
            { key: "بوكسات مناسبات",  icon: "fa-gift" },
        ];

        const rail = document.getElementById('category-rail');

        function buildChip(key, icon, isAll) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'cat-chip';
            chip.dataset.cat = isAll ? 'all' : key;
            chip.setAttribute('aria-pressed', isAll ? 'true' : 'false');
            chip.innerHTML = `<i class="fa-solid ${icon}"></i><span>${key}</span>`;
            return chip;
        }

        rail.appendChild(buildChip('الكل', 'fa-border-all', true));
        categories.forEach(cat => rail.appendChild(buildChip(cat.key, cat.icon, false)));

        rail.addEventListener('click', (e) => {
            const chip = e.target.closest('.cat-chip');
            if (!chip || chip.disabled) return;
            [...rail.querySelectorAll('.cat-chip')].forEach(c => c.setAttribute('aria-pressed', 'false'));
            chip.setAttribute('aria-pressed', 'true');
            window.onCategorySelect && window.onCategorySelect(chip.dataset.cat);
        });

        // تعطيل التصنيفات اللي ما فيها ولا مطعم، بدون ما ناخذ مساحة بصرية زيادة
        window.setCategoryAvailability = (availableSet) => {
            [...rail.querySelectorAll('.cat-chip')].forEach(chip => {
                if (chip.dataset.cat === 'all') return;
                const hasAny = availableSet.has(chip.dataset.cat);
                chip.disabled = !hasAny;
                chip.title = hasAny ? '' : 'لا يوجد مطاعم بهذا التصنيف حاليًا';
            });
        };

        // مسكِن تحميل بسيط بدل نص "جاري التحميل"
        (function renderSkeletons() {
            const loading = document.getElementById('loading');
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="skeleton-card skeleton-pulse">
                        <div class="skeleton-photo"></div>
                        <div class="skeleton-line" style="width:70%"></div>
                        <div class="skeleton-line" style="width:45%; margin-top:8px; margin-bottom:12px;"></div>
                    </div>`;
            }
            loading.innerHTML = html;
        })();
    </script>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const emptyBox = document.getElementById('empty');
        const grid = document.getElementById('restaurants-grid');
        const searchInput = document.getElementById('search-input');
        const countLabel = document.getElementById('restaurant-count');

        let allRestaurants = [];
        let activeCategory = 'all';

        function isRestaurantClosed(r) {
            return r.status === 'متوقف';
        }

        // بيرجع مصفوفة تصنيفات المطعم، بتوافق مع المطاعم القديمة يلي عندها
        // حقل category مفرد بدل categories (توافق مع بيانات قديمة)
        function restaurantCategories(r) {
            if (Array.isArray(r.categories) && r.categories.length) return r.categories;
            if (r.category) return [r.category];
            return [];
        }

        const categoryIcons = {
            "طبيخ": "fa-utensils", "حلويات": "fa-cookie", "مقبلات": "fa-bowl-food",
            "معجنات": "fa-bread-slice", "فطور": "fa-egg", "سلطات": "fa-leaf",
            "مشروبات": "fa-mug-hot", "مونة": "fa-jar", "بوكسات مناسبات": "fa-gift",
        };

        function renderCard(id, r) {
            const closed = isRestaurantClosed(r);
            const cats = restaurantCategories(r);
            const primaryCat = cats[0];
            const icon = categoryIcons[primaryCat] || 'fa-utensils';
            const hasReviews = !!r.reviewsCount;

            const card = document.createElement('a');
            card.href = `restaurant-page.html?id=${id}`;
            card.className = "resto-card";
            card.innerHTML = `
                <div class="resto-house">
                    <div class="resto-photo-wrap">
                        <img class="${closed ? 'is-closed' : ''}"
                             src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'}"
                             alt="${r.name || 'مطعم'}">
                        ${primaryCat ? `<span class="resto-cat-badge"><i class="fa-solid ${icon}"></i>${primaryCat}</span>` : ''}
                        ${closed ? `<span class="resto-closed-badge">مغلق حاليًا</span>` : ''}
                    </div>
                    <div class="resto-body">
                        <h3 class="font-display font-semibold text-safra-dark truncate">${r.name || ''}</h3>
                        <p class="resto-desc">${r.description || ''}</p>
                        <div class="resto-meta">
                            <span class="rating-item ${hasReviews ? '' : 'is-new'}">
                                <i class="fa-solid fa-star"></i> ${hasReviews ? (r.rating ?? 0) : 'جديد'}
                            </span>
                            <span><i class="fa-regular fa-clock"></i> ${r.deliveryTimeMinutes ?? '-'} د</span>
                            <span><i class="fa-solid fa-truck-fast"></i> ${r.deliveryFee ?? '-'} د.أ</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const filtered = allRestaurants.filter(({ data }) => {
                const matchesCategory = activeCategory === 'all' || restaurantCategories(data).includes(activeCategory);
                const matchesSearch = !term || (data.name || '').toLowerCase().includes(term);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyBox.classList.remove('hidden');
                emptyBox.classList.add('flex');
                return;
            }
            emptyBox.classList.add('hidden');
            emptyBox.classList.remove('flex');
            filtered.forEach(({ id, data }) => grid.appendChild(renderCard(id, data)));
        }

        searchInput.addEventListener('input', applyFilters);

        window.onCategorySelect = (catKey) => {
            activeCategory = catKey;
            applyFilters();
        };

        async function loadRestaurants() {
            try {
                const snapshot = await getDocs(collection(db, "restaurants"));
                loading.classList.add('hidden');

                if (snapshot.empty) {
                    emptyBox.classList.remove('hidden');
                    emptyBox.classList.add('flex');
                    emptyBox.innerHTML = `
                        <i class="fa-regular fa-store-slash text-3xl mb-3 text-safra-line"></i>
                        <p class="text-sm font-semibold text-safra-dark">لا يوجد مطاعم بعد</p>
                        <p class="text-xs mt-1">جرّب صفحة seed-data.html لإضافة بيانات تجريبية</p>`;
                    countLabel.textContent = 'لا يوجد مطاعم متاحة حاليًا';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    allRestaurants.push({ id: docSnap.id, data: docSnap.data() });
                });

                const openCount = allRestaurants.filter(({ data }) => !isRestaurantClosed(data)).length;
                countLabel.textContent = `${allRestaurants.length} مطعم بالمجموع · ${openCount} مفتوح الآن`;

                const availableCats = new Set();
                allRestaurants.forEach(({ data }) => {
                    restaurantCategories(data).forEach(cat => availableCats.add(cat));
                });
                window.setCategoryAvailability && window.setCategoryAvailability(availableCats);

                applyFilters();
            } catch (error) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.innerText = "حدث خطأ أثناء تحميل المطاعم: " + error.message;
            }
        }

        loadRestaurants();
    </script>
</body>
</html>
