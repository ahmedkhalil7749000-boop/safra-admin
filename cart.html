<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سلة المشتريات - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-4">سلة المشتريات</h1>

        <div id="empty-cart" class="hidden text-center text-gray-500 py-16">
            السلة فاضية. روح
            <a href="المطاعم.html" class="text-safra-gold hover:underline">لصفحة المطاعم</a>
            واختار وجبتك.
        </div>

        <div id="cart-items" class="space-y-3"></div>

        <div id="cart-summary" class="hidden bg-white rounded-lg shadow-md border border-gray-200 p-4 mt-6">
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span>المجموع</span>
                <span id="subtotal">0.00 د.أ</span>
            </div>
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span>رسوم التوصيل</span>
                <span id="delivery-fee">0.00 د.أ</span>
            </div>
            <div class="flex justify-between font-bold text-gray-800 mt-2 pt-2 border-t">
                <span>الإجمالي</span>
                <span id="total">0.00 د.أ</span>
            </div>
            <!-- تم تعديل الرابط هنا ليتطابق مع checkout.html -->
            <a href="checkout.html" class="block text-center bg-safra-gold text-white py-2 rounded-lg font-semibold hover:bg-safra-gold-dark transition mt-4">إتمام الطلب</a>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { getCart, saveCart } from "./cart-service.js";

        const DELIVERY_FEE = 1.5;

        const cartItemsEl = document.getElementById('cart-items');
        const emptyEl = document.getElementById('empty-cart');
        const summaryEl = document.getElementById('cart-summary');

        async function render() {
            const cart = await getCart();
            cartItemsEl.innerHTML = '';

            if (cart.length === 0) {
                emptyEl.classList.remove('hidden');
                summaryEl.classList.add('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            summaryEl.classList.remove('hidden');

            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += item.price * item.qty;
                const row = document.createElement('div');
                row.className = "bg-white rounded-lg shadow-sm border border-gray-200 p-3 flex items-center gap-3";
                row.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-16 h-16 object-cover rounded">
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                        <span class="text-safra-gold text-sm">${item.price} د.أ</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="dec-btn w-7 h-7 bg-gray-100 rounded hover:bg-gray-200">-</button>
                        <span class="w-6 text-center">${item.qty}</span>
                        <button class="inc-btn w-7 h-7 bg-gray-100 rounded hover:bg-gray-200">+</button>
                    </div>
                    <button class="remove-btn text-red-500 text-xs hover:underline">حذف</button>
                `;
                row.querySelector('.inc-btn').addEventListener('click', async () => {
                    cart[index].qty += 1;
                    await saveCart(cart);
                    render();
                });
                row.querySelector('.dec-btn').addEventListener('click', async () => {
                    if (cart[index].qty > 1) {
                        cart[index].qty -= 1;
                    } else {
                        cart.splice(index, 1);
                    }
                    await saveCart(cart);
                    render();
                });
                row.querySelector('.remove-btn').addEventListener('click', async () => {
                    cart.splice(index, 1);
                    await saveCart(cart);
                    render();
                });
                cartItemsEl.appendChild(row);
            });

            const total = subtotal + (cart.length ? DELIVERY_FEE : 0);
            document.getElementById('subtotal').innerText = subtotal.toFixed(2) + " د.أ";
            document.getElementById('delivery-fee').innerText = DELIVERY_FEE.toFixed(2) + " د.أ";
            document.getElementById('total').innerText = total.toFixed(2) + " د.أ";
        }

        render();
    </script>
</body>
</html>
