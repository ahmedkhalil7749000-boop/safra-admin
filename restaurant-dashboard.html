                                    <label class="field-label">الحالة</label>
                                    <select id="new-restaurant-status" class="field">
                                        <option value="نشط" selected>نشط</option>
                                        <option value="متوقف">متوقف</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">صورة المطعم <span class="field-hint" id="new-image-hint">${restaurantImageHint(ownerType)}</span></label>
                                    <input type="file" id="new-restaurant-image" accept="image/*" class="field-file">
                                </div>
                                <div>
                                    <label class="field-label">غلاف صفحة المطعم <span class="field-hint">(اختياري — المقاس الإجباري 1600×700 بكسل)</span></label>
                                    <input type="file" id="new-restaurant-cover" accept="image/*" class="field-file">
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">إنشاء المطعم</button>
                                <p id="create-restaurant-message" class="form-msg text-center"></p>
                            </form>
                        </div>
                    `;

                    renderCategoryChips('new-restaurant-categories');

                    document.getElementById('create-restaurant-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const msg = document.getElementById('create-restaurant-message');
                        const name = document.getElementById('new-restaurant-name').value.trim();
                        const description = document.getElementById('new-restaurant-description').value.trim();
                        const phone = normalizeJordanPhone(document.getElementById('new-restaurant-phone').value);
                        const categories = getCheckedCategories('new-restaurant-categories');
                        const restaurantType = document.getElementById('new-restaurant-type').value === 'foodtruck' ? 'foodtruck' : 'home';
                        const status = document.getElementById('new-restaurant-status').value;
                        const imageFile = document.getElementById('new-restaurant-image').files[0];
                        const coverFile = document.getElementById('new-restaurant-cover').files[0];

                        if (!name) return;
                        if (categories.length === 0) {
                            msg.className = "form-msg err text-center mt-2";
                            msg.innerText = "لازم تختاري تصنيف واحد على الأقل للمطعم.";
                            return;
                        }
                        if (imageFile) {
                            try {
                                const spec = restaurantImageSpec(restaurantType);
                                await enforceImageDimensions(imageFile, spec.w, spec.h, "صورة المطعم");
                            } catch (error) {
                                msg.className = "form-msg err text-center mt-2";
                                msg.innerText = error.message;
                                return;
                            }
                        }
                        if (coverFile) {
                            try {
                                await enforceImageDimensions(coverFile, 1600, 700, "غلاف صفحة المطعم");
                            } catch (error) {
                                msg.className = "form-msg err text-center mt-2";
                                msg.innerText = error.message;
                                return;
                            }
                        }

                        msg.className = "form-msg busy text-center mt-2";
                        msg.innerText = "جاري الإنشاء...";

                        try {
                            let imageUrl = "";
                            let coverImageUrl = "";
                            if (imageFile) imageUrl = await uploadToImgbb(imageFile);
                            if (coverFile) coverImageUrl = await uploadToImgbb(coverFile);

                            // الشهر الأول مجاني، بس مرة وحدة لكل حساب (بريد):
                            //  - أول مرة: بنسجّل استخدام التجربة بوثيقة trialUsage وننشئ المطعم
                            //    بنفس العملية (batch) — قواعد الأمان بتتحقق إنهم انكتبوا سوا.
                            //  - إذا التجربة انستخدمت قبل (مثلاً حذف المطعم وأنشأ غيره): المطعم
                            //    بينعمل بحالة "منتهي" وبده اشتراك مدفوع.
                            const TRIAL_DAYS = 30;
                            const baseData = {
                                name, description, phone, categories, restaurantType, status,
                                ownerEmail: currentUserEmail, imageUrl, coverImageUrl,
                                createdAt: serverTimestamp()
                            };
                            const trialRef = doc(db, "trialUsage", currentUserEmail);
                            const trialSnap = await getDoc(trialRef);
                            const newRestaurantRef = doc(collection(db, "restaurants"));
                            let trialGranted = false;

                            if (!trialSnap.exists()) {
                                const trialEnd = new Date(Date.now() + TRIAL_DAYS * 24 * 60 * 60 * 1000);
                                const batch = writeBatch(db);
                                batch.set(trialRef, { ownerUid: auth.currentUser.uid, createdAt: serverTimestamp() });
                                batch.set(newRestaurantRef, {
                                    ...baseData,
                                    subscriptionStatus: "تجريبي",
                                    subscriptionEndDate: Timestamp.fromDate(trialEnd),
                                    trialEndsAt: Timestamp.fromDate(trialEnd),
                                    trialUsed: true
                                });
                                await batch.commit();
                                trialGranted = true;
                            } else {
                                await setDoc(newRestaurantRef, { ...baseData, subscriptionStatus: "منتهي" });
                            }
                            msg.className = "form-msg ok text-center mt-2";
                            msg.innerText = trialGranted
                                ? "تم إنشاء المطعم بنجاح!"
                                : "تم إنشاء المطعم. الشهر المجاني استُخدم سابقًا بهذا الحساب، فلازم تشترك لتفعيله.";
                            await loadMyRestaurant(currentUserEmail);
                        } catch (error) {
                            msg.className = "form-msg err text-center mt-2";
                            msg.innerText = "خطأ: " + error.message;
                        }
                    });
                    return;
                }

                const entries = querySnapshot.docs.map(d => ({ id: d.id, data: d.data() }));
                renderRestaurantEntries(container, entries, false);
            } catch (error) {
                console.error("خطأ في جلب بيانات المطعم:", error);
            }
        }

        // يبني بطاقة/بطاقات إدارة المطعم (تُستخدم لصاحب المطعم بأصنافها الأصلية، وللأدمن بوضعه الخاص)
        function renderRestaurantEntries(container, entries, isAdminMode) {
                container.innerHTML = "";
                entries.forEach(({ id: restaurantId, data }) => {
                    const isActive = (data.status || 'نشط') === 'نشط';
                    container.innerHTML += `
                        <div class="panel overflow-hidden">
                            <div id="view-${restaurantId}">
                                ${(data.coverImageUrl || data.imageUrl)
                                    ? `<div class="relative"><img src="${data.coverImageUrl || data.imageUrl}" class="w-full h-44 object-cover"><span class="badge ${isActive ? 'badge-live' : 'badge-paused'} absolute top-3 right-3">${isActive ? ICONS.check : ''} ${data.status || 'نشط'}</span></div>`
                                    : ''}
                                <div class="p-5">
                                    ${!data.imageUrl ? `<span class="badge ${isActive ? 'badge-live' : 'badge-paused'} mb-2">${isActive ? ICONS.check : ''} ${data.status || 'نشط'}</span>` : ''}
                                    <h2 class="font-display font-extrabold" style="font-size: 20px; color: var(--green-deep);">${data.name || 'مطعمي'}</h2>
                                    <p class="text-sm mt-1" style="color: var(--ink-soft);">${data.description || 'لسا ما ضفتي وصف لمطعمك.'}</p>
                                    <div class="mt-3 flex flex-wrap gap-1.5 items-center">
                                        ${restaurantCategories(data).length
                                            ? restaurantCategories(data).map(c => `<span class="badge badge-cat">${(CATEGORY_LIST.find(x => x.key === c) || {}).icon || ''} ${c}</span>`).join('')
                                            : '<span class="text-sm" style="color: var(--ink-soft);">ما في تصنيفات محددة بعد</span>'}
                                    </div>
                                    <div class="flex gap-2 mt-5 flex-wrap">
                                        <button data-id="${restaurantId}" class="edit-restaurant-btn btn btn-outline btn-sm">${ICONS.edit} تعديل بيانات المطعم</button>
                                        <button data-id="${restaurantId}" class="manage-items-btn btn btn-dark btn-sm">${ICONS.list} إدارة الأصناف والوجبات</button>
                                        <button data-id="${restaurantId}" class="manage-promo-btn btn btn-outline btn-sm">📣 البانر والفيديو</button>
                                    </div>
                                </div>
                            </div>

                            <div id="edit-form-${restaurantId}" class="hidden hairline p-5 space-y-4">
                                <div>
                                    <label class="field-label">نوع المشروع</label>
                                    <select id="edit-type-${restaurantId}" class="field rest-type-select" data-hint="edit-image-hint-${restaurantId}">
                                        <option value="home" ${data.restaurantType !== 'foodtruck' ? 'selected' : ''}>مطعم / مطبخ بيتي</option>
                                        <option value="foodtruck" ${data.restaurantType === 'foodtruck' ? 'selected' : ''}>فود ترك (مركبة متنقلة)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">اسم المطعم</label>
                                    <input type="text" id="edit-name-${restaurantId}" value="${data.name || ''}" class="field">
                                </div>
                                <div>
                                    <label class="field-label">الوصف</label>
                                    <input type="text" id="edit-description-${restaurantId}" value="${data.description || ''}" class="field">
                                </div>
                                <div>
                                    <label class="field-label">رقم الواتساب <span class="field-hint">(اكتب رقمك بأي صيغة، مثلاً 07XXXXXXXX — منظّفه تلقائيًا)</span></label>
                                    <input type="tel" id="edit-phone-${restaurantId}" value="${data.phone || ''}" class="field" placeholder="مثال: 0791234567" dir="ltr">
                                </div>
                                <div>
                                    <label class="field-label">التصنيفات <span class="field-hint">(ممكن أكتر من وحدة)</span></label>
                                    <div id="edit-categories-${restaurantId}" class="category-chip-group"></div>
                                </div>
                                <div>
                                    <label class="field-label">الحالة</label>
                                    <select id="edit-status-${restaurantId}" class="field">
                                        <option value="نشط" ${data.status === 'نشط' || !data.status ? 'selected' : ''}>نشط</option>
                                        <option value="متوقف" ${data.status === 'متوقف' ? 'selected' : ''}>متوقف</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">صورة المطعم <span class="field-hint" id="edit-image-hint-${restaurantId}">${restaurantImageHint(data.restaurantType)}</span></label>
                                    <input type="file" id="edit-image-${restaurantId}" accept="image/*" class="field-file">
                                </div>
                                <div>
                                    <label class="field-label">غلاف صفحة المطعم <span class="field-hint">(اختياري — المقاس الإجباري 1600×700 بكسل)</span></label>
                                    <input type="file" id="edit-cover-${restaurantId}" accept="image/*" class="field-file">
                                </div>
                                <div class="flex gap-2">
                                    <button data-id="${restaurantId}" class="save-restaurant-btn btn btn-primary">حفظ التعديلات</button>
                                    <button data-id="${restaurantId}" class="cancel-edit-btn btn btn-ghost">إلغاء</button>
                                </div>
                                <p id="edit-message-${restaurantId}" class="form-msg"></p>
                            </div>

                            <!-- قسم الترويج: البانر والفيديو -->
                            <div id="promo-section-${restaurantId}" class="hidden hairline p-5 space-y-5">
                                ${renderPromoSection(restaurantId, data, isAdminMode)}
                            </div>

                            <!-- قسم إدارة الأصناف -->
                            <div id="items-section-${restaurantId}" class="hidden hairline p-5">
                                <h3 class="font-bold mb-3" style="color: var(--ink);">الأصناف والوجبات</h3>
                                <div id="items-list-${restaurantId}" class="space-y-2 mb-4">
                                    <div class="empty-state flex items-center justify-center gap-2"><span class="spinner"></span> جاري التحميل...</div>
                                </div>

                                <!-- إدارة تصنيفات المنيو الخاصة بالمطعم -->
                                <div class="subpanel p-4 space-y-3 mb-4">
                                    <div class="flex items-center justify-between gap-3 flex-wrap">
                                        <div>
                                            <p class="font-semibold text-sm">📂 تصنيفات المنيو</p>
                                            <p class="text-xs mt-1" style="color:var(--ink-soft);">أضف تصنيفات خاصة بمطعمك، وستظهر للزبائن كأقسام داخل المنيو.</p>
                                        </div>
                                        <button type="button" data-id="${restaurantId}" class="add-menu-category-btn btn btn-outline btn-sm">${ICONS.plus} إضافة تصنيف</button>
                                    </div>
                                    <div id="menu-categories-${restaurantId}" class="flex flex-wrap gap-2"></div>
                                    <div id="menu-category-form-${restaurantId}" class="hidden grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2">
                                        <input id="menu-category-name-${restaurantId}" class="field" maxlength="40" placeholder="مثال: مشاوي، بيتزا، عروض الغداء">
                                        <button type="button" data-id="${restaurantId}" class="save-menu-category-btn btn btn-dark">حفظ التصنيف</button>
                                    </div>
                                    <p id="menu-category-msg-${restaurantId}" class="form-msg"></p>
                                </div>

                                <!-- إعدادات التوصيل الخاصة بالمطعم -->
                                <div class="subpanel p-4 space-y-3 mb-4">
                                    <div class="flex items-center justify-between gap-3 flex-wrap">
                                        <div>
                                            <p class="font-semibold text-sm">🚚 خدمة التوصيل</p>
                                            <p class="text-xs mt-1" style="color:var(--ink-soft);">فعّل التوصيل وحدد رسومه إن وجدت.</p>
                                        </div>
                                        <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer">
                                            <input type="checkbox" id="delivery-enabled-${restaurantId}" ${data.deliveryEnabled ? 'checked' : ''}>
                                            <span>متاحة</span>
                                        </label>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label class="field-label">رسوم التوصيل (د.أ)</label>
                                            <input type="number" min="0" step="0.01" id="delivery-fee-${restaurantId}" class="field" value="${data.deliveryFee ?? 0}">
                                        </div>
                                        <button type="button" data-id="${restaurantId}" class="save-delivery-btn btn btn-dark self-end">حفظ إعدادات التوصيل</button>
                                    </div>
                                    <p id="delivery-msg-${restaurantId}" class="form-msg"></p>
                                </div>

                                <!-- نموذج إضافة صنف جديد مع السعر والخصم والصورة -->
                                <form id="add-item-form-${restaurantId}" class="subpanel p-4 space-y-3">
                                    <p class="font-semibold text-sm flex items-center gap-1.5" style="color: var(--ink);">${ICONS.plus} إضافة صنف جديد</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label class="field-label">اسم الصنف</label>
                                            <input type="text" id="item-name-${restaurantId}" required class="field">
                                        </div>
                                        <div>
                                            <label class="field-label">السعر (د.أ)</label>
                                            <input type="number" min="0" step="0.01" id="item-price-${restaurantId}" required class="field">
                                        </div>
                                        <div>
                                            <label class="field-label">الخصم (%) <span class="field-hint">اختياري</span></label>
                                            <input type="number" min="0" max="100" step="1" value="0" id="item-discount-${restaurantId}" class="field">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="field-label">وصف الصنف أو المكونات</label>
                                        <textarea id="item-desc-${restaurantId}" rows="2" class="field" placeholder="مثال: لحم شهي مع جبنة ومخلل..."></textarea>
                                    </div>
                                    <div>
                                        <label class="field-label">تصنيف الصنف</label>
                                        <select id="item-category-${restaurantId}" required class="field">
                                            <option value="">اختاري تصنيف الصنف</option>
                                            ${menuCategoryOptions(getMenuCategoryList(data))}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="field-label">سفرة العافية <span class="field-hint">اختياري — أكل للنفاس أو المريض أو كبار السن</span></label>
                                        <div id="item-care-${restaurantId}" class="category-chip-group"></div>
                                        <p class="text-xs mt-2" style="color: var(--ink-soft);">${CARE_COOK_NOTE}</p>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-end">
                                        <div>
                                            <label class="field-label">صورة الصنف <span class="field-hint">اختياري — المقاس الإجباري للصورة: 800×800 بكسل</span></label>
                                            <input type="file" id="item-image-${restaurantId}" accept="image/*" class="field-file">
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-block">إضافة الوجبة للمنيو</button>
                                    </div>
                                </form>
                                <p id="item-message-${restaurantId}" class="form-msg text-center mt-2"></p>
                            </div>
                        </div>
                    `;

                    renderCategoryChips(`edit-categories-${restaurantId}`, restaurantCategories(data));
                    renderCareChips(`item-care-${restaurantId}`);
                    renderMenuCategoryManager(restaurantId, data);
                });

                // تفعيل الأزرار والتفاعلات
                container.querySelectorAll('.edit-restaurant-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        document.getElementById(`view-${id}`).classList.add('hidden');
                        document.getElementById(`edit-form-${id}`).classList.remove('hidden');
                    });
                });

                container.querySelectorAll('.cancel-edit-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        document.getElementById(`edit-form-${id}`).classList.add('hidden');
                        document.getElementById(`view-${id}`).classList.remove('hidden');
                    });
                });

                container.querySelectorAll('.save-restaurant-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const msg = document.getElementById(`edit-message-${id}`);
                        const name = document.getElementById(`edit-name-${id}`).value.trim();
                        const description = document.getElementById(`edit-description-${id}`).value.trim();
                        const phone = normalizeJordanPhone(document.getElementById(`edit-phone-${id}`).value);
                        const categories = getCheckedCategories(`edit-categories-${id}`);
                        const restaurantType = document.getElementById(`edit-type-${id}`).value === 'foodtruck' ? 'foodtruck' : 'home';
                        const status = document.getElementById(`edit-status-${id}`).value;
                        const imageFile = document.getElementById(`edit-image-${id}`).files[0];
                        const coverFile = document.getElementById(`edit-cover-${id}`).files[0];

                        if (!name) return;
                        if (categories.length === 0) {
                            msg.className = "form-msg err";
                            msg.innerText = "لازم تختاري تصنيف واحد على الأقل للمطعم.";
                            return;
                        }
                        if (imageFile) {
                            try {
                                const spec = restaurantImageSpec(restaurantType);
                                await enforceImageDimensions(imageFile, spec.w, spec.h, "صورة المطعم");
                            } catch (error) {
                                msg.className = "form-msg err";
                                msg.innerText = error.message;
                                return;
                            }
                        }
                        if (coverFile) {
                            try {
                                await enforceImageDimensions(coverFile, 1600, 700, "غلاف صفحة المطعم");
                            } catch (error) {
                                msg.className = "form-msg err";
                                msg.innerText = error.message;
                                return;
                            }
                        }

                        msg.className = "form-msg busy";
                        msg.innerText = "جاري الحفظ...";

                        try {
                            const updateData = { name, description, phone, categories, restaurantType, status };
                            if (imageFile) updateData.imageUrl = await uploadToImgbb(imageFile);
                            if (coverFile) updateData.coverImageUrl = await uploadToImgbb(coverFile);
                            await updateDoc(doc(db, "restaurants", id), updateData);
                            await refreshView();
                        } catch (error) {
                            msg.className = "form-msg err";
                            msg.innerText = "خطأ: " + error.message;
                        }
                    });
                });

                container.querySelectorAll('.manage-items-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const section = document.getElementById(`items-section-${id}`);
                        section.classList.toggle('hidden');
                        if (!section.classList.contains('hidden')) {
                            await loadMenuItems(id);
                        }
                    });
                });

                container.querySelectorAll('.manage-promo-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        document.getElementById(`promo-section-${id}`).classList.toggle('hidden');
                    });
                });

                // ربط نماذج رفع البانر/الفيديو لكل مطعم
                entries.forEach(({ id }) => bindPromoHandlers(id, isAdminMode));

                container.querySelectorAll('.save-delivery-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const msg = document.getElementById(`delivery-msg-${id}`);
                        const enabled = document.getElementById(`delivery-enabled-${id}`).checked;
                        const fee = parseFloat(document.getElementById(`delivery-fee-${id}`).value || 0);
                        if (!Number.isFinite(fee) || fee < 0) { msg.className='form-msg err'; msg.innerText='أدخل رسوم توصيل صحيحة.'; return; }
                        msg.className='form-msg busy'; msg.innerText='جاري الحفظ...'; btn.disabled=true;
                        try {
                            await updateDoc(doc(db, 'restaurants', id), { deliveryEnabled: enabled, deliveryFee: fee, updatedAt: serverTimestamp() });
                            msg.className='form-msg ok'; msg.innerText='تم حفظ إعدادات التوصيل ✓';
                        } catch (error) { msg.className='form-msg err'; msg.innerText='خطأ: '+error.message; }
                        finally { btn.disabled=false; }
                    });
                });

                container.querySelectorAll('.add-menu-category-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        document.getElementById(`menu-category-form-${id}`).classList.remove('hidden');
                        document.getElementById(`menu-category-name-${id}`).focus();
                    });
                });

                container.querySelectorAll('.save-menu-category-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const input = document.getElementById(`menu-category-name-${id}`);
                        const msg = document.getElementById(`menu-category-msg-${id}`);
                        const name = input.value.trim();
                        if (!name) { msg.className='form-msg err'; msg.innerText='اكتب اسم التصنيف.'; return; }
                        const restaurantSnap = await getDoc(doc(db, 'restaurants', id));
                        if (!restaurantSnap.exists()) return;
                        const current = getMenuCategoryList(restaurantSnap.data());
                        if (current.some(c => c.key === name)) { msg.className='form-msg err'; msg.innerText='هذا التصنيف موجود مسبقاً.'; return; }
                        msg.className='form-msg busy'; msg.innerText='جاري الحفظ...';
                        try {
                            const custom = Array.isArray(restaurantSnap.data().menuCategories) ? restaurantSnap.data().menuCategories : [];
                            await updateDoc(doc(db, 'restaurants', id), { menuCategories: [...custom, name] });
                            input.value='';
                            document.getElementById(`menu-category-form-${id}`).classList.add('hidden');
                            msg.className='form-msg ok'; msg.innerText='تمت إضافة التصنيف ✓';
                            await refreshView();
                        } catch (error) { msg.className='form-msg err'; msg.innerText='خطأ: '+error.message; }
                    });
                });

                // معالجة نموذج إضافة الصنف مع الوصف الجديد
                container.querySelectorAll('[id^="add-item-form-"]').forEach(form => {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const id = form.id.replace('add-item-form-', '');
                        const msg = document.getElementById(`item-message-${id}`);
                        const nameInput = document.getElementById(`item-name-${id}`);
                        const priceInput = document.getElementById(`item-price-${id}`);
                        const discountInput = document.getElementById(`item-discount-${id}`);
                        const descInput = document.getElementById(`item-desc-${id}`);
                        const categoryInput = document.getElementById(`item-category-${id}`);
                        const imageInput = document.getElementById(`item-image-${id}`);

                        const name = nameInput.value.trim();
                        const price = parseFloat(priceInput.value);
                        const discountPercent = parseFloat(discountInput.value || 0);
                        const description = descInput.value.trim();
                        const category = categoryInput.value;
                        const imageFile = imageInput.files[0];

                        if (!name || !Number.isFinite(price) || price < 0) return;
                        if (!Number.isFinite(discountPercent) || discountPercent < 0 || discountPercent > 100) {
                            msg.className = "form-msg err mt-2";
                            msg.innerText = "الخصم لازم يكون بين 0% و100%.";
                            return;
                        }
                        if (!category) {
                            msg.className = "form-msg err mt-2";
                            msg.innerText = "لازم تختار تصنيف الصنف.";
                            return;
                        }

                        if (imageFile) {
                            try {
                                await enforceImageDimensions(imageFile, 800, 800, "صورة الصنف");
                            } catch (error) {
                                msg.className = "form-msg err mt-2";
                                msg.innerText = error.message;
                                return;
                            }
                        }

                        msg.className = "form-msg busy mt-2";
                        msg.innerText = "جاري إضافة الوجبة...";

                        try {
                            let imageUrl = "";
                            if (imageFile) {
                                imageUrl = await uploadToImgbb(imageFile);
                            }

                            // حفظ الصنف مع الوصف والتصنيف الجديد في قاعدة البيانات
                            await addDoc(collection(db, "menuItems"), {
                                restaurantId: id,
                                name: name,
                                price: price,
                                discountPercent: discountPercent,
                                description: description,
                                category: category,
                                careTags: getCheckedCategories(`item-care-${id}`),
                                imageUrl: imageUrl,
                                popular: false,
                                createdAt: serverTimestamp(),
                                updatedAt: serverTimestamp()
                            });

                            nameInput.value = "";
                            priceInput.value = "";
                            discountInput.value = "0";
                            descInput.value = "";
                            categoryInput.value = "";
                            imageInput.value = "";
                            renderCareChips(`item-care-${id}`);
                            msg.className = "form-msg ok mt-2";
                            msg.innerText = "تمت إضافة الوجبة بنجاح!";
                            await loadMenuItems(id);
                        } catch (error) {
                            msg.className = "form-msg err mt-2";
                            msg.innerText = "خطأ: " + error.message;
                        }
                    });
                });
        }

        // ==== وضع الأدمن: اختيار أي مطعم من قائمة كل مطاعم المنصة وإدارته مباشرة ====
        let allRestaurantsCache = [];

        async function loadAdminPicker() {
            const box = document.getElementById('admin-restaurant-picker');
            if (!box) return;
            box.classList.remove('hidden');
            box.innerHTML = `
                <div class="panel p-5">
                    <label class="field-label">🔎 اختر مطعم لإدارته</label>
                    <input type="text" id="admin-restaurant-search" class="field" placeholder="اكتب اسم المطعم للبحث...">
                    <div id="admin-restaurant-results" class="mt-3 space-y-1.5 max-h-64 overflow-y-auto">
                        <div class="empty-state flex items-center justify-center gap-2"><span class="spinner"></span> جاري تحميل قائمة المطاعم...</div>
                    </div>
                </div>
            `;
            try {
                const snap = await getDocs(collection(db, "restaurants"));
                allRestaurantsCache = snap.docs.map(d => ({ id: d.id, name: d.data().name || 'مطعم بدون اسم', ownerEmail: d.data().ownerEmail || '' }));
                allRestaurantsCache.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                renderAdminResults(allRestaurantsCache);
            } catch (error) {
                document.getElementById('admin-restaurant-results').innerHTML = `<p class="form-msg err">تعذر تحميل قائمة المطاعم: ${error.message}</p>`;
            }
            document.getElementById('admin-restaurant-search').addEventListener('input', (e) => {
                const term = e.target.value.trim();
                const filtered = term ? allRestaurantsCache.filter(r => r.name.includes(term)) : allRestaurantsCache;
                renderAdminResults(filtered);
            });
        }

        function renderAdminResults(list) {
            const resultsBox = document.getElementById('admin-restaurant-results');
            if (!resultsBox) return;
            resultsBox.innerHTML = list.length ? list.map(r => `
                <button type="button" data-id="${r.id}" class="admin-pick-restaurant-btn btn btn-outline btn-sm btn-block" style="justify-content: flex-start;">
                    🍽️ <span class="font-semibold">${r.name}</span>
                    ${r.ownerEmail ? `<span class="text-xs" style="color: var(--ink-soft);">— ${r.ownerEmail}</span>` : ''}
                    ${r.id === adminSelectedRestaurantId ? `<span class="badge badge-live" style="margin-inline-start:auto;">قيد الإدارة الآن</span>` : ''}
                </button>
            `).join('') : `<p class="empty-state">ولا مطعم مطابق لبحثك</p>`;
            resultsBox.querySelectorAll('.admin-pick-restaurant-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    adminSelectedRestaurantId = btn.dataset.id;
                    renderAdminResults(list);
                    loadAdminRestaurant(adminSelectedRestaurantId);
                });
            });
        }

        async function loadAdminRestaurant(restaurantId) {
            const container = document.getElementById('restaurant-info');
            if (!restaurantId) {
                container.innerHTML = `<div class="panel p-6 empty-state">اختر مطعمًا من القائمة فوق للبدء بإدارته.</div>`;
                return;
            }
            container.innerHTML = `<div class="panel p-6 flex items-center justify-center gap-2 text-sm" style="color: var(--ink-soft);"><span class="spinner"></span> جاري تحميل بيانات المطعم...</div>`;
            try {
                const snap = await getDoc(doc(db, "restaurants", restaurantId));
                if (!snap.exists()) {
                    container.innerHTML = `<div class="panel p-6 empty-state">هذا المطعم غير موجود أو تم حذفه.</div>`;
                    return;
                }
                renderRestaurantEntries(container, [{ id: restaurantId, data: snap.data() }], true);
            } catch (error) {
                container.innerHTML = `<p class="form-msg err text-center">خطأ بتحميل المطعم: ${error.message}</p>`;
            }
        }

        async function loadMenuItems(restaurantId) {
            const listEl = document.getElementById(`items-list-${restaurantId}`);
            if (!listEl) return;
            listEl.innerHTML = `<div class="empty-state flex items-center justify-center gap-2"><span class="spinner"></span> جاري التحميل...</div>`;

            try {
                const restaurantSnap = await getDoc(doc(db, "restaurants", restaurantId));
                const restaurantData = restaurantSnap.exists() ? restaurantSnap.data() : {};
                const menuCategories = getMenuCategoryList(restaurantData);
                const q = query(collection(db, "menuItems"), where("restaurantId", "==", restaurantId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listEl.innerHTML = `<div class="empty-state">لا توجد أصناف مضافة بعد. ضيف أول صنف من النموذج تحت.</div>`;
                    return;
                }

                listEl.innerHTML = "";
                querySnapshot.forEach((itemDoc) => {
                    const item = itemDoc.data();
                    const image = item.imageUrl || item.image || "";
                    listEl.innerHTML += `
                        <div class="item-row block">
                            <div class="flex items-start gap-3 min-w-0">
                                ${image ? `<img src="${image}" class="w-16 h-16 object-cover rounded-xl shrink-0">` : `<div class="w-16 h-16 rounded-xl shrink-0 flex items-center justify-center" style="background:var(--sand);font-size:24px;">🍽️</div>`}
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h4 class="font-bold text-sm" style="color: var(--ink);">${item.name || 'بدون اسم'}</h4>
                                        ${item.popular ? `<span class="badge badge-live">🔥 الأكثر طلباً</span>` : ''}
                                    </div>
                                    <p class="text-xs mt-1" style="color: var(--ink-soft);">${item.description || 'بدون وصف'}</p>
                                    <div class="mt-2 flex items-center gap-2 flex-wrap">
                                        <strong style="color:var(--saffron);">${Number(item.price || 0).toFixed(2)} د.أ</strong>
                                        ${Number(item.discountPercent || 0) > 0 ? `<span class="badge" style="background:var(--red-tint);color:var(--red);">خصم ${Number(item.discountPercent)}%</span>` : ''}
                                        <span class="badge badge-cat">${(menuCategories.find(c => c.key === item.category)?.icon || '🍽️')} ${item.category || 'بدون تصنيف'}</span>
                                        ${cleanCareTags(item.careTags).map(t => `<span class="badge" style="background:#e8f0e5;color:#0b3b2c;">🤍 ${t}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3 flex gap-2 flex-wrap">
                                <button data-item-id="${itemDoc.id}" data-restaurant-id="${restaurantId}" class="edit-item-btn btn btn-outline btn-sm">${ICONS.edit} تعديل</button>
                                <button data-item-id="${itemDoc.id}" data-restaurant-id="${restaurantId}" class="delete-item-btn btn btn-ghost btn-sm" style="color: var(--red);">${ICONS.trash} حذف</button>
                            </div>
                            <div id="edit-item-${itemDoc.id}" class="hidden hairline mt-3 pt-3">
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div><label class="field-label">اسم الصنف</label><input id="edit-item-name-${itemDoc.id}" class="field" value="${(item.name || '').replace(/"/g,'&quot;')}"></div>
                                    <div><label class="field-label">السعر (د.أ)</label><input id="edit-item-price-${itemDoc.id}" type="number" min="0" step="0.01" class="field" value="${item.price ?? ''}"></div>
                                    <div><label class="field-label">الخصم (%)</label><input id="edit-item-discount-${itemDoc.id}" type="number" min="0" max="100" step="1" class="field" value="${item.discountPercent ?? 0}"></div>
                                </div>
                                <div class="mt-3"><label class="field-label">الوصف</label><textarea id="edit-item-desc-${itemDoc.id}" rows="2" class="field">${item.description || ''}</textarea></div>
                                <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div><label class="field-label">التصنيف</label><select id="edit-item-category-${itemDoc.id}" class="field"><option value="">بدون تصنيف</option>${menuCategoryOptions(menuCategories, item.category || '')}</select></div>
                                    <div>
                                        <label class="field-label">صورة جديدة <span class="field-hint">المقاس الإجباري 800×800 فقط</span></label>
                                        <input id="edit-item-image-${itemDoc.id}" type="file" accept="image/*" class="field-file">
                                        ${image ? `<label class="mt-2 flex items-center gap-2 text-xs font-semibold cursor-pointer"><input id="edit-item-remove-image-${itemDoc.id}" type="checkbox"> حذف الصورة الحالية</label>` : ''}
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <label class="field-label">سفرة العافية <span class="field-hint">اختياري</span></label>
                                    <div id="edit-item-care-${itemDoc.id}" class="category-chip-group"></div>
                                </div>
                                <label class="mt-3 flex items-center gap-2 text-sm font-semibold cursor-pointer"><input id="edit-item-popular-${itemDoc.id}" type="checkbox" ${item.popular ? 'checked' : ''}> 🔥 عرض ضمن «الأكثر طلباً»</label>
                                <div class="flex gap-2 mt-3 flex-wrap">
                                    <button type="button" data-item-id="${itemDoc.id}" data-restaurant-id="${restaurantId}" class="save-item-btn btn btn-primary btn-sm">حفظ التعديل</button>
                                    <button type="button" data-item-id="${itemDoc.id}" class="cancel-item-btn btn btn-ghost btn-sm">إلغاء</button>
                                    <span id="edit-item-msg-${itemDoc.id}" class="form-msg"></span>
                                </div>
                            </div>
                        </div>`;
                });

                // الشرائح بتنرسم بعد ما يخلص بناء القائمة كلها (لأن += بيعيد بناء العناصر)
                querySnapshot.forEach((itemDoc) => renderCareChips(`edit-item-care-${itemDoc.id}`, cleanCareTags(itemDoc.data().careTags)));

                listEl.querySelectorAll('.edit-item-btn').forEach(btn => btn.addEventListener('click', () => {
                    document.getElementById(`edit-item-${btn.dataset.itemId}`).classList.toggle('hidden');
                }));
                listEl.querySelectorAll('.cancel-item-btn').forEach(btn => btn.addEventListener('click', () => {
                    document.getElementById(`edit-item-${btn.dataset.itemId}`).classList.add('hidden');
                }));

                listEl.querySelectorAll('.save-item-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const itemId = btn.dataset.itemId;
                        const msg = document.getElementById(`edit-item-msg-${itemId}`);
                        const name = document.getElementById(`edit-item-name-${itemId}`).value.trim();
                        const price = parseFloat(document.getElementById(`edit-item-price-${itemId}`).value);
                        const discountPercent = parseFloat(document.getElementById(`edit-item-discount-${itemId}`).value || 0);
                        const description = document.getElementById(`edit-item-desc-${itemId}`).value.trim();
                        const category = document.getElementById(`edit-item-category-${itemId}`).value;
                        const imageFile = document.getElementById(`edit-item-image-${itemId}`).files[0];
                        const removeImageEl = document.getElementById(`edit-item-remove-image-${itemId}`);
                        const removeImage = !!removeImageEl?.checked;
                        const popular = document.getElementById(`edit-item-popular-${itemId}`).checked;
                        if (!name || !Number.isFinite(price) || price < 0) { msg.className='form-msg err'; msg.innerText='أدخل اسم وسعر صحيح.'; return; }
                        if (!Number.isFinite(discountPercent) || discountPercent < 0 || discountPercent > 100) { msg.className='form-msg err'; msg.innerText='الخصم لازم يكون بين 0% و100%.'; return; }
                        if (imageFile && removeImage) { msg.className='form-msg err'; msg.innerText='اختاري تغيير الصورة أو حذفها، وليس الاثنين معاً.'; return; }
                        if (imageFile) {
                            try { await enforceImageDimensions(imageFile, 800, 800, 'صورة الصنف'); }
                            catch (error) { msg.className='form-msg err'; msg.innerText=error.message; return; }
                        }
                        msg.className='form-msg busy'; msg.innerText='جاري الحفظ...'; btn.disabled=true;
                        try {
                            const updateData = { name, price, discountPercent, description, category, popular, careTags: getCheckedCategories(`edit-item-care-${itemId}`), updatedAt: serverTimestamp() };
                            if (imageFile) updateData.imageUrl = await uploadToImgbb(imageFile);
                            if (removeImage) updateData.imageUrl = "";
                            await updateDoc(doc(db, 'menuItems', itemId), updateData);
                            msg.className='form-msg ok'; msg.innerText='تم الحفظ ✓';
                            await loadMenuItems(restaurantId);
                        } catch (error) { msg.className='form-msg err'; msg.innerText='خطأ: '+error.message; btn.disabled=false; }
                    });
                });

                listEl.querySelectorAll('.delete-item-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('هل تريد حذف هذا الصنف نهائياً من المنيو؟')) return;
                        try {
                            await deleteDoc(doc(db, "menuItems", btn.dataset.itemId));
                            await loadMenuItems(btn.dataset.restaurantId);
                        } catch (error) { console.error("خطأ في حذف الصنف:", error); alert('تعذر حذف الصنف: ' + error.message); }
                    });
                });
            } catch (error) {
                listEl.innerHTML = `<p class="form-msg err">خطأ بتحميل الأصناف: ${error.message}</p>`;
            }
        }

        function renderMenuCategoryManager(restaurantId, data) {
            const box = document.getElementById(`menu-categories-${restaurantId}`);
            if (!box) return;
            const custom = Array.isArray(data.menuCategories) ? data.menuCategories : [];
            const customNames = custom.map(c => typeof c === 'string' ? c : c.key).filter(Boolean);
            box.innerHTML = customNames.length
                ? customNames.map(name => `<span class="badge badge-cat">${name}<button type="button" data-category="${name.replace(/"/g,'&quot;')}" data-id="${restaurantId}" class="delete-menu-category-btn" style="border:0;background:none;color:var(--red);cursor:pointer;font-weight:800;">×</button></span>`).join('')
                : `<span class="text-xs" style="color:var(--ink-soft);">لا توجد تصنيفات خاصة بعد. التصنيفات الأساسية متاحة تلقائياً.</span>`;
            box.querySelectorAll('.delete-menu-category-btn').forEach(btn => btn.addEventListener('click', async () => {
                const name = btn.dataset.category;
                if (!confirm(`حذف التصنيف «${name}»؟ الأصناف الموجودة عليه ستبقى، لكن ستظهر كتصنيف غير موجود ضمن الفلاتر حتى تغيّر تصنيفها.`)) return;
                try {
                    const snap = await getDoc(doc(db,'restaurants',restaurantId));
                    const current = Array.isArray(snap.data()?.menuCategories) ? snap.data().menuCategories : [];
                    await updateDoc(doc(db,'restaurants',restaurantId), { menuCategories: current.filter(c => (typeof c === 'string' ? c : c.key) !== name) });
                    await refreshView();
                } catch(error) { alert('تعذر حذف التصنيف: ' + error.message); }
            }));
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "Auth.html";
            });
        }
    </script>
</head>
<body class="app-wide min-h-screen" style="background: var(--sand);">

    <header class="bg-white flex flex-wrap items-center justify-between gap-3 px-4 sm:px-8" style="padding: 14px 16px calc(14px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line);">
        <div class="flex items-center gap-2.5 min-w-0">
            <img src="logo.png" alt="سفرة" class="h-9 w-9 object-contain rounded-full shrink-0" style="border: 1.5px solid var(--line);">
            <div class="min-w-0 leading-tight">
                <p class="font-display font-extrabold truncate" style="font-size: 19px; color: var(--green-deep);">سفرة</p>
                <p class="text-[11px] truncate" style="color: var(--ink-soft);">لوحة تحكم المطعم</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
            <a href="home.html" id="nav-home-link" class="btn btn-ghost btn-sm">الرئيسية</a>
            <a href="adman.html" id="nav-orders-link" class="btn btn-ghost btn-sm">إدارة الطلبات</a>
            <a href="subscription.html" id="nav-subscription-link" class="btn btn-ghost btn-sm">اشتراكي</a>
            <a href="admin-dashboard.html" id="nav-admin-link" class="btn btn-ghost btn-sm hidden">🔙 لوحة الإدارة</a>
            <span id="user-email" class="hidden sm:inline text-xs font-medium ms-1" style="color: var(--ink-soft);"></span>
            <button onclick="logout()" class="btn btn-danger-ghost btn-sm">خروج</button>
        </div>
    </header>

    <main class="p-4 sm:p-6">
        <div id="subscription-banner" class="mb-5"></div>
        <div class="mb-4">
            <h2 id="page-title" class="font-display font-extrabold" style="font-size: 22px; color: var(--green-deep);">مطعمي</h2>
            <p id="page-subtitle" class="text-sm" style="color: var(--ink-soft);">بيانات مطعمك، تصنيفاته، وقائمة الأصناف من مكان وحد.</p>
        </div>
        <div id="admin-restaurant-picker" class="hidden mb-5"></div>
        <div id="restaurant-info" class="grid grid-cols-1 gap-4">
            <div class="panel p-6 flex items-center justify-center gap-2 text-sm" style="color: var(--ink-soft);">
                <span class="spinner"></span> جاري تحميل بيانات مطعمك...
            </div>
        </div>
    </main>

</body>
</html>
