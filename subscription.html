<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الاشتراكات - منصة سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .type-tab {
            flex: 1; text-align: center; padding: 10px 6px; border-radius: 12px; font-size: 12.5px;
            font-weight: 700; cursor: pointer; border: 1.5px solid #e5e7eb; background: #fff; color: #6b7280;
            transition: all .15s ease;
        }
        .type-tab i { display: block; font-size: 16px; margin-bottom: 4px; }
        .type-tab.active { border-color: #d97706; background: #fff7ed; color: #b45309; }
    </style>
    <link rel="stylesheet" href="safra-3d.css">
</head>
<body class="app-wide bg-safra-cream font-sans min-h-screen text-gray-800">

    <header class="bg-white shadow p-3 sm:p-4 flex flex-wrap justify-between items-center gap-2 px-4 sm:px-8" style="padding-top: calc(0.75rem + env(safe-area-inset-top));">
        <div class="flex items-center gap-2 min-w-0">
            <img src="logo.png" alt="سفرة" class="h-8 w-8 sm:h-9 sm:w-9 object-contain rounded-full shrink-0">
            <h1 class="text-sm sm:text-lg font-bold text-safra-gold truncate">اشتراكات المطعم</h1>
        </div>
        <a href="restaurant-dashboard.html" class="text-xs sm:text-sm text-gray-600 hover:text-safra-gold font-medium">
            <i class="fa-solid fa-arrow-right ml-1"></i> رجوع
        </a>
    </header>

    <main class="max-w-2xl mx-auto p-4 sm:p-6">

        <div id="global-status" class="text-center text-gray-500 py-10">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-safra-gold mb-3"></i>
            <p>جاري التحقق من حالة حسابك...</p>
        </div>

        <div id="type-tabs" class="hidden grid grid-cols-3 gap-2 mb-5"></div>

        <!-- يُملأ ديناميكياً حسب حالة الاشتراك ونوعه -->
        <div id="content" class="hidden space-y-6"></div>

    </main>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            collection, query, where, getDocs, addDoc, updateDoc, doc, getDoc,
            serverTimestamp, Timestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==== رقم الدفع عبر CliQ ====
        const CLIQ_NUMBER = "0787000190";

        // ==== رفع صور سكرين شوت الاشتراك عبر imgbb (بديل مجاني عن Firebase Storage) ====
        const IMGBB_API_KEY = "7dfc52facabaef7d38eddf1c83976c5d";

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function uploadToImgbb(file) {
            const base64 = await fileToBase64(file);
            const formData = new FormData();
            formData.append("image", base64);

            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();

            if (!data.success) {
                throw new Error(data.error?.message || "فشل رفع الصورة على imgbb");
            }
            return data.data.url;
        }

        // ==============================================================
        // 3 أنواع اشتراك مستقلة تمامًا عن بعضها: أساسي / بانر / فيديو.
        // كل نوع إله طلب اشتراك، تفعيل، وحالة منفصلة تمامًا بوثيقة المطعم.
        // ==============================================================
        const TYPE_CONFIG = {
            basic: {
                key: "أساسي",
                label: "الاشتراك الأساسي",
                icon: "fa-store",
                tagline: "تفعيل مطعمك للظهور واستقبال الطلبات على المنصة",
                statusField: "subscriptionStatus",
                endDateField: "subscriptionEndDate",
            },
            banner: {
                key: "بانر",
                label: "بانر الرئيسية",
                icon: "fa-image",
                tagline: "إظهار بانر مطعمك بأعلى الصفحة الرئيسية لكل الزوار",
                statusField: "bannerSubscriptionStatus",
                endDateField: "bannerSubscriptionEndDate",
            },
            video: {
                key: "فيديو",
                label: "فيديو المطعم",
                icon: "fa-video",
                tagline: "إظهار فيديو ترويجي لمطعمك بقسم الفيديوهات بالرئيسية",
                statusField: "videoSubscriptionStatus",
                endDateField: "videoSubscriptionEndDate",
            }
        };

        const globalStatus = document.getElementById('global-status');
        const typeTabs = document.getElementById('type-tabs');
        const content = document.getElementById('content');

        let currentUser = null;
        let myRestaurant = null; // { id, name, ... }
        let activeType = 'basic';
        let trialCountdownInterval = null; // مؤقت العد التنازلي للفترة التجريبية (لازم نلغيه عند تغيير التبويب)

        // كل الاشتراكات (كل الأنواع) لهذا المطعم — نجيبهم مرة وحدة ونفلتر بالجافاسكربت
        // (نفس أسلوب المشروع: تفادي orderBy + where معًا لتفادي الحاجة لفهرس مركّب)
        let allSubscriptions = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "Auth.html";
                return;
            }
            currentUser = user;
            await bootstrap();
        });

        async function bootstrap() {
            try {
                const rq = query(collection(db, "restaurants"), where("ownerEmail", "==", currentUser.email));
                const rSnap = await getDocs(rq);

                if (rSnap.empty) {
                    globalStatus.innerHTML = `
                        <i class="fa-solid fa-store-slash text-3xl text-gray-400 mb-3"></i>
                        <p class="text-gray-700 font-semibold">لازم تنشئ مطعمك الأول قبل ما تشترك.</p>
                        <a href="restaurant-dashboard.html" class="inline-block mt-4 bg-safra-gold text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-safra-gold-dark transition">إنشاء مطعمي الآن</a>
                    `;
                    return;
                }

                const rDoc = rSnap.docs[0];
                myRestaurant = { id: rDoc.id, ...rDoc.data() };

                const sq = query(
                    collection(db, "subscriptions"),
                    where("ownerUid", "==", currentUser.uid),
                    where("restaurantId", "==", myRestaurant.id)
                );
                const sSnap = await getDocs(sq);
                allSubscriptions = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                globalStatus.classList.add('hidden');
                typeTabs.classList.remove('hidden');
                content.classList.remove('hidden');

                renderTabs();
                await renderType(activeType);
            } catch (error) {
                globalStatus.innerHTML = `<p class="text-red-500">حدث خطأ: ${error.message}</p>`;
            }
        }

        function renderTabs() {
            typeTabs.innerHTML = Object.entries(TYPE_CONFIG).map(([typeId, cfg]) => `
                <button type="button" data-type="${typeId}" class="type-tab ${typeId === activeType ? 'active' : ''}">
                    <i class="fa-solid ${cfg.icon}"></i> ${cfg.label}
                </button>
            `).join('');
            typeTabs.querySelectorAll('.type-tab').forEach(btn => {
                btn.addEventListener('click', async () => {
                    activeType = btn.dataset.type;
                    renderTabs();
                    content.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;
                    await renderType(activeType);
                });
            });
        }

        // بيرجع أحدث طلب اشتراك من نوع معيّن لهذا المطعم (الأحدث بـ createdAt)
        // ملاحظة توافق: الطلبات القديمة (قبل ميزة الأنواع) ما فيها حقل type، فبنعتبرها "أساسي"
        function latestSubForType(typeId) {
            const key = TYPE_CONFIG[typeId].key;
            const subs = allSubscriptions.filter(s => (s.type || TYPE_CONFIG.basic.key) === key);
            subs.sort((a, b) => {
                const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                return tb - ta;
            });
            return subs.length ? subs[0] : null;
        }

        function fmtDate(ts) {
            try {
                const d = ts?.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return '-'; }
        }

        async function renderType(typeId) {
            const cfg = TYPE_CONFIG[typeId];
            const sub = latestSubForType(typeId);

            if (trialCountdownInterval) {
                clearInterval(trialCountdownInterval);
                trialCountdownInterval = null;
            }

            content.innerHTML = `<p class="text-xs text-gray-500 text-center -mt-2 mb-1">${cfg.tagline}</p>`;
            await renderContent(typeId, sub);
        }

        async function renderContent(typeId, sub) {
            const cfg = TYPE_CONFIG[typeId];

            // ====== الشهر الأول مجاني (فترة تجريبية) — فقط للاشتراك الأساسي، ولا يوجد
            // طلب اشتراك فعلي (مدفوع) بعد لهذا المطعم. الحقول مأخوذة مباشرة من وثيقة
            // المطعم لأنها بتنعبّى تلقائيًا لحظة إنشاء المطعم (شوف restaurant-dashboard.html) ======
            if (typeId === 'basic' && !sub && myRestaurant.subscriptionStatus === "تجريبي") {
                const trialEnd = myRestaurant.trialEndsAt?.toDate
                    ? myRestaurant.trialEndsAt.toDate()
                    : (myRestaurant.subscriptionEndDate?.toDate ? myRestaurant.subscriptionEndDate.toDate() : null);

                if (trialEnd && trialEnd.getTime() > Date.now()) {
                    renderTrialCountdown(typeId, trialEnd);
                    return;
                }

                // انتهت الفترة التجريبية: حدّث حالة المطعم مرة وحدة، وكمل الكود تحت
                // بشكل طبيعي (رح يعرض خطط الاشتراك العادية لأنه ما في sub فعلي بعد)
                if (trialEnd) {
                    try {
                        await updateDoc(doc(db, "restaurants", myRestaurant.id), { subscriptionStatus: "منتهي" });
                        myRestaurant.subscriptionStatus = "منتهي";
                    } catch (e) { /* تجاهل، بيتحدث لاحقًا */ }
                }
            }

            // اشتراك فعّال وما زال ساري
            if (sub && sub.status === "نشط") {
                const end = sub.endDate?.toDate ? sub.endDate.toDate() : new Date(sub.endDate);
                const expired = end && end.getTime() < Date.now();

                if (!expired) {
                    content.innerHTML += `
                        <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-center">
                            <i class="fa-solid fa-circle-check text-4xl text-green-600 mb-3"></i>
                            <h2 class="text-lg font-bold text-green-800 mb-1">${cfg.label} فعّال ✅</h2>
                            <p class="text-green-700 text-sm">مطعم "${myRestaurant.name}" مفعّل بهذا الاشتراك حتى تاريخ <span class="font-semibold">${fmtDate(sub.endDate)}</span></p>
                        </div>
                    `;
                    return;
                }
                // منتهي فعليًا: حدّث الحالة تلقائيًا ثم أعد الرسم كطلب جديد
                await markExpired(typeId, sub);
                sub = { ...sub, status: "منتهي" };
            }

            // قيد المراجعة (رفع السكرين شوت وبانتظار الأدمن)
            if (sub && sub.status === "قيد المراجعة") {
                content.innerHTML += `
                    <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-center">
                        <i class="fa-solid fa-hourglass-half text-4xl text-yellow-600 mb-3"></i>
                        <h2 class="text-lg font-bold text-yellow-800 mb-1">طلب ${cfg.label} قيد المراجعة</h2>
                        <p class="text-yellow-700 text-sm">استلمنا إثبات التحويل الخاص فيك، وبيتم مراجعته يدويًا من فريق سفرة. رح نرسلّك كود تفعيل أو نفعّل حسابك مباشرة خلال وقت قصير.</p>
                        ${sub.screenshotUrl ? `<a href="${sub.screenshotUrl}" target="_blank" class="inline-block mt-4 text-sm text-safra-gold underline">عرض السكرين شوت المرفوع</a>` : ''}
                    </div>
                `;
                return;
            }

            // بانتظار إدخال كود التفعيل (الأدمن راجع الطلب وولّد كود وأرسله يدويًا)
            if (sub && sub.status === "بانتظار كود التفعيل") {
                content.innerHTML += `
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-6">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-key text-4xl text-blue-600 mb-3"></i>
                            <h2 class="text-lg font-bold text-blue-800 mb-1">جاهز للتفعيل!</h2>
                            <p class="text-blue-700 text-sm">فريق سفرة راجع طلبك ورح يرسلك كود تفعيل عبر اتصال/واتساب. أدخل الكود تحت لتفعيل ${cfg.label} فورًا.</p>
                        </div>
                        <form id="code-form" class="flex flex-col sm:flex-row gap-2 max-w-sm mx-auto">
                            <input type="text" id="code-input" required placeholder="أدخل كود التفعيل" class="flex-1 px-3 py-2 border rounded-lg text-center tracking-widest font-mono focus:outline-none focus:ring-2 focus:ring-safra-gold" maxlength="10">
                            <button type="submit" class="bg-safra-green text-white px-5 py-2 rounded-lg font-semibold hover:bg-safra-dark transition">تفعيل</button>
                        </form>
                        <p id="code-message" class="text-center text-sm font-semibold mt-3"></p>
                    </div>
                `;
                document.getElementById('code-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await activateWithCode(typeId, sub);
                });
                return;
            }

            // لا يوجد اشتراك من هالنوع، أو تم رفضه، أو انتهى: اعرض خطط هالنوع
            await renderPlanSelection(typeId, sub);
        }

        function renderTrialCountdown(typeId, trialEnd) {
            const cfg = TYPE_CONFIG[typeId];

            content.innerHTML += `
                <div class="bg-white border-2 border-safra-gold rounded-xl p-6 text-center">
                    <i class="fa-solid fa-gift text-4xl text-safra-gold mb-3"></i>
                    <h2 class="text-lg font-bold text-safra-dark mb-1">أول شهر مجاني 🎉</h2>
                    <p class="text-gray-600 text-sm mb-4">مطعم "${myRestaurant.name}" مفعّل مجانًا على ${cfg.label} حتى تاريخ <span class="font-semibold">${fmtDate(Timestamp.fromDate(trialEnd))}</span>. بعد انتهاء الفترة، اختر خطة اشتراك وادفع للاستمرار بدون انقطاع.</p>

                    <div id="trial-countdown" class="grid grid-cols-4 gap-2 max-w-xs mx-auto mb-5"></div>

                    <button type="button" id="choose-plan-early-btn" class="text-sm text-safra-gold underline font-semibold">اختر خطة اشتراك الآن</button>
                </div>
            `;

            const countdownEl = document.getElementById('trial-countdown');
            const unitLabel = (value, label) => `
                <div class="bg-safra-cream rounded-lg py-2">
                    <div class="text-xl font-black text-safra-dark tabular-nums">${String(value).padStart(2, '0')}</div>
                    <div class="text-[10px] text-gray-500">${label}</div>
                </div>`;

            function tick() {
                const remainingMs = trialEnd.getTime() - Date.now();
                if (remainingMs <= 0) {
                    clearInterval(trialCountdownInterval);
                    trialCountdownInterval = null;
                    renderType(typeId); // انتهت الفترة التجريبية أثناء وجود المستخدم على الصفحة: أعد الرسم
                    return;
                }
                const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remainingMs / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((remainingMs / (1000 * 60)) % 60);
                const seconds = Math.floor((remainingMs / 1000) % 60);
                countdownEl.innerHTML =
                    unitLabel(days, 'يوم') + unitLabel(hours, 'ساعة') + unitLabel(minutes, 'دقيقة') + unitLabel(seconds, 'ثانية');
            }

            tick();
            trialCountdownInterval = setInterval(tick, 1000);

            document.getElementById('choose-plan-early-btn').addEventListener('click', () => {
                if (trialCountdownInterval) {
                    clearInterval(trialCountdownInterval);
                    trialCountdownInterval = null;
                }
                renderPlanSelection(typeId, null);
            });
        }

        async function markExpired(typeId, sub) {
            const cfg = TYPE_CONFIG[typeId];
            try {
                await updateDoc(doc(db, "subscriptions", sub.id), { status: "منتهي" });
                await updateDoc(doc(db, "restaurants", myRestaurant.id), { [cfg.statusField]: "منتهي" });
            } catch (e) { /* تجاهل، بيتحدث لاحقًا */ }
        }

        async function renderPlanSelection(typeId, previousSub) {
            const cfg = TYPE_CONFIG[typeId];
            const plansSnap = await getDocs(query(collection(db, "subscriptionPlans"), where("active", "==", true)));

            // خطط قديمة (قبل ميزة الأنواع) ما فيها حقل type — نعتبرها "أساسي" تلقائيًا للتوافق
            const plans = plansSnap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(p => (p.type || TYPE_CONFIG.basic.key) === cfg.key);

            let banner = "";
            if (previousSub && previousSub.status === "مرفوض") {
                banner = `
                    <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center text-sm text-red-700">
                        <i class="fa-solid fa-circle-xmark mr-1"></i>
                        تم رفض طلب ${cfg.label} السابق${previousSub.adminNote ? `: ${previousSub.adminNote}` : ''}. فيك تعيد المحاولة تحت.
                    </div>`;
            } else if (previousSub && previousSub.status === "منتهي") {
                banner = `
                    <div class="bg-orange-50 border border-orange-200 rounded-xl p-4 text-center text-sm text-orange-700">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                        انتهت مدة ${cfg.label}. جدّد الاشتراك تحت للاستمرار.
                    </div>`;
            }

            if (plans.length === 0) {
                content.innerHTML += `
                    ${banner}
                    <div class="bg-white border border-gray-200 rounded-xl p-6 text-center">
                        <p class="text-gray-600">ما في خطط "${cfg.label}" متاحة حاليًا. تواصل مع إدارة سفرة على الرقم
                        <span class="font-mono font-bold text-safra-gold">${CLIQ_NUMBER}</span> لتفعيل حسابك.</p>
                    </div>
                `;
                return;
            }

            content.innerHTML += `
                ${banner}
                <div class="bg-white border border-gray-200 rounded-xl p-5">
                    <h2 class="font-bold text-gray-800 mb-3">1) اختر خطة ${cfg.label}</h2>
                    <div id="plans-list" class="grid sm:grid-cols-2 gap-3">
                        ${plans.map(p => `
                            <label class="plan-card cursor-pointer border-2 border-gray-200 rounded-lg p-4 flex flex-col gap-1 hover:border-safra-gold transition">
                                <div class="flex items-center gap-2">
                                    <input type="radio" name="plan" value="${p.id}" class="accent-safra-gold" required>
                                    <span class="font-bold text-gray-800">${p.name}</span>
                                </div>
                                <span class="text-safra-gold font-bold text-lg">${p.price} د.أ</span>
                                <span class="text-xs text-gray-500">مدة الاشتراك: ${p.durationDays} يوم</span>
                                ${p.description ? `<span class="text-xs text-gray-500 mt-1">${p.description}</span>` : ''}
                            </label>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-xl p-5">
                    <h2 class="font-bold text-gray-800 mb-3">2) حوّل المبلغ عبر CliQ</h2>
                    <div class="bg-safra-cream border border-dashed border-safra-gold rounded-lg p-4 text-center">
                        <p class="text-sm text-gray-600 mb-1">رقم CliQ الخاص بمنصة سفرة</p>
                        <p class="text-2xl font-black text-safra-gold font-mono tracking-wider">${CLIQ_NUMBER}</p>
                        <button type="button" id="copy-cliq" class="mt-2 text-xs text-gray-500 hover:text-safra-gold underline">نسخ الرقم</button>
                    </div>
                    <p class="text-xs text-gray-500 mt-3">حوّل قيمة الخطة يلي اخترتها فوق، واكتب اسم مطعمك "${myRestaurant.name}" وكلمة "${cfg.label}" في ملاحظة التحويل إذا أمكن.</p>
                </div>

                <div class="bg-white border border-gray-200 rounded-xl p-5">
                    <h2 class="font-bold text-gray-800 mb-3">3) ارفع سكرين شوت الحوالة</h2>
                    <form id="sub-form" class="space-y-3">
                        <input type="file" id="screenshot-input" accept="image/*" required class="w-full text-sm border rounded-lg p-2">
                        <button type="submit" id="submit-btn" class="w-full bg-safra-gold text-white py-3 rounded-lg font-semibold hover:bg-safra-gold-dark transition">إرسال طلب الاشتراك</button>
                        <p id="sub-message" class="text-center text-sm font-semibold"></p>
                    </form>
                </div>
            `;

            document.getElementById('copy-cliq').addEventListener('click', () => {
                navigator.clipboard.writeText(CLIQ_NUMBER);
                const btn = document.getElementById('copy-cliq');
                btn.innerText = "تم النسخ ✓";
                setTimeout(() => btn.innerText = "نسخ الرقم", 1500);
            });

            document.getElementById('sub-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = document.getElementById('sub-message');
                const submitBtn = document.getElementById('submit-btn');
                const selectedPlan = document.querySelector('input[name="plan"]:checked');
                const file = document.getElementById('screenshot-input').files[0];

                if (!selectedPlan) {
                    msg.className = "text-center text-sm font-semibold text-red-500";
                    msg.innerText = "اختر خطة اشتراك أولاً.";
                    return;
                }
                if (!file) {
                    msg.className = "text-center text-sm font-semibold text-red-500";
                    msg.innerText = "لازم ترفع سكرين شوت الحوالة.";
                    return;
                }

                const plan = plans.find(p => p.id === selectedPlan.value);
                submitBtn.disabled = true;
                msg.className = "text-center text-sm font-semibold text-blue-600";
                msg.innerText = "جاري رفع السكرين شوت وإرسال الطلب...";

                try {
                    const screenshotUrl = await uploadToImgbb(file);

                    await addDoc(collection(db, "subscriptions"), {
                        type: cfg.key,
                        restaurantId: myRestaurant.id,
                        restaurantName: myRestaurant.name,
                        ownerUid: currentUser.uid,
                        ownerEmail: currentUser.email,
                        planId: plan.id,
                        planName: plan.name,
                        price: plan.price,
                        durationDays: plan.durationDays,
                        paymentMethod: "CliQ",
                        cliqNumber: CLIQ_NUMBER,
                        screenshotUrl,
                        status: "قيد المراجعة",
                        createdAt: serverTimestamp()
                    });

                    await updateDoc(doc(db, "restaurants", myRestaurant.id), {
                        [TYPE_CONFIG[typeId].statusField]: "قيد المراجعة"
                    });

                    msg.className = "text-center text-sm font-semibold text-green-600";
                    msg.innerText = "تم إرسال طلبك بنجاح! بيتم تحويله لحالة قيد المراجعة.";
                    setTimeout(() => location.reload(), 1200);
                } catch (error) {
                    submitBtn.disabled = false;
                    msg.className = "text-center text-sm font-semibold text-red-500";
                    msg.innerText = "خطأ: " + error.message;
                }
            });
        }

        async function activateWithCode(typeId, sub) {
            const cfg = TYPE_CONFIG[typeId];
            const msg = document.getElementById('code-message');
            const codeInput = document.getElementById('code-input');
            const enteredCode = codeInput.value.trim();

            if (!enteredCode) return;

            msg.className = "text-center text-sm font-semibold mt-3 text-blue-600";
            msg.innerText = "جاري التحقق من الكود...";

            try {
                const start = new Date();
                const end = new Date(start.getTime() + (sub.durationDays || 30) * 24 * 60 * 60 * 1000);

                await updateDoc(doc(db, "subscriptions", sub.id), {
                    status: "نشط",
                    enteredCode: enteredCode,
                    startDate: Timestamp.fromDate(start),
                    endDate: Timestamp.fromDate(end),
                    activatedAt: serverTimestamp()
                });

                await updateDoc(doc(db, "restaurants", myRestaurant.id), {
                    [cfg.statusField]: "نشط",
                    [cfg.endDateField]: Timestamp.fromDate(end)
                });

                msg.className = "text-center text-sm font-semibold mt-3 text-green-600";
                msg.innerText = `تم تفعيل ${cfg.label} بنجاح! 🎉`;
                setTimeout(() => location.reload(), 1000);
            } catch (error) {
                msg.className = "text-center text-sm font-semibold mt-3 text-red-500";
                msg.innerText = "الكود غير صحيح أو حدث خطأ. تأكد من الكود وحاول مرة ثانية.";
            }
        }
    </script>
</body>
</html>
