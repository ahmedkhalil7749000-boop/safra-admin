<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تأكيد الطلب - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-5 text-center">إتمام الطلب</h1>

        <div id="login-warning" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-4 mb-4 text-center">
            لازم تسجل دخول الأول عشان تكمل الطلب.
            <a href="Auth.html" class="text-safra-gold font-semibold hover:underline">سجّل دخول</a>
        </div>

        <form id="checkout-form" class="bg-white rounded-lg shadow-md border border-gray-200 p-4 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">العنوان</label>
                <input type="text" id="address" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold" placeholder="مثال: عمان - الدوار السابع - عمارة 12">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">طريقة الدفع</label>
                <select id="payment-method" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold">
                    <option value="cash">الدفع عند الاستلام (كاش)</option>
                    <option value="card">بطاقة ائتمان</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ملاحظات (اختياري)</label>
                <textarea id="notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold" placeholder="مثال: بدون بصل"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">موعد الطلب</label>
                <div class="flex gap-4 mb-2">
                    <label class="flex items-center gap-1.5 text-sm cursor-pointer">
                        <input type="radio" name="order-timing" id="timing-now" value="now" checked class="accent-safra-gold">
                        <span>الآن (فوري)</span>
                    </label>
                    <label class="flex items-center gap-1.5 text-sm cursor-pointer">
                        <input type="radio" name="order-timing" id="timing-scheduled" value="scheduled" class="accent-safra-gold">
                        <span>طلب مسبق (حدد الوقت)</span>
                    </label>
                </div>
                <div id="scheduled-time-wrapper" class="hidden">
                    <input type="datetime-local" id="scheduled-time" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold">
                    <p id="schedule-hint" class="text-xs text-gray-500 mt-1"></p>
                    <p id="schedule-error" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>
            </div>

            <div class="border-t pt-3 text-sm text-gray-700">
                <div class="flex justify-between"><span>مجموع الأصناف</span><span id="ck-subtotal">0.00 د.أ</span></div>
                <div class="flex justify-between"><span id="ck-fee-label">رسوم التوصيل</span><span id="ck-fee">0.00 د.أ</span></div>
                <div class="flex justify-between font-bold text-gray-900 mt-1"><span>الإجمالي الكلي</span><span id="ck-total">0.00 د.أ</span></div>
                <p id="ck-multi-hint" class="hidden text-xs text-gray-500 mt-2">
                    ملاحظة: سلتك فيها أكتر من مطعم، فرح ينبعث كل مطعم كطلب منفصل لصاحبه.
                </p>
            </div>

            <button type="submit" id="confirm-btn" class="w-full bg-safra-gold text-white py-2 rounded-lg font-semibold hover:bg-safra-gold-dark transition">تأكيد الطلب</button>
        </form>

        <p id="message" class="text-center text-sm mt-4 font-semibold"></p>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getCart as getCartService, clearCart, groupCartByRestaurant } from "./cart-service.js";

        const DELIVERY_FEE = 1.5;
        const form = document.getElementById('checkout-form');
        const message = document.getElementById('message');
        const loginWarning = document.getElementById('login-warning');
        const confirmBtn = document.getElementById('confirm-btn');

        // ===== منطق الطلب المسبق (جدولة الطلب) =====
        const MIN_LEAD_MINUTES = 30;   // أقل مدة مسموحة قبل موعد التسليم
        const MAX_LEAD_DAYS = 7;       // أقصى مدة يمكن الجدولة لها مسبقاً

        const timingNow = document.getElementById('timing-now');
        const timingScheduled = document.getElementById('timing-scheduled');
        const scheduledWrapper = document.getElementById('scheduled-time-wrapper');
        const scheduledInput = document.getElementById('scheduled-time');
        const scheduleHint = document.getElementById('schedule-hint');
        const scheduleError = document.getElementById('schedule-error');

        // تحويل تاريخ JS لصيغة تقبلها خاصية datetime-local (بالتوقيت المحلي)
        function toLocalInputValue(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function setupScheduleBounds() {
            const now = new Date();
            const minDate = new Date(now.getTime() + MIN_LEAD_MINUTES * 60000);
            const maxDate = new Date(now.getTime() + MAX_LEAD_DAYS * 24 * 60 * 60000);
            scheduledInput.min = toLocalInputValue(minDate);
            scheduledInput.max = toLocalInputValue(maxDate);
            scheduleHint.innerText = `اختر وقتاً بعد ${MIN_LEAD_MINUTES} دقيقة على الأقل من الآن، وبحد أقصى ${MAX_LEAD_DAYS} أيام مقدماً.`;
        }
        setupScheduleBounds();

        function toggleScheduleUI() {
            const isScheduled = timingScheduled.checked;
            scheduledWrapper.classList.toggle('hidden', !isScheduled);
            scheduledInput.required = isScheduled;
            scheduleError.classList.add('hidden');
            if (isScheduled) setupScheduleBounds();
        }
        timingNow.addEventListener('change', toggleScheduleUI);
        timingScheduled.addEventListener('change', toggleScheduleUI);

        function validateSchedule() {
            if (!timingScheduled.checked) {
                return { ok: true, isScheduled: false };
            }
            if (!scheduledInput.value) {
                return { ok: false, msg: "الرجاء تحديد وقت الطلب المسبق." };
            }
            const chosen = new Date(scheduledInput.value);
            if (isNaN(chosen.getTime())) {
                return { ok: false, msg: "الوقت المحدد غير صالح." };
            }
            const now = new Date();
            const minAllowed = new Date(now.getTime() + MIN_LEAD_MINUTES * 60000);
            const maxAllowed = new Date(now.getTime() + MAX_LEAD_DAYS * 24 * 60 * 60000);
            if (chosen < minAllowed) {
                return { ok: false, msg: `الرجاء اختيار وقت بعد ${MIN_LEAD_MINUTES} دقيقة على الأقل من الآن.` };
            }
            if (chosen > maxAllowed) {
                return { ok: false, msg: `لا يمكن جدولة الطلب لأكثر من ${MAX_LEAD_DAYS} أيام مقدماً.` };
            }
            return { ok: true, isScheduled: true, date: chosen };
        }
        // ===== نهاية منطق الطلب المسبق =====

        function getCart() {
            return getCartService();
        }

        async function renderSummary() {
            const cart = await getCart();
            const groups = groupCartByRestaurant(cart);
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const fee = groups.length * DELIVERY_FEE;
            document.getElementById('ck-subtotal').innerText = subtotal.toFixed(2) + " د.أ";
            document.getElementById('ck-fee-label').innerText =
                groups.length > 1 ? `رسوم التوصيل (${groups.length} طلبات)` : "رسوم التوصيل";
            document.getElementById('ck-fee').innerText = fee.toFixed(2) + " د.أ";
            document.getElementById('ck-total').innerText = (subtotal + fee).toFixed(2) + " د.أ";
            document.getElementById('ck-multi-hint').classList.toggle('hidden', groups.length <= 1);
        }

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (!user) {
                loginWarning.classList.remove('hidden');
                confirmBtn.disabled = true;
                confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                loginWarning.classList.add('hidden');
                confirmBtn.disabled = false;
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        renderSummary();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const cart = await getCart();
            if (cart.length === 0) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "السلة فاضية.";
                return;
            }
            if (!currentUser) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "لازم تسجل دخول أولاً.";
                return;
            }

            // فحص أمان: لازم كل مطعم بالسلة يصير طلب منفصل خاص فيه
            const groups = groupCartByRestaurant(cart);

            const scheduleCheck = validateSchedule();
            if (!scheduleCheck.ok) {
                scheduleError.innerText = scheduleCheck.msg;
                scheduleError.classList.remove('hidden');
                scheduledInput.focus();
                return;
            }
            scheduleError.classList.add('hidden');

            const address = document.getElementById('address').value;
            const paymentMethod = document.getElementById('payment-method').value;
            const notes = document.getElementById('notes').value;

            // بنجهّز طلب (order) مستقل لكل مطعم بالسلة
            const orders = groups.map((group) => {
                const groupSubtotal = group.items.reduce((sum, item) => sum + item.price * item.qty, 0);
                const groupTotal = groupSubtotal + DELIVERY_FEE;
                return {
                    customerId: currentUser.uid,
                    userEmail: currentUser.email,
                    restaurantId: group.restaurantId,
                    items: group.items,
                    address,
                    paymentMethod,
                    notes,
                    subtotal: groupSubtotal,
                    deliveryFee: DELIVERY_FEE,
                    total: groupTotal,
                    // حقول الطلب المسبق (الجدولة)
                    isScheduled: scheduleCheck.isScheduled,
                    scheduledFor: scheduleCheck.isScheduled ? Timestamp.fromDate(scheduleCheck.date) : null,
                    scheduleNotified: false,
                    status: scheduleCheck.isScheduled ? "قيد الانتظار" : "قيد المعالجة",
                    createdAt: serverTimestamp()
                };
            });

            message.className = "text-center text-sm mt-4 text-blue-600";
            message.innerText = orders.length > 1
                ? `جاري إرسال ${orders.length} طلبات...`
                : "جاري إرسال الطلب...";

            try {
                for (const order of orders) {
                    await addDoc(collection(db, "orders"), order);
                }
                await clearCart();
                message.className = "text-center text-sm mt-4 text-green-600";
                const doneMsg = orders.length > 1
                    ? `تم تأكيد ${orders.length} طلبات (وحدة لكل مطعم) بنجاح!`
                    : "تم تأكيد الطلب بنجاح!";
                message.innerText = scheduleCheck.isScheduled
                    ? `${doneMsg} هيتم تجهيزها حوالي الساعة ${scheduleCheck.date.toLocaleString('ar-EG')}. رح تحول لصفحة طلباتي...`
                    : `${doneMsg} رح تحول لصفحة طلباتي...`;
                setTimeout(() => window.location.href = "orders.html", 1200);
            } catch (error) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "خطأ: " + error.message;
            }
        });
    </script>
</body>
</html>
