<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تعبئة بيانات تجريبية - سفرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg bg-white shadow-md rounded-lg p-6 border border-gray-200 text-center">
        <h1 class="text-2xl font-bold text-amber-600 mb-2">تعبئة بيانات تجريبية</h1>
        <p class="text-sm text-gray-500 mb-6">
            هاي الصفحة تضيف 3 مطاعم تجريبية مع منيو لكل وحدة على Firestore.
            <br>
            <span class="text-red-500 font-semibold">استخدمها مرة وحدة بس</span> — كل ضغطة على الزر بتضيف نسخة جديدة من نفس البيانات.
        </p>

        <button id="seed-btn" class="w-full bg-amber-600 text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">
            ابدأ التعبئة
        </button>

        <div id="log" class="text-right text-sm mt-6 space-y-1 max-h-64 overflow-y-auto"></div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import {
            collection, doc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const seedBtn = document.getElementById('seed-btn');
        const logBox = document.getElementById('log');

        function log(msg, color = "text-gray-700") {
            const line = document.createElement('div');
            line.className = color;
            line.innerText = msg;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // بيانات تجريبية: 3 مطاعم، كل وحدة فيها 2-3 أصناف بالمنيو
        const restaurants = [
            {
                id: "restaurant1",
                data: {
                    name: "مطعم الشرق",
                    description: "أكلات شرقية أصيلة ومشاوي طازة",
                    image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800",
                    rating: 4.5,
                    deliveryTimeMinutes: 30,
                    deliveryFee: 1.5,
                    category: "مشاوي"
                },
                menu: [
                    {
                        id: "item1",
                        name: "مشاوي مشكلة",
                        description: "تشكيلة مشاوي مع أرز وبرز",
                        price: 8.5,
                        image: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600"
                    },
                    {
                        id: "item2",
                        name: "شاورما دجاج",
                        description: "شاورما دجاج بالصوص الخاص",
                        price: 3.5,
                        image: "https://images.unsplash.com/photo-1633436375153-d7045cb93e38?w=600"
                    },
                    {
                        id: "item3",
                        name: "حمص بطحينة",
                        description: "حمص طازة مع زيت زيتون",
                        price: 2.0,
                        image: "https://images.unsplash.com/photo-1571997478779-2adcbbe9ab2f?w=600"
                    }
                ]
            },
            {
                id: "restaurant2",
                data: {
                    name: "بيتزا رومانو",
                    description: "بيتزا إيطالية أصلية بعجينة رفيعة",
                    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800",
                    rating: 4.7,
                    deliveryTimeMinutes: 25,
                    deliveryFee: 2.0,
                    category: "بيتزا"
                },
                menu: [
                    {
                        id: "item1",
                        name: "بيتزا مارغريتا",
                        description: "طماطم، موزاريلا، ريحان",
                        price: 5.0,
                        image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=600"
                    },
                    {
                        id: "item2",
                        name: "بيتزا بيبروني",
                        description: "بيبروني وجبنة موزاريلا مضاعفة",
                        price: 6.0,
                        image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=600"
                    }
                ]
            },
            {
                id: "restaurant3",
                data: {
                    name: "برجر هاوس",
                    description: "برجر لحم طازة وبطاطا مقرمشة",
                    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800",
                    rating: 4.3,
                    deliveryTimeMinutes: 20,
                    deliveryFee: 1.0,
                    category: "برجر"
                },
                menu: [
                    {
                        id: "item1",
                        name: "كلاسيك برجر",
                        description: "لحم بقري، جبنة، خس، طماطم",
                        price: 4.5,
                        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
                    },
                    {
                        id: "item2",
                        name: "بطاطا مقرمشة",
                        description: "بطاطا مقلية مع صوص خاص",
                        price: 1.5,
                        image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600"
                    }
                ]
            }
        ];

        seedBtn.addEventListener('click', async () => {
            seedBtn.disabled = true;
            seedBtn.classList.add('opacity-50', 'cursor-not-allowed');
            logBox.innerHTML = '';
            log("جاري بدء التعبئة...", "text-blue-600");

            try {
                for (const r of restaurants) {
                    await setDoc(doc(db, "restaurants", r.id), r.data);
                    log(`✅ تمت إضافة مطعم: ${r.data.name}`, "text-green-600");

                    for (const item of r.menu) {
                        await setDoc(doc(db, "restaurants", r.id, "menu", item.id), item);
                        log(`   ↳ صنف: ${item.name}`, "text-gray-500");
                    }
                }
                log("🎉 خلصت التعبئة! روح صفحة المطاعم.html وشوف النتيجة.", "text-green-700 font-bold");
            } catch (error) {
                log("❌ خطأ: " + error.message, "text-red-500 font-bold");
            } finally {
                seedBtn.disabled = false;
                seedBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
