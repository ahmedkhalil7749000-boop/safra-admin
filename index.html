<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سفرة</title>
    <meta http-equiv="refresh" content="0; url=restaurants.html">
    <link rel="canonical" href="restaurants.html">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b3b2c;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }
        .splash {
            text-align: center;
            color: #ffffff;
        }
        .splash img {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            margin: 16px auto 0;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            margin-top: 12px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="splash">
        <img src="logo.png" alt="سفرة" onerror="this.style.display='none'">
        <div class="spinner"></div>
        <p>جارِ التحويل...</p>
    </div>
    <script>
        // تحويل فوري عن طريق JavaScript (احتياطي في حال meta refresh ما اشتغل)
        window.location.replace("restaurants.html");
    </script>
</body>
</html>
