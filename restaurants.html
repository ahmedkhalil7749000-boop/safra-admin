<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المطاعم - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <style>
        /* ============ قرية سفرة: تصنيفات على شكل بيوت 3D ============ */
        .village {
            perspective: 1300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px 8px;
            padding: 6px 2px 4px;
        }
        .house-slot {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: settle .6s cubic-bezier(.22,1.4,.36,1) backwards;
        }
        @keyframes settle {
            from { opacity: 0; transform: translateY(18px) scale(.8) rotateX(20deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }
        .house-3d {
            width: 100%; max-width: 104px;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.22,1,.36,1);
            transform: rotateX(12deg) rotateY(-20deg);
            animation: idle-bob 4.2s ease-in-out infinite;
            position: relative;
        }
        .house-slot.tilting .house-3d { transition: transform .08s linear; animation-play-state: paused; }
        .house-slot.active-cat .house-3d { transform: rotateX(4deg) rotateY(0deg) translateY(-6px) scale(1.06); }
        @keyframes idle-bob {
            0%,100% { transform: rotateX(12deg) rotateY(-20deg) translateY(0); }
            50% { transform: rotateX(12deg) rotateY(-20deg) translateY(-3px); }
        }
        .ground-shadow {
            width: 62%; height: 10px; margin: 4px auto 0;
            background: radial-gradient(ellipse at center, rgba(11,59,44,.32) 0%, rgba(11,59,44,0) 74%);
            border-radius: 50%;
            transition: all .4s cubic-bezier(.22,1,.36,1);
        }
        .house-slot:hover .ground-shadow, .house-slot.active-cat .ground-shadow { width: 76%; opacity: .8; transform: scaleX(1.05); }
        .roof-wrap { position: relative; z-index: 4; width: 100%; display: flex; justify-content: center; }
        .roof-front {
            width: 0; height: 0; margin: 0 auto;
            border-left: 54px solid transparent;
            border-right: 54px solid transparent;
            border-bottom: 36px solid var(--roof);
            position: relative;
            background-image: repeating-linear-gradient(115deg, rgba(0,0,0,.08) 0 3px, transparent 3px 9px);
            filter: drop-shadow(0 5px 4px rgba(0,0,0,.22));
        }
        .roof-shine {
            position: absolute; top: -2px; left: -30%; width: 26%; height: 38px;
            background: linear-gradient(115deg, transparent, rgba(255,255,255,.55), transparent);
            transform: skewX(-18deg);
            opacity: 0; pointer-events: none;
        }
        .house-slot:hover .roof-shine { animation: shine-sweep 1.1s ease-out; }
        @keyframes shine-sweep {
            0% { left: -30%; opacity: 0; } 15% { opacity: .9; } 100% { left: 120%; opacity: 0; }
        }
        .roof-edge {
            position: absolute; left: -54px; top: 36px;
            width: 108px; height: 7px; border-radius: 2px;
            background: linear-gradient(180deg, var(--roof-edge), var(--roof-edge-dk));
            box-shadow: 0 3px 4px rgba(0,0,0,.2);
        }
        .chimney {
            position: absolute; top: -15px; right: 18px; width: 11px; height: 18px;
            background: repeating-linear-gradient(0deg, var(--roof-edge-dk) 0 3px, var(--roof-edge) 3px 6px);
            border-radius: 1px 1px 0 0;
            box-shadow: 2px 0 0 rgba(0,0,0,.12) inset;
        }
        .smoke { position: absolute; top: -24px; right: 19px; width: 6px; height: 6px; border-radius: 50%;
            background: radial-gradient(circle, #e9e4d6, #cfc9b8); opacity: 0; }
        .house-slot:hover .smoke { animation: smoke-rise 1.7s ease-out infinite; }
        .smoke:nth-child(4){ animation-delay:.45s !important; }
        .smoke:nth-child(5){ animation-delay:.9s !important; }
        @keyframes smoke-rise {
            0% { opacity: 0; transform: translateY(0) scale(.4); } 25% { opacity: .8; }
            100% { opacity: 0; transform: translateY(-28px) scale(1.6) translateX(6px); }
        }
        .body-box {
            width: 100%; height: 78px;
            background:
                repeating-linear-gradient(180deg, rgba(0,0,0,.02) 0 8px, transparent 8px 16px),
                linear-gradient(165deg, #ffffff 0%, var(--wall) 55%, var(--wall-dk) 100%);
            border: 1px solid rgba(11,59,44,.1);
            border-top: none;
            border-radius: 0 0 9px 9px;
            margin-top: -1px;
            box-shadow: 0 9px 16px rgba(11,59,44,.16), inset 0 1px 0 rgba(255,255,255,.65);
            position: relative; z-index: 3;
            transition: box-shadow .4s;
            overflow: hidden;
        }
        .house-slot:hover .body-box, .house-slot.active-cat .body-box { box-shadow: 0 18px 24px rgba(11,59,44,.26), inset 0 1px 0 rgba(255,255,255,.65); }
        .window {
            position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
            width: 32px; height: 32px; border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #ffffff 0%, var(--badge) 50%, var(--badge-dark) 100%);
            border: 2px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,.22), inset 0 1px 3px rgba(255,255,255,.6);
            display: flex; align-items: center; justify-content: center;
        }
        .window::before, .window::after { content:""; position: absolute; background: rgba(255,255,255,.55); }
        .window::before { width: 100%; height: 1.2px; top: 50%; }
        .window::after { height: 100%; width: 1.2px; left: 50%; }
        .window i { color: #fff; font-size: 14px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); position: relative; z-index: 2; }
        .door {
            position: absolute; bottom: 0; right: 9px; width: 15px; height: 24px;
            background: linear-gradient(180deg, var(--roof-edge), var(--roof-edge-dk));
            border-radius: 6px 6px 0 0;
            transform-origin: bottom right;
            transition: transform .4s;
            box-shadow: inset -3px 0 0 rgba(0,0,0,.18), inset 2px 0 0 rgba(255,255,255,.12);
        }
        .door::after { content:""; position: absolute; left: 2.5px; top: 11px; width: 2.2px; height: 2.2px; border-radius: 50%; background: #f7e9c6; }
        .house-slot:hover .door, .house-slot.active-cat .door { transform: rotateY(-45deg); }
        .cat-label {
            font-size: 11px; font-weight: 700; color: var(--safra-dark, #0b3b2c);
            margin-top: 10px; text-align: center; line-height: 1.25;
        }
        .status-pill {
            font-size: 9px; font-weight: 700; margin-top: 3px;
            padding: 1.5px 7px; border-radius: 9999px; white-space: nowrap;
        }
        .status-pill.open { background: #dcfce7; color: #166534; }
        .status-pill.closed { background: #fee2e2; color: #991b1b; }
        .status-pill.unknown { background: #f3f4f6; color: #6b7280; }
        .house-slot.cat-closed .house-3d {
            filter: grayscale(.8) brightness(.92);
            animation-play-state: paused;
        }
        .house-slot.cat-closed .roof-shine,
        .house-slot.cat-closed .smoke { animation: none !important; opacity: 0 !important; }
        .house-slot.tapped .body-box { animation: knock 0.42s ease; }
        @keyframes knock {
            0%,100% { transform: translateX(0); } 20% { transform: translateX(-2.5px); }
            40% { transform: translateX(2.5px); } 60% { transform: translateX(-1.5px); } 80% { transform: translateX(1.5px); }
        }

        /* ============ كروت المطاعم — تصميم v2: صورة كبيرة + شارات ============ */
        .resto-card { display: block; text-decoration: none; color: inherit; }
        .resto-house {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(11,59,44,.08);
            transition: transform .2s ease, box-shadow .2s ease;
            position: relative;
        }
        .resto-card:hover .resto-house {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(11,59,44,.28);
        }
        .resto-photo-wrap { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
        .resto-photo-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .5s ease;
        }
        .resto-card:hover .resto-photo-wrap img { transform: scale(1.06); }
        .resto-status-badge {
            position: absolute; top: 8px; right: 8px; z-index: 2;
            font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 9999px;
            background: #dcfce7; color: #166534;
        }
        .resto-rating-pill {
            position: absolute; bottom: 8px; right: 8px; z-index: 2;
            display: flex; align-items: center; gap: 3px;
            background: rgba(0,0,0,.6); color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 2.5px 7px; border-radius: 9999px;
        }
        .resto-rating-pill i { color: #facc15; font-size: 10px; }
        .resto-closed-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: rgba(0,0,0,.4);
            display: flex; align-items: center; justify-content: center;
        }
        .resto-closed-overlay span {
            background: #dc2626; color: #fff; font-size: 10px; font-weight: 700;
            padding: 3px 10px; border-radius: 9999px;
        }
        .resto-body { padding: 9px 11px 11px; }
        .resto-body h3 { font-size: 13px; }
        .resto-meta {
            display: flex; align-items: center; gap: 9px;
            margin-top: 6px;
            font-size: 10px; color: #9ca3af;
        }
        .resto-meta span { display: flex; align-items: center; gap: 3px; font-weight: 600; }
        .resto-meta i { font-size: 10px; }
        .resto-cat-tag {
            margin-inline-start: auto;
            font-size: 9px; font-weight: 700; color: var(--r-roof);
            background: color-mix(in srgb, var(--r-roof) 12%, white);
            padding: 2px 8px; border-radius: 9999px;
        }
    </style>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-4">المطاعم</h1>

        <!-- البحث -->
        <div class="mb-4">
            <input type="text" id="search-input" placeholder="ابحث عن مطعم..."
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold text-sm">
        </div>

        <!-- قرية سفرة: التصنيفات على شكل بيوت 3D -->
        <div class="mb-2 flex items-center justify-between">
            <h2 class="text-sm font-bold text-safra-dark">تصفّح حسب التصنيف</h2>
            <button id="reset-cat" class="hidden text-[11px] text-safra-gold-dark font-semibold">إظهار الكل ✕</button>
        </div>
        <div id="village" class="village mb-6"></div>

        <div id="loading" class="text-center text-gray-500 py-10">جاري تحميل المطاعم...</div>
        <div id="error" class="hidden text-center text-red-500 py-10"></div>
        <div id="empty" class="hidden text-center text-gray-500 py-10">لا يوجد مطاعم مطابقة.</div>

        <div id="restaurants-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script>
        // ============ بناء قرية سفرة (بيوت التصنيفات) ============
        const categories = [
            { key: "طبيخ",           icon: "fa-kitchen-set" },
            { key: "حلويات",         icon: "fa-ice-cream" },
            { key: "مقبلات",         icon: "fa-bowl-food" },
            { key: "معجنات",         icon: "fa-bread-slice" },
            { key: "فطور",           icon: "fa-egg" },
            { key: "سلطات",          icon: "fa-carrot" },
            { key: "مشروبات",        icon: "fa-mug-hot" },
            { key: "مونة",           icon: "fa-jar" },
            { key: "بوكسات مناسبات", icon: "fa-gift" },
        ];
        const badgeColors = ["#d97706","#2e6f40","#b45309","#0b3b2c"];
        const roofColors  = ["#a3703c","#8a5f34","#b17b45"];
        const village = document.getElementById('village');
        const resetBtn = document.getElementById('reset-cat');

        function darken(hex, amt) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.max(0,(n>>16)-amt), g = Math.max(0,((n>>8)&255)-amt), b = Math.max(0,(n&255)-amt);
            return `rgb(${r},${g},${b})`;
        }
        function lighten(hex, amt) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.min(255,(n>>16)+amt), g = Math.min(255,((n>>8)&255)+amt), b = Math.min(255,(n&255)+amt);
            return `rgb(${r},${g},${b})`;
        }
        function playDoorbell() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [{f:1046.5, t:0}, {f:783.99, t:0.16}].forEach(n => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(n.f, now + n.t);
                    gain.gain.setValueAtTime(0.0001, now + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.28, now + n.t + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + 0.5);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(now + n.t);
                    osc.stop(now + n.t + 0.55);
                });
            } catch (e) {}
        }

        categories.forEach((cat, idx) => {
            const badge = badgeColors[idx % badgeColors.length];
            const roof = roofColors[idx % roofColors.length];
            const slot = document.createElement('div');
            slot.className = 'house-slot';
            slot.dataset.cat = cat.key;
            slot.style.animationDelay = (idx * 0.06) + 's';
            slot.style.setProperty('--roof', roof);
            slot.style.setProperty('--roof-edge', lighten(roof, 15));
            slot.style.setProperty('--roof-edge-dk', darken(roof, 35));
            slot.style.setProperty('--wall', '#fdf6ec');
            slot.style.setProperty('--wall-dk', '#f3e8d6');
            slot.style.setProperty('--badge', badge);
            slot.style.setProperty('--badge-dark', darken(badge, 40));

            const houseWrap = document.createElement('div');
            houseWrap.className = 'house-3d';
            houseWrap.innerHTML = `
                <div class="roof-wrap">
                    <div class="roof-front">
                        <div class="roof-shine"></div>
                        <div class="roof-edge"></div>
                        <div class="chimney"></div>
                        <div class="smoke"></div>
                        <div class="smoke"></div>
                    </div>
                </div>
                <div class="body-box">
                    <div class="window"><i class="fa-solid ${cat.icon}"></i></div>
                    <div class="door"></div>
                </div>
            `;
            slot.appendChild(houseWrap);

            const ground = document.createElement('div');
            ground.className = 'ground-shadow';
            slot.appendChild(ground);

            const label = document.createElement('div');
            label.className = 'cat-label';
            label.textContent = cat.key;
            slot.appendChild(label);

            const pill = document.createElement('div');
            pill.className = 'status-pill unknown';
            pill.textContent = '...';
            slot.appendChild(pill);

            slot.addEventListener('pointermove', (e) => {
                const rect = houseWrap.getBoundingClientRect();
                const px = (e.clientX - rect.left) / rect.width - 0.5;
                const py = (e.clientY - rect.top) / rect.height - 0.5;
                slot.classList.add('tilting');
                houseWrap.style.transform =
                    `rotateX(${(12 - py * 26).toFixed(1)}deg) rotateY(${(-20 + px * 30).toFixed(1)}deg) translateY(-8px) scale(1.09)`;
            });
            slot.addEventListener('pointerleave', () => {
                slot.classList.remove('tilting');
                houseWrap.style.transform = '';
            });

            slot.addEventListener('click', () => {
                playDoorbell();
                slot.classList.add('tapped');
                setTimeout(() => slot.classList.remove('tapped'), 450);
                [...village.querySelectorAll('.house-slot')].forEach(s => s.classList.remove('active-cat'));
                slot.classList.add('active-cat');
                resetBtn.classList.remove('hidden');
                window.onCategorySelect && window.onCategorySelect(cat.key);
                document.getElementById('restaurants-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            village.appendChild(slot);
        });

        resetBtn.addEventListener('click', () => {
            [...village.querySelectorAll('.house-slot')].forEach(s => s.classList.remove('active-cat'));
            resetBtn.classList.add('hidden');
            window.onCategorySelect && window.onCategorySelect('all');
        });

        // بيتنادى من سكربت تحميل المطاعم بعد ما توصل البيانات
        // statusMap شكلها: { "طبيخ": true/false, ... } — true يعني في مطعم مفتوح واحد ع الأقل
        window.setCategoryStatus = (statusMap) => {
            [...village.querySelectorAll('.house-slot')].forEach(slot => {
                const key = slot.dataset.cat;
                const pill = slot.querySelector('.status-pill');
                if (!pill) return;
                const hasAny = Object.prototype.hasOwnProperty.call(statusMap, key);
                const isOpen = statusMap[key];
                pill.classList.remove('open', 'closed', 'unknown');
                if (!hasAny) {
                    pill.classList.add('closed');
                    pill.textContent = 'لا يوجد مطاعم';
                    slot.classList.add('cat-closed');
                } else if (isOpen) {
                    pill.classList.add('open');
                    pill.textContent = '🟢 مفتوح';
                    slot.classList.remove('cat-closed');
                } else {
                    pill.classList.add('closed');
                    pill.textContent = '🔴 مغلق حالياً';
                    slot.classList.add('cat-closed');
                }
            });
        };
    </script>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const emptyBox = document.getElementById('empty');
        const grid = document.getElementById('restaurants-grid');
        const searchInput = document.getElementById('search-input');

        let allRestaurants = [];
        let activeCategory = 'all';

        function isRestaurantClosed(r) {
            return r.status === 'متوقف';
        }

        // ألوان أسقف كروت المطاعم حسب التصنيف (نفس روح ألوان قرية سفرة)
        const categoryRoofColors = {
            "طبيخ": { roof: "#a3703c", lt: "#c99a63" },
            "حلويات": { roof: "#d4537e", lt: "#ed93b1" },
            "مقبلات": { roof: "#639922", lt: "#97c459" },
            "معجنات": { roof: "#8a5f34", lt: "#c99a63" },
            "فطور": { roof: "#ba7517", lt: "#ef9f27" },
            "سلطات": { roof: "#2e6f40", lt: "#639922" },
            "مشروبات": { roof: "#185fa5", lt: "#378add" },
            "مونة": { roof: "#5f5e5a", lt: "#888780" },
            "بوكسات مناسبات": { roof: "#993c1d", lt: "#d85a30" },
        };
        function roofColorFor(category) {
            return categoryRoofColors[category] || { roof: "#a3703c", lt: "#c99a63" };
        }

        function renderCard(id, r) {
            const closed = isRestaurantClosed(r);
            const rc = roofColorFor(r.category);
            const card = document.createElement('a');
            card.href = `restaurant-page.html?id=${id}`;
            card.className = "resto-card block";
            card.innerHTML = `
                <div class="resto-house" style="--r-roof:${rc.roof};">
                    <div class="resto-photo-wrap">
                        <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'}">
                        ${closed ? `
                            <div class="resto-closed-overlay">
                                <span>مغلق حالياً</span>
                            </div>
                        ` : `<span class="resto-status-badge">مفتوح</span>`}
                        <span class="resto-rating-pill"><i class="fa-solid fa-star"></i> ${r.reviewsCount ? (r.rating ?? 0) : 'جديد'}</span>
                    </div>
                    <div class="resto-body">
                        <h3 class="font-bold text-gray-800 truncate">${r.name || ''}</h3>
                        <p class="text-[11px] text-gray-500 mt-1 line-clamp-2">${r.description || ''}</p>
                        <div class="resto-meta">
                            <span><i class="fa-regular fa-clock"></i> ${r.deliveryTimeMinutes ?? '-'} د</span>
                            <span><i class="fa-solid fa-truck-fast"></i> ${r.deliveryFee ?? '-'} د.أ</span>
                            <span class="resto-cat-tag">${r.category || ''}</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const filtered = allRestaurants.filter(({ data }) => {
                const matchesCategory = activeCategory === 'all' || data.category === activeCategory;
                const matchesSearch = !term || (data.name || '').toLowerCase().includes(term);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyBox.classList.remove('hidden');
                return;
            }
            emptyBox.classList.add('hidden');
            filtered.forEach(({ id, data }) => grid.appendChild(renderCard(id, data)));
        }

        searchInput.addEventListener('input', applyFilters);

        // الربط مع بيوت قرية سفرة (معرّفة بسكربت غير module فوق)
        window.onCategorySelect = (catKey) => {
            activeCategory = catKey;
            applyFilters();
        };

        async function loadRestaurants() {
            try {
                const snapshot = await getDocs(collection(db, "restaurants"));
                loading.classList.add('hidden');

                if (snapshot.empty) {
                    emptyBox.classList.remove('hidden');
                    emptyBox.innerText = "لا يوجد مطاعم بعد. جرّب صفحة seed-data.html لإضافة بيانات تجريبية.";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    allRestaurants.push({ id: docSnap.id, data: docSnap.data() });
                });

                // حساب حالة كل تصنيف (مفتوح/مغلق) وتحديث بيوت القرية
                const statusMap = {};
                allRestaurants.forEach(({ data }) => {
                    if (!data.category) return;
                    const isOpen = data.status !== 'متوقف';
                    if (!(data.category in statusMap)) statusMap[data.category] = false;
                    if (isOpen) statusMap[data.category] = true;
                });
                window.setCategoryStatus && window.setCategoryStatus(statusMap);

                applyFilters();
            } catch (error) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.innerText = "خطأ بتحميل المطاعم: " + error.message;
            }
        }

        loadRestaurants();
    </script>
</body>
</html>
