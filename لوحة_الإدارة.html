<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة العامة - منصة سفرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp_boObC6rDyAcLYJ-FBqm8_QwRQXShUk",
            authDomain: "safra-project-3.firebaseapp.com",
            projectId: "safra-project-3",
            storageBucket: "safra-project-3.firebasestorage.app",
            messagingSenderId: "352714677428",
            appId: "1:352714677428:web:5e3ae3b812beb9b5fe0be1"
        };

        // البريد الوحيد المسموح له بالدخول للوحة الإدارة
        const ADMIN_EMAIL = "ahmedkhalil7749000@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // هذا الفحص في الواجهة فقط للتوجيه؛ الحماية الحقيقية للبيانات
        // يجب أن تكون في قواعد أمان Firestore (راجع الرسالة المرفقة بالكود)
        onAuthStateChanged(auth, async (user) => {
            const loader = document.getElementById('global-loader');
            const content = document.getElementById('admin-content');

            if (!user) {
                // غير مسجل دخول: رجّعه لصفحة تسجيل الدخول
                window.location.replace("Auth.html");
                return;
            }

            if (user.email !== ADMIN_EMAIL) {
                // مسجل دخول لكنه ليس المشرف: امنع الدخول
                if (loader) {
                    loader.innerHTML = `
                        <i class="fa-solid fa-lock text-4xl text-red-500 mb-4"></i>
                        <p class="text-gray-700 font-semibold">ليس لديك صلاحية الوصول إلى لوحة الإدارة</p>
                        <a href="index.html" class="text-amber-600 text-sm mt-3 underline">العودة للصفحة الرئيسية</a>
                    `;
                }
                await signOut(auth);
                return;
            }

            // المستخدم هو المشرف المصرح له
            if (loader) loader.remove();
            content.classList.remove('hidden');
            await loadOrders();
        });

        // جلب وعرض الطلبات من جدول orders الفعلي في فايربيس
        async function loadOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                const tbody = document.getElementById('restaurants-table-body');
                if(!tbody) return;
                tbody.innerHTML = "";

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">لا توجد طلبات مسجلة حالياً</td></tr>`;
                    return;
                }

                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    
                    // استخراج تفاصيل الوجبات إن وجدت
                    let itemsText = "طلب عام";
                    if (data.items && data.items.length > 0) {
                        itemsText = data.items.map(i => `${i.name} (عدد: ${i.price || 1})`).join(', ');
                    }

                    tbody.innerHTML += `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="py-3 px-4 font-medium text-gray-800">${data.address || 'العنوان غير متوفر'}</td>
                            <td class="py-3 px-4 text-gray-600">${itemsText}</td>
                            <td class="py-3 px-4">
                                <span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-semibold">رسوم: ${data.deliveryFee || 0}</span>
                            </td>
                            <td class="py-3 px-4">
                                <span class="text-xs text-gray-400 font-mono">${documentSnap.id.substring(0, 8)}...</span>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("خطأ في جلب الطلبات:", error);
            }
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.replace("Auth.html");
            });
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <div id="global-loader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-amber-600 mb-4"></i>
        <p class="text-gray-600 font-medium">جاري تحميل لوحة الإدارة...</p>
    </div>

    <div id="admin-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center border-b border-gray-100">
            <h1 class="text-lg font-bold text-amber-600">لوحة الإدارة - سفرة (الطلبات)</h1>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-gray-600 text-sm hover:text-amber-600">الرئيسية</a>
                <button onclick="logout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-100 transition">تسجيل خروج</button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-6 w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-800">سجل الطلبات الواردة</h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-500 text-sm">
                                <th class="py-3 px-4 font-semibold">العنوان</th>
                                <th class="py-3 px-4 font-semibold">الأصناف والوجبات</th>
                                <th class="py-3 px-4 font-semibold">التوصيل</th>
                                <th class="py-3 px-4 font-semibold">معرف الطلب</th>
                            </tr>
                        </thead>
                        <tbody id="restaurants-table-body">
                            <tr>
                                <td colspan="4" class="text-center py-6 text-gray-400">جاري التحميل...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
