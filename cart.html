<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سلة المشتريات - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-1">سلة المشتريات</h1>
        <p id="multi-restaurant-hint" class="hidden text-xs text-gray-500 mb-4">
            عندك أصناف من أكتر من مطعم — كل مطعم رح يصير طلب منفصل لحاله.
        </p>

        <div id="empty-cart" class="hidden text-center text-gray-500 py-16">
            السلة فاضية. روح
            <a href="restaurants.html" class="text-safra-gold hover:underline">لصفحة المطاعم</a>
            واختار وجبتك.
        </div>

        <!-- كل مطعم بيتعرض بمجموعة لحاله جوا هالعنصر -->
        <div id="cart-groups" class="space-y-5"></div>

        <div id="cart-summary" class="hidden bg-white rounded-lg shadow-md border border-gray-200 p-4 mt-6">
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span>مجموع الأصناف</span>
                <span id="grand-subtotal">0.00 د.أ</span>
            </div>
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span id="delivery-fee-label">رسوم التوصيل</span>
                <span id="grand-delivery-fee">0.00 د.أ</span>
            </div>
            <div class="flex justify-between font-bold text-gray-800 mt-2 pt-2 border-t">
                <span>الإجمالي الكلي</span>
                <span id="grand-total">0.00 د.أ</span>
            </div>
            <a href="checkout.html" class="block text-center bg-safra-gold text-white py-2 rounded-lg font-semibold hover:bg-safra-gold-dark transition mt-4">إتمام الطلب</a>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getCart, saveCart, groupCartByRestaurant } from "./cart-service.js";

        const DELIVERY_FEE = 1.5; // رسوم توصيل لكل طلب/مطعم لحاله

        const groupsEl = document.getElementById('cart-groups');
        const emptyEl = document.getElementById('empty-cart');
        const summaryEl = document.getElementById('cart-summary');
        const multiHintEl = document.getElementById('multi-restaurant-hint');

        const restaurantNameCache = new Map();
        async function getRestaurantName(restaurantId) {
            if (restaurantNameCache.has(restaurantId)) return restaurantNameCache.get(restaurantId);
            try {
                const snap = await getDoc(doc(db, "restaurants", restaurantId));
                const name = snap.exists() ? (snap.data().name || "مطعم") : "مطعم (محذوف)";
                restaurantNameCache.set(restaurantId, name);
                return name;
            } catch {
                return "مطعم";
            }
        }

        async function render() {
            const cart = await getCart();
            groupsEl.innerHTML = '';

            if (cart.length === 0) {
                emptyEl.classList.remove('hidden');
                summaryEl.classList.add('hidden');
                multiHintEl.classList.add('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            summaryEl.classList.remove('hidden');

            const groups = groupCartByRestaurant(cart);
            multiHintEl.classList.toggle('hidden', groups.length <= 1);
            document.getElementById('delivery-fee-label').innerText =
                groups.length > 1 ? `رسوم التوصيل (${groups.length} طلبات)` : "رسوم التوصيل";

            let grandSubtotal = 0;

            for (const group of groups) {
                const restaurantName = await getRestaurantName(group.restaurantId);
                const groupSubtotal = group.items.reduce((sum, i) => sum + i.price * i.qty, 0);
                grandSubtotal += groupSubtotal;

                const groupBox = document.createElement('div');
                groupBox.className = "bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden";

                const header = document.createElement('div');
                header.className = "bg-safra-cream px-3 py-2 flex justify-between items-center border-b border-gray-200";
                header.innerHTML = `
                    <span class="font-bold text-safra-dark text-sm">${restaurantName}</span>
                    <span class="text-xs text-gray-500">${groupSubtotal.toFixed(2)} د.أ</span>
                `;
                groupBox.appendChild(header);

                const itemsWrap = document.createElement('div');
                itemsWrap.className = "divide-y divide-gray-100";

                group.items.forEach((item) => {
                    // نلاقي index الصنف الحقيقي بالسلة الكاملة عشان نقدر نعدّله/نحذفه
                    const cartIndex = cart.indexOf(item);

                    const row = document.createElement('div');
                    row.className = "p-3 flex items-center gap-3";
                    row.innerHTML = `
                        <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-16 h-16 object-cover rounded">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                            <span class="text-safra-gold text-sm">${item.price} د.أ</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="dec-btn w-7 h-7 bg-gray-100 rounded hover:bg-gray-200">-</button>
                            <span class="w-6 text-center">${item.qty}</span>
                            <button class="inc-btn w-7 h-7 bg-gray-100 rounded hover:bg-gray-200">+</button>
                        </div>
                        <button class="remove-btn text-red-500 text-xs hover:underline">حذف</button>
                    `;
                    row.querySelector('.inc-btn').addEventListener('click', async () => {
                        cart[cartIndex].qty += 1;
                        await saveCart(cart);
                        render();
                    });
                    row.querySelector('.dec-btn').addEventListener('click', async () => {
                        if (cart[cartIndex].qty > 1) {
                            cart[cartIndex].qty -= 1;
                        } else {
                            cart.splice(cartIndex, 1);
                        }
                        await saveCart(cart);
                        render();
                    });
                    row.querySelector('.remove-btn').addEventListener('click', async () => {
                        cart.splice(cartIndex, 1);
                        await saveCart(cart);
                        render();
                    });
                    itemsWrap.appendChild(row);
                });

                groupBox.appendChild(itemsWrap);
                groupsEl.appendChild(groupBox);
            }

            const totalDeliveryFee = groups.length * DELIVERY_FEE;
            const grandTotal = grandSubtotal + totalDeliveryFee;

            document.getElementById('grand-subtotal').innerText = grandSubtotal.toFixed(2) + " د.أ";
            document.getElementById('grand-delivery-fee').innerText = totalDeliveryFee.toFixed(2) + " د.أ";
            document.getElementById('grand-total').innerText = grandTotal.toFixed(2) + " د.أ";
        }

        render();
    </script>
</body>
</html>
