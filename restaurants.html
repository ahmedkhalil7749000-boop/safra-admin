<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المطاعم - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
              'safra-line': '#e7e2d6',
              'safra-muted': '#7c7669',
            },
            fontFamily: {
              display: ['"El Messiri"', 'serif'],
              sans: ['"Cairo"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-display { font-family: 'El Messiri', serif; }

        /* ============ شريط البحث ============ */
        .search-field { position: relative; }
        .search-field input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: #fff;
            border: 1px solid #e7e2d6;
            border-radius: 14px;
            font-size: 14px;
            color: #1c1a16;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .search-field input::placeholder { color: #9a9384; }
        .search-field input:focus {
            outline: none;
            border-color: #2e6f40;
            box-shadow: 0 0 0 3px rgba(46,111,64,.12);
        }
        .search-field i {
            position: absolute;
            top: 50%; right: 16px;
            transform: translateY(-50%);
            color: #9a9384;
            font-size: 14px;
            pointer-events: none;
        }

        /* ============ الكرت الرئيسي (الأعلى تقييمًا اليوم) ============ */
        .feature-eyebrow {
            font-size: 12px; font-weight: 700; color: #b45309;
            margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
        }
        .feature-card { display: block; text-decoration: none; color: inherit; }
        .feature-photo-wrap {
            position: relative;
            aspect-ratio: 16 / 10;
            border-radius: 18px;
            overflow: hidden;
            background: #f1ece0;
        }
        .feature-photo-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .6s ease;
        }
        .feature-card:active .feature-photo-wrap img { transform: scale(1.02); }
        .feature-scrim {
            position: absolute; inset: 0;
            background: linear-gradient(0deg, rgba(11,20,15,.82) 0%, rgba(11,20,15,.25) 45%, rgba(11,20,15,0) 68%);
        }
        .feature-card:focus-visible, .resto-card:focus-visible {
            outline: 2px solid #d97706; outline-offset: 3px; border-radius: 16px;
        }
        /* غلاف لوني موحّد فوق كل الصور، يشدّها لهوية بصرية واحدة رغم اختلاف مصادرها */
        .photo-wash {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(155deg, rgba(11,59,44,.18), rgba(217,119,6,.07));
            mix-blend-mode: multiply;
            pointer-events: none;
        }
        .feature-text {
            position: absolute; right: 18px; left: 18px; bottom: 16px;
            color: #fff;
        }
        .feature-text h2 { font-size: 22px; line-height: 1.25; }
        .feature-text p {
            font-size: 12.5px; color: rgba(255,255,255,.82); margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .feature-meta {
            display: flex; align-items: center; gap: 14px;
            margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.92);
        }
        .feature-meta span { display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .feature-meta i { font-size: 11px; }
        .feature-meta .rating-item i { color: #f2b544; }

        /* ============ إضافات جديدة (شريط أفقي) ============ */
        .arrivals-heading {
            font-size: 15px; font-weight: 600; color: #0b3b2c;
            margin-bottom: 10px;
        }
        .arrivals-row {
            display: flex; gap: 12px;
            overflow-x: auto;
            padding: 2px 2px 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .arrivals-row::-webkit-scrollbar { display: none; }
        .arrival-card { flex: 0 0 128px; display: block; text-decoration: none; color: inherit; }
        .arrival-photo {
            position: relative; aspect-ratio: 1 / 1;
            border-radius: 14px; overflow: hidden; background: #f1ece0;
        }
        .arrival-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
        .arrival-card:active .arrival-photo img { transform: scale(1.02); }
        .arrival-badge {
            position: absolute; top: 8px; right: 8px; z-index: 2;
            font-size: 9.5px; font-weight: 700; color: #fff;
            background: #0b3b2c; padding: 3px 8px; border-radius: 9999px;
        }
        .arrival-name {
            margin-top: 7px; font-size: 12.5px; font-weight: 600; color: #1c1a16;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .arrival-card:focus-visible .arrival-photo { outline: 2px solid #d97706; outline-offset: 3px; }

        /* ============ تبويب التصنيفات (نصي تحته خط) ============ */
        .category-tabs {
            display: flex;
            gap: 22px;
            overflow-x: auto;
            padding: 0 2px;
            border-bottom: 1px solid #e7e2d6;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-item {
            flex: 0 0 auto;
            position: relative;
            padding: 6px 1px 12px;
            font-size: 13.5px; font-weight: 600; color: #9a9384;
            white-space: nowrap;
            background: none; border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color .15s ease;
        }
        .tab-item::after {
            content: '';
            position: absolute; right: 0; left: 0; bottom: -1px;
            height: 2px; background: transparent; border-radius: 2px;
            transition: background .15s ease;
        }
        .tab-item[aria-pressed="true"] { color: #0b3b2c; }
        .tab-item[aria-pressed="true"]::after { background: #d97706; }
        .tab-item[disabled] { opacity: .35; cursor: not-allowed; }
        .tab-item:focus-visible { outline: 2px solid #d97706; outline-offset: 3px; border-radius: 4px; }

        /* ============ لحظة ظهور واحدة عند تحميل المحتوى لأول مرة ============ */
        @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .reveal-init { animation: rise-in .55s ease both; }
        @media (prefers-reduced-motion: reduce) { .reveal-init { animation: none; } }

        /* ============ شبكة المطاعم (غير متماثلة) ============ */
        .resto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .resto-card { display: block; text-decoration: none; color: inherit; }
        .resto-card.is-wide { grid-column: 1 / -1; }
        .resto-card.is-wide .resto-house { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .resto-card.is-wide .resto-photo-wrap { aspect-ratio: auto; height: 100%; }
        .resto-card.is-wide .resto-body { display: flex; flex-direction: column; justify-content: center; padding: 14px 16px; }

        .resto-house {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
        }
        .resto-photo-wrap { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #f1ece0; }
        .resto-photo-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .4s ease;
        }
        .resto-card:active .resto-photo-wrap img { transform: scale(1.02); }
        .resto-photo-wrap img.is-closed { filter: grayscale(.55) brightness(.85); }

        .resto-closed-badge {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            font-size: 10px; font-weight: 700; color: #fff;
            background: rgba(17,17,17,.72);
            padding: 4px 9px; border-radius: 9999px;
        }

        .resto-body { padding: 12px 4px 4px; }
        .resto-body h3 { font-size: 15.5px; line-height: 1.3; }
        .resto-card.is-wide .resto-body h3 { font-size: 18px; }
        .resto-desc {
            font-size: 11.5px; color: #8a8474; margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .resto-meta {
            display: flex; align-items: center; gap: 12px;
            margin-top: 8px;
            font-size: 11px; color: #5c5646;
        }
        .resto-meta span { display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .resto-meta i { font-size: 11px; color: #9a9384; }
        .resto-meta .rating-item i { color: #d97706; }
        .resto-meta .rating-item.is-new { color: #7c7669; font-weight: 700; }

        /* ============ حالة التحميل (skeleton) ============ */
        .skeleton-feature { aspect-ratio: 16/10; border-radius: 18px; background: #eee7d8; margin-bottom: 22px; }
        .skeleton-card { border-radius: 16px; overflow: hidden; background: #fff; }
        .skeleton-photo { aspect-ratio: 4/3; border-radius: 16px; background: #eee7d8; }
        .skeleton-line { height: 9px; border-radius: 5px; background: #eee7d8; margin: 10px 4px 0; }
        .skeleton-pulse { animation: skeleton-pulse 1.4s ease-in-out infinite; }
        @keyframes skeleton-pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

        /* ============ بانرات إعلانات المنصة (شريط تمرير أفقي) ============ */
        .banner-row {
            display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 2px 2px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .banner-row::-webkit-scrollbar { display: none; }
        .banner-slide {
            flex: 0 0 88%; scroll-snap-align: start; display: block; text-decoration: none;
            border-radius: 18px; overflow: hidden; position: relative; background: #f1ece0;
            aspect-ratio: 16/7;
        }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .banner-slide .banner-name {
            position: absolute; right: 12px; bottom: 10px; color: #fff; font-size: 12.5px;
            font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.55);
            background: rgba(11,20,15,.35); padding: 4px 10px; border-radius: 9999px;
            backdrop-filter: blur(2px);
        }
    </style>

<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div id="page-content" class="p-4">
        <div class="mb-4">
            <h1 class="font-display text-2xl font-semibold text-safra-dark">المطاعم</h1>
            <p id="restaurant-count" class="text-[12.5px] text-safra-muted mt-0.5">جاري تحميل المطاعم القريبة منك...</p>
        </div>

        <!-- الكرت الرئيسي -->
        <div id="feature-slot" class="mb-5"></div>

        <!-- إضافات جديدة -->
        <div id="arrivals-slot" class="mb-5"></div>

        <!-- إعلانات المنصة (بانر) — مستقلة كليًا عن اشتراكات المطاعم، يتحكم بها الأدمن -->
        <div id="platform-banners-section" class="hidden mb-5">
            <div id="platform-banners-row" class="banner-row"></div>
        </div>

        <!-- البحث -->
        <div class="search-field mb-4">
            <input type="text" id="search-input" placeholder="ابحث عن مطعم أو نوع أكل...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <!-- التصنيفات -->
        <div id="category-tabs" class="category-tabs mb-5"></div>

        <!-- حالات العرض -->
        <div id="loading" class="resto-grid"></div>
        <div id="error" class="hidden text-center text-red-600 bg-red-50 border border-red-100 rounded-xl py-8 px-4 text-sm"></div>
        <div id="empty" class="hidden flex-col items-center text-center text-safra-muted py-14 px-4">

            <p class="text-sm font-semibold text-safra-dark">لا يوجد مطاعم مطابقة</p>
            <p class="text-xs mt-1">جرّب كلمة بحث مختلفة أو اختر تصنيفًا آخر</p>

        <div id="restaurants-grid" class="resto-grid"></div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script>
        // ============ تصنيفات سفرة ============
        const categories = [
            "طبيخ", "حلويات", "مقبلات", "معجنات", "فطور",
            "سلطات", "مشروبات", "مونة", "بوكسات مناسبات",
        ];

        const tabs = document.getElementById('category-tabs');

        function buildTab(label, isAll) {
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'tab-item';
            tab.dataset.cat = isAll ? 'all' : label;
            tab.setAttribute('aria-pressed', isAll ? 'true' : 'false');
            tab.textContent = label;
            return tab;
        }

        tabs.appendChild(buildTab('الكل', true));
        categories.forEach(cat => tabs.appendChild(buildTab(cat, false)));

        tabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab || tab.disabled) return;
            [...tabs.querySelectorAll('.tab-item')].forEach(t => t.setAttribute('aria-pressed', 'false'));
            tab.setAttribute('aria-pressed', 'true');
            window.onCategorySelect && window.onCategorySelect(tab.dataset.cat);
        });

        // تعطيل التصنيفات اللي ما فيها ولا مطعم
        window.setCategoryAvailability = (availableSet) => {
            [...tabs.querySelectorAll('.tab-item')].forEach(tab => {
                if (tab.dataset.cat === 'all') return;
                const hasAny = availableSet.has(tab.dataset.cat);
                tab.disabled = !hasAny;
                tab.title = hasAny ? '' : 'لا يوجد مطاعم بهذا التصنيف حاليًا';
            });
        };

        // مسكِن تحميل بسيط
        (function renderSkeletons() {
            document.getElementById('feature-slot').innerHTML =
                `<div class="skeleton-feature skeleton-pulse"></div>`;
            const loading = document.getElementById('loading');
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="skeleton-card skeleton-pulse">
                        <div class="skeleton-photo"></div>
                        <div class="skeleton-line" style="width:70%"></div>
                        <div class="skeleton-line" style="width:45%; margin-top:8px; margin-bottom:12px;"></div>
                    </div>`;
            }
            loading.innerHTML = html;
        })();
    </script>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ===== إعلانات المنصة (بانر): مستقلة كليًا عن اشتراكات المطاعم، يديرها الأدمن مباشرة =====
        function renderPlatformBanner(ad) {
            const tag = ad.linkUrl ? 'a' : 'div';
            const el = document.createElement(tag);
            if (ad.linkUrl) { el.href = ad.linkUrl; el.target = '_blank'; el.rel = 'noopener'; }
            el.className = 'banner-slide';
            el.innerHTML = `
                <img src="${ad.mediaUrl}" alt="${ad.title || 'إعلان'}">
                ${ad.title ? `<span class="banner-name">${ad.title}</span>` : ''}
            `;
            return el;
        }

        async function loadPlatformAds() {
            try {
                const snap = await getDocs(collection(db, "platformAds"));
                const all = [];
                snap.forEach(d => all.push({ id: d.id, ...d.data() }));
                const active = all.filter(ad => ad.status === 'نشط' && ad.mediaUrl && ad.type === 'بانر' && (!ad.target || ad.target === 'الكل' || ad.target === 'المطاعم'));

                if (active.length) {
                    document.getElementById('platform-banners-section').classList.remove('hidden');
                    const row = document.getElementById('platform-banners-row');
                    active.forEach(ad => row.appendChild(renderPlatformBanner(ad)));
                }
            } catch (error) {
                console.error("خطأ أثناء تحميل إعلانات المنصة:", error);
            }
        }

        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const emptyBox = document.getElementById('empty');
        const grid = document.getElementById('restaurants-grid');
        const featureSlot = document.getElementById('feature-slot');
        const arrivalsSlot = document.getElementById('arrivals-slot');
        const searchInput = document.getElementById('search-input');
        const countLabel = document.getElementById('restaurant-count');

        let allRestaurants = [];
        let featuredId = null;
        let activeCategory = 'all';

        function isRestaurantClosed(r) {
            return r.status === 'متوقف';
        }

        function restaurantCategories(r) {
            if (Array.isArray(r.categories) && r.categories.length) return r.categories;
            if (r.category) return [r.category];
            return [];
        }

        function renderFeature(id, r) {
            const card = document.createElement('a');
            card.href = `restaurant-page.html?id=${id}`;
            card.className = "feature-card";
            card.innerHTML = `
                <p class="feature-eyebrow"><i class="fa-solid fa-star"></i> الأعلى تقييمًا اليوم</p>
                <div class="feature-photo-wrap">
                    <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=80'}"
                         alt="${r.name || 'مطعم'}">
                    <div class="photo-wash"></div>
                    <div class="feature-scrim"></div>
                    <div class="feature-text">
                        <h2 class="font-display font-semibold">${r.name || ''}</h2>
                        <p>${r.description || ''}</p>
                        <div class="feature-meta">
                            <span class="rating-item"><i class="fa-solid fa-star"></i> ${r.rating ?? 0}</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function renderArrival(id, r) {
            const card = document.createElement('a');
            card.href = `restaurant-page.html?id=${id}`;
            card.className = "arrival-card";
            card.innerHTML = `
                <div class="arrival-photo">
                    <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=400&q=80'}"
                         alt="${r.name || 'مطعم'}">
                    <div class="photo-wash"></div>
                    <span class="arrival-badge">جديد</span>
                </div>
                <p class="arrival-name">${r.name || ''}</p>
            `;
            return card;
        }

        function renderCard(id, r, isWide) {
            const closed = isRestaurantClosed(r);
            const hasReviews = !!r.reviewsCount;

            const card = document.createElement('a');
            card.href = `restaurant-page.html?id=${id}`;
            card.className = "resto-card" + (isWide ? " is-wide" : "");
            card.innerHTML = `
                <div class="resto-house">
                    <div class="resto-photo-wrap">
                        <img class="${closed ? 'is-closed' : ''}"
                             src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'}"
                             alt="${r.name || 'مطعم'}">
                        <div class="photo-wash"></div>
                        ${closed ? `<span class="resto-closed-badge">مغلق حاليًا</span>` : ''}
                    </div>
                    <div class="resto-body">
                        <h3 class="font-display font-semibold text-safra-dark truncate">${r.name || ''}</h3>
                        <p class="resto-desc">${r.description || ''}</p>
                        <div class="resto-meta">
                            <span class="rating-item ${hasReviews ? '' : 'is-new'}">
                                <i class="fa-solid fa-star"></i> ${hasReviews ? (r.rating ?? 0) : 'جديد'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const filtered = allRestaurants.filter(({ id, data }) => {
                if (id === featuredId && activeCategory === 'all' && !term) return false; // ما نكرر المطعم المميز بالشبكة بالعرض الافتراضي
                const matchesCategory = activeCategory === 'all' || restaurantCategories(data).includes(activeCategory);
                const matchesSearch = !term || (data.name || '').toLowerCase().includes(term);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyBox.classList.remove('hidden');
                emptyBox.classList.add('flex');
                return;
            }
            emptyBox.classList.add('hidden');
            emptyBox.classList.remove('flex');

            // أول مطعم بنتيجة "الكل" (بدون بحث) ياخد بلوك عريض لكسر رتابة الشبكة
            const breakMonotony = activeCategory === 'all' && !term;
            filtered.forEach(({ id, data }, index) => {
                grid.appendChild(renderCard(id, data, breakMonotony && index === 0));
            });
        }

        searchInput.addEventListener('input', applyFilters);

        window.onCategorySelect = (catKey) => {
            activeCategory = catKey;
            applyFilters();
        };

        async function loadRestaurants() {
            try {
                const snapshot = await getDocs(collection(db, "restaurants"));
                loading.classList.add('hidden');
                document.getElementById('page-content').classList.add('reveal-init');

                if (snapshot.empty) {
                    featureSlot.innerHTML = '';
                    emptyBox.classList.remove('hidden');
                    emptyBox.classList.add('flex');
                    emptyBox.innerHTML = `
                        <i class="fa-regular fa-store-slash text-3xl mb-3 text-safra-line"></i>
                        <p class="text-sm font-semibold text-safra-dark">لا يوجد مطاعم بعد</p>
                        <p class="text-xs mt-1">جرّب صفحة seed-data.html لإضافة بيانات تجريبية</p>`;
                    countLabel.textContent = 'لا يوجد مطاعم متاحة حاليًا';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    allRestaurants.push({ id: docSnap.id, data: docSnap.data() });
                });

                const openCount = allRestaurants.filter(({ data }) => !isRestaurantClosed(data)).length;
                countLabel.textContent = `${allRestaurants.length} مطعم بالمجموع · ${openCount} مفتوح الآن`;

                // اختيار المطعم المميز: الأعلى تقييمًا من ضمن المطاعم المفتوحة (أو من الكل لو كلها مغلقة)
                const openOnes = allRestaurants.filter(({ data }) => !isRestaurantClosed(data));
                const pool = openOnes.length ? openOnes : allRestaurants;
                const featured = pool.reduce((best, cur) =>
                    (cur.data.rating ?? 0) > (best.data.rating ?? 0) ? cur : best, pool[0]);

                if (featured) {
                    featuredId = featured.id;
                    featureSlot.appendChild(renderFeature(featured.id, featured.data));
                }

                // إضافات جديدة: مبنية على createdAt الفعلي، مش شكل ثابت — بتختفي تلقائيًا إذا ما في بيانات كافية
                const recentlyAdded = allRestaurants
                    .filter(({ id, data }) => id !== featuredId && !isRestaurantClosed(data) && data.createdAt?.toMillis)
                    .sort((a, b) => b.data.createdAt.toMillis() - a.data.createdAt.toMillis())
                    .slice(0, 4);

                if (recentlyAdded.length >= 2) {
                    const heading = document.createElement('h3');
                    heading.className = 'arrivals-heading font-display';
                    heading.textContent = 'إضافات جديدة';
                    const row = document.createElement('div');
                    row.className = 'arrivals-row';
                    recentlyAdded.forEach(({ id, data }) => row.appendChild(renderArrival(id, data)));
                    arrivalsSlot.appendChild(heading);
                    arrivalsSlot.appendChild(row);
                }

                const availableCats = new Set();
                allRestaurants.forEach(({ data }) => {
                    restaurantCategories(data).forEach(cat => availableCats.add(cat));
                });
                window.setCategoryAvailability && window.setCategoryAvailability(availableCats);

                applyFilters();
            } catch (error) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.innerText = "حدث خطأ أثناء تحميل المطاعم: " + error.message;
            }
        }

        loadRestaurants();
        loadPlatformAds();
    </script>
</body>
</html>
