<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصور - سفرة</title>
    <!-- تضمين مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6 border border-gray-200">
        
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">إدارة ورفع صور المطاعم والوجبات</h1>
            <!-- تم تعديل اسم الملف هنا ليتطابق مع اسم الملف الفعلي في مجلدك -->
            <a href="لوحة الإدارة" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition text-sm">العودة لوحة الإدارة</a>
        </div>

        <!-- نموذج رفع الصور -->
        <div class="bg-gray-50 p-4 rounded-lg border mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">رفع صورة جديدة</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اختر الصورة</label>
                    <input type="file" id="imageFile" accept="image/*" required class="w-full border p-2 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">مجلد التخزين</label>
                    <select id="folderName" class="w-full border p-2 rounded bg-white">
                        <option value="restaurants">صور المطاعم</option>
                        <option value="dishes">صور الوجبات</option>
                    </select>
                </div>
                <button type="submit" id="uploadBtn" class="bg-amber-600 text-white px-4 py-2 rounded hover:bg-amber-700 transition text-sm font-semibold">رفع الصورة</button>
            </form>
            <p id="uploadStatus" class="text-sm mt-2 text-gray-600"></p>
        </div>

        <!-- معرض الصور المرفوعة -->
        <div>
            <h2 class="text-lg font-semibold text-gray-700 mb-3">الصور المرفوعة مؤخراً</h2>
            <div id="imageGallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <p class="text-gray-500 text-sm">جاري تحميل الصور...</p>
            </div>
        </div>

    </div>

    <!-- ربط Firebase Storage و Firestore المنطق البرمجي -->
    <script type="module">
        import { db, storage } from './firebase-config.js';
        import { ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const uploadForm = document.getElementById('uploadForm');
        const uploadStatus = document.getElementById('uploadStatus');
        const imageGallery = document.getElementById('imageGallery');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('imageFile');
            const folderSelect = document.getElementById('folderName');
            const file = fileInput.files[0];
            
            if (!file) return;

            const storageRef = ref(storage, `${folderSelect.value}/${Date.now()}_${file.name}`);
            uploadStatus.textContent = "جاري رفع الصورة...";

            try {
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);
                uploadStatus.textContent = "تم رفع الصورة بنجاح!";
                uploadForm.reset();
                loadImages();
            } catch (error) {
                console.error("خطأ في الرفع: ", error);
                uploadStatus.textContent = "فشل رفع الصورة: " + error.message;
            }
        });

        async function loadImages() {
            imageGallery.innerHTML = '<p class="text-gray-500 text-sm">جاري التحميل...</p>';
            try {
                const folders = ['restaurants', 'dishes'];
                let allUrls = [];

                for (const folder of folders) {
                    const folderRef = ref(storage, folder + '/');
                    const res = await listAll(folderRef);
                    for (const itemRef of res.items) {
                        const url = await getDownloadURL(itemRef);
                        allUrls.push({ url, name: itemRef.name, folder });
                    }
                }

                if (allUrls.length === 0) {
                    imageGallery.innerHTML = '<p class="text-gray-500 text-sm col-span-full">لا توجد صور مرفوعة حالياً.</p>';
                    return;
                }

                imageGallery.innerHTML = '';
                allUrls.forEach(img => {
                    const div = document.createElement('div');
                    div.className = 'border rounded p-2 bg-white shadow-sm flex flex-col items-center';
                    div.innerHTML = `
                        <img src="${img.url}" alt="${img.name}" class="w-full h-32 object-cover rounded mb-2">
                        <span class="text-xs text-gray-500 truncate w-full text-center">${img.folder}</span>
                        <input type="text" readonly value="${img.url}" class="text-xs border p-1 rounded w-full mt-1 bg-gray-50 select-all text-center" onclick="this.select()">
                    `;
                    imageGallery.appendChild(div);
                });

            } catch (error) {
                console.error("خطأ في جلب الصور: ", error);
                imageGallery.innerHTML = '<p class="text-red-500 text-sm col-span-full">حدث خطأ أثناء تحميل الصور.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadImages);
    </script>
</body>
</html>
