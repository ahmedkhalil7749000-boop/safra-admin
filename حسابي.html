<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البيانات الشخصية والإعدادات - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">

        <div id="login-warning" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-4 text-center">
            لازم تسجل دخول عشان تشوف بيانات حسابك.
            <a href="Auth.html" class="text-safra-gold font-semibold hover:underline">سجّل دخول</a>
        </div>

        <div id="account-box" class="hidden">

            <!-- بطاقة الهوية: صورة رمزية بأول حرف + الاسم + نوع الحساب -->
            <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5 mb-4 flex items-center gap-4">
                <div id="avatar-circle" class="w-16 h-16 rounded-full bg-safra-dark text-white flex items-center justify-center text-2xl font-bold shrink-0">؟</div>
                <div class="min-w-0 flex-1">
                    <p id="display-name" class="text-lg font-bold text-safra-dark truncate">بدون اسم</p>
                    <span id="role-badge" class="inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-safra-gold/10 text-safra-gold-dark"></span>
                </div>
                <button id="edit-toggle-btn" class="shrink-0 w-9 h-9 rounded-full bg-gray-50 text-gray-500 hover:bg-gray-100 flex items-center justify-center transition" title="تعديل البيانات">
                    <i class="fa-solid fa-pen text-sm"></i>
                </button>
            </div>

            <!-- وضع العرض -->
            <div id="view-mode" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100">
                <div class="flex items-center gap-3 p-4">
                    <i class="fa-solid fa-envelope text-safra-gold w-5 text-center"></i>
                    <div class="min-w-0">
                        <p class="text-[11px] text-gray-400">البريد الإلكتروني</p>
                        <p id="user-email" class="text-sm text-gray-800 truncate"></p>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-4">
                    <i class="fa-solid fa-phone text-safra-gold w-5 text-center"></i>
                    <div class="min-w-0">
                        <p class="text-[11px] text-gray-400">رقم الهاتف</p>
                        <p id="user-phone" class="text-sm text-gray-800">غير مضاف</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-4">
                    <i class="fa-solid fa-calendar text-safra-gold w-5 text-center"></i>
                    <div class="min-w-0">
                        <p class="text-[11px] text-gray-400">عضو منذ</p>
                        <p id="user-created" class="text-sm text-gray-800"></p>
                    </div>
                </div>
            </div>

            <!-- وضع التعديل -->
            <form id="edit-form" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">الاسم الكامل</label>
                    <input type="text" id="edit-name" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-safra-gold" placeholder="مثال: أحمد خليل">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                    <input type="tel" id="edit-phone" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-safra-gold" placeholder="مثال: 079xxxxxxx">
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-safra-gold text-white py-2 rounded-lg font-semibold text-sm hover:bg-safra-gold-dark transition">حفظ التعديلات</button>
                    <button type="button" id="cancel-edit-btn" class="px-4 bg-gray-100 text-gray-600 py-2 rounded-lg font-semibold text-sm hover:bg-gray-200 transition">إلغاء</button>
                </div>
                <p id="edit-message" class="text-xs font-semibold text-center"></p>
            </form>

            <div class="mt-4">
                <a href="orders.html" class="block text-center bg-white border border-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold hover:bg-gray-50 transition text-sm">
                    <i class="fa-solid fa-receipt ml-1 text-safra-gold"></i> طلباتي
                </a>
            </div>

            <button id="logout-btn" class="w-full mt-3 bg-red-50 text-red-600 py-2.5 rounded-xl font-semibold hover:bg-red-100 transition text-sm">
                تسجيل الخروج
            </button>
        </div>

        <!-- روابط لأصحاب المطاعم / الإدارة -->
        <div class="mt-4 bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <h2 class="text-xs font-bold text-gray-400 mb-3">إدارة الأعمال</h2>
            <div class="flex flex-col gap-2">
                <a href="لوحة_المطعم.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-store ml-2 text-safra-gold"></i>لوحة تحكم المطعم</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
                <a href="adman.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-clipboard-list ml-2 text-safra-gold"></i>إدارة الطلبات</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
                <a href="لوحة_الإدارة.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-user-shield ml-2 text-safra-gold"></i>لوحة الإدارة العامة</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginWarning = document.getElementById('login-warning');
        const accountBox = document.getElementById('account-box');
        const logoutBtn = document.getElementById('logout-btn');

        const avatarCircle = document.getElementById('avatar-circle');
        const displayNameEl = document.getElementById('display-name');
        const roleBadge = document.getElementById('role-badge');
        const editToggleBtn = document.getElementById('edit-toggle-btn');
        const viewMode = document.getElementById('view-mode');
        const editForm = document.getElementById('edit-form');
        const editNameInput = document.getElementById('edit-name');
        const editPhoneInput = document.getElementById('edit-phone');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const editMessage = document.getElementById('edit-message');

        const ROLE_LABELS = { customer: 'زبون', restaurant_owner: 'صاحب مطعم' };

        let currentUid = null;
        let currentUserData = {};

        function renderView(user, data) {
            const name = (data.name || '').trim();
            displayNameEl.innerText = name || 'بدون اسم — اضغط تعديل';
            avatarCircle.innerText = name ? name.trim()[0] : (user.email ? user.email[0].toUpperCase() : '؟');
            roleBadge.innerText = ROLE_LABELS[data.role] || 'زبون';

            document.getElementById('user-email').innerText = user.email || '-';
            document.getElementById('user-phone').innerText = data.phone || 'غير مضاف';

            const created = user.metadata?.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('ar-EG') : '-';
            document.getElementById('user-created').innerText = created;

            editNameInput.value = name;
            editPhoneInput.value = data.phone || '';
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                loginWarning.classList.remove('hidden');
                accountBox.classList.add('hidden');
                return;
            }
            loginWarning.classList.add('hidden');
            accountBox.classList.remove('hidden');
            currentUid = user.uid;

            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                currentUserData = snap.exists() ? snap.data() : {};
            } catch (e) {
                console.error("تعذر جلب بيانات المستخدم:", e);
                currentUserData = {};
            }

            renderView(user, currentUserData);
        });

        editToggleBtn.addEventListener('click', () => {
            viewMode.classList.add('hidden');
            editForm.classList.remove('hidden');
            editMessage.innerText = '';
        });

        cancelEditBtn.addEventListener('click', () => {
            editForm.classList.add('hidden');
            viewMode.classList.remove('hidden');
        });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUid) return;

            const name = editNameInput.value.trim();
            const phone = editPhoneInput.value.trim();

            editMessage.className = "text-xs font-semibold text-center text-blue-600";
            editMessage.innerText = "جاري الحفظ...";

            try {
                // بنبعت role دايمًا (نفس القيمة الحالية أو "customer" كافتراضي) عشان
                // لو وثيقة المستخدم أصلاً مو موجودة، setDoc تقدر "تنشئها" بدون ما
                // تنرفض من قاعدة الأمان اللي بتشترط وجود role صحيح عند الإنشاء.
                const role = currentUserData.role || 'customer';
                await setDoc(doc(db, "users", currentUid), { name, phone, role }, { merge: true });

                currentUserData = { ...currentUserData, name, phone, role };
                renderView(auth.currentUser, currentUserData);

                editMessage.className = "text-xs font-semibold text-center text-green-600";
                editMessage.innerText = "تم الحفظ بنجاح!";

                setTimeout(() => {
                    editForm.classList.add('hidden');
                    viewMode.classList.remove('hidden');
                }, 700);
            } catch (error) {
                editMessage.className = "text-xs font-semibold text-center text-red-500";
                editMessage.innerText = "خطأ: " + error.message;
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "Auth.html";
        });
    </script>
</body>
</html>
