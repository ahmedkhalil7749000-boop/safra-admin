<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الطلب - سفرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-lg mx-auto p-6">
        <h1 class="text-2xl font-bold text-amber-600 mb-6 text-center">إتمام الطلب</h1>

        <div id="login-warning" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-4 mb-4 text-center">
            لازم تسجل دخول الأول عشان تكمل الطلب.
            <a href="Auth.html" class="text-amber-600 font-semibold hover:underline">سجّل دخول</a>
        </div>

        <form id="checkout-form" class="bg-white rounded-lg shadow-md border border-gray-200 p-4 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">العنوان</label>
                <input type="text" id="address" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="مثال: عمان - الدوار السابع - عمارة 12">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">طريقة الدفع</label>
                <select id="payment-method" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="cash">الدفع عند الاستلام (كاش)</option>
                    <option value="card">بطاقة ائتمان</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ملاحظات (اختياري)</label>
                <textarea id="notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="مثال: بدون بصل"></textarea>
            </div>

            <div class="border-t pt-3 text-sm text-gray-700">
                <div class="flex justify-between"><span>المجموع</span><span id="ck-subtotal">0.00 د.أ</span></div>
                <div class="flex justify-between"><span>رسوم التوصيل</span><span id="ck-fee">0.00 د.أ</span></div>
                <div class="flex justify-between font-bold text-gray-900 mt-1"><span>الإجمالي</span><span id="ck-total">0.00 د.أ</span></div>
            </div>

            <button type="submit" id="confirm-btn" class="w-full bg-amber-600 text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">تأكيد الطلب</button>
        </form>

        <p id="message" class="text-center text-sm mt-4 font-semibold"></p>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const DELIVERY_FEE = 1.5;
        const form = document.getElementById('checkout-form');
        const message = document.getElementById('message');
        const loginWarning = document.getElementById('login-warning');
        const confirmBtn = document.getElementById('confirm-btn');

        function getCart() {
            return JSON.parse(localStorage.getItem('safra_cart') || '[]');
        }

        function renderSummary() {
            const cart = getCart();
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const fee = cart.length ? DELIVERY_FEE : 0;
            document.getElementById('ck-subtotal').innerText = subtotal.toFixed(2) + " د.أ";
            document.getElementById('ck-fee').innerText = fee.toFixed(2) + " د.أ";
            document.getElementById('ck-total').innerText = (subtotal + fee).toFixed(2) + " د.أ";
        }

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (!user) {
                loginWarning.classList.remove('hidden');
                confirmBtn.disabled = true;
                confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                loginWarning.classList.add('hidden');
                confirmBtn.disabled = false;
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        renderSummary();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const cart = getCart();
            if (cart.length === 0) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "السلة فاضية.";
                return;
            }
            if (!currentUser) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "لازم تسجل دخول أولاً.";
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const total = subtotal + DELIVERY_FEE;

            // تم تعديل userId إلى customerId ليتوافق مع قواعد الأمان في فايربيس
            const order = {
                customerId: currentUser.uid,
                userEmail: currentUser.email,
                restaurantId: cart[0]?.restaurantId || null,
                items: cart,
                address: document.getElementById('address').value,
                paymentMethod: document.getElementById('payment-method').value,
                notes: document.getElementById('notes').value,
                subtotal,
                deliveryFee: DELIVERY_FEE,
                total,
                status: "قيد المعالجة",
                createdAt: serverTimestamp()
            };

            message.className = "text-center text-sm mt-4 text-blue-600";
            message.innerText = "جاري إرسال الطلب...";

            try {
                await addDoc(collection(db, "orders"), order);
                localStorage.removeItem('safra_cart');
                message.className = "text-center text-sm mt-4 text-green-600";
                message.innerText = "تم تأكيد الطلب بنجاح! رح تحول لصفحة طلباتي...";
                setTimeout(() => window.location.href = "orders.html", 1200);
            } catch (error) {
                message.className = "text-center text-sm mt-4 text-red-500";
                message.innerText = "خطأ: " + error.message;
            }
        });
    </script>
</body>
</html>
