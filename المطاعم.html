<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المطاعم - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-4">المطاعم</h1>

        <!-- البحث -->
        <div class="mb-3">
            <input type="text" id="search-input" placeholder="ابحث عن مطعم..."
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-safra-gold text-sm">
        </div>

        <!-- فلترة حسب التصنيف -->
        <div id="category-filters" class="flex flex-wrap gap-2 mb-5">
            <button data-cat="all" class="cat-btn bg-safra-gold text-white text-xs px-3 py-1 rounded-full">الكل</button>
        </div>

        <div id="loading" class="text-center text-gray-500 py-10">جاري تحميل المطاعم...</div>
        <div id="error" class="hidden text-center text-red-500 py-10"></div>
        <div id="empty" class="hidden text-center text-gray-500 py-10">لا يوجد مطاعم مطابقة.</div>

        <div id="restaurants-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const emptyBox = document.getElementById('empty');
        const grid = document.getElementById('restaurants-grid');
        const searchInput = document.getElementById('search-input');
        const filtersBox = document.getElementById('category-filters');

        let allRestaurants = [];
        let activeCategory = 'all';

        function isRestaurantClosed(r) {
            return r.status === 'متوقف';
        }

        function renderCard(id, r) {
            const closed = isRestaurantClosed(r);
            const card = document.createElement('a');
            card.href = `صفحة_المطعم.html?id=${id}`;
            card.className = "bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition relative"
                + (closed ? " opacity-70" : "");
            card.innerHTML = `
                <div class="relative">
                    <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'}" class="w-full h-24 object-cover ${closed ? 'grayscale' : ''}">
                    ${closed ? `
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                            <span class="bg-red-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-full">🔴 مغلق حالياً</span>
                        </div>
                    ` : ''}
                </div>
                <div class="p-2.5">
                    <div class="flex justify-between items-start gap-1">
                        <h3 class="font-bold text-sm text-gray-800 truncate">${r.name || ''}</h3>
                    </div>
                    <span class="inline-block text-[10px] bg-safra-gold/10 text-safra-gold-dark px-1.5 py-0.5 rounded mt-1">${r.category || ''}</span>
                    <p class="text-[11px] text-gray-500 mt-1 line-clamp-2">${r.description || ''}</p>
                    <div class="flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] text-gray-600 mt-2">
                        <span>⭐ ${r.reviewsCount ? `${r.rating ?? 0}` : 'جديد'}</span>
                        <span>🕒 ${r.deliveryTimeMinutes ?? '-'} د</span>
                        <span>🚚 ${r.deliveryFee ?? '-'} د.أ</span>
                    </div>
                </div>
            `;
            return card;
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const filtered = allRestaurants.filter(({ data }) => {
                const matchesCategory = activeCategory === 'all' || data.category === activeCategory;
                const matchesSearch = !term || (data.name || '').toLowerCase().includes(term);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyBox.classList.remove('hidden');
                return;
            }
            emptyBox.classList.add('hidden');
            filtered.forEach(({ id, data }) => grid.appendChild(renderCard(id, data)));
        }

        function buildCategoryFilters() {
            const categories = [...new Set(allRestaurants.map(r => r.data.category).filter(Boolean))];
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.dataset.cat = cat;
                btn.className = "cat-btn bg-white border border-gray-300 text-gray-700 text-sm px-3 py-1 rounded-full hover:bg-gray-50";
                btn.innerText = cat;
                filtersBox.appendChild(btn);
            });
        }

        filtersBox.addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            activeCategory = btn.dataset.cat;
            [...filtersBox.querySelectorAll('.cat-btn')].forEach(b => {
                b.classList.remove('bg-safra-gold', 'text-white');
                b.classList.add('bg-white', 'border', 'border-gray-300', 'text-gray-700');
            });
            btn.classList.add('bg-safra-gold', 'text-white');
            btn.classList.remove('bg-white', 'border', 'border-gray-300', 'text-gray-700');
            applyFilters();
        });

        searchInput.addEventListener('input', applyFilters);

        async function loadRestaurants() {
            try {
                const snapshot = await getDocs(collection(db, "restaurants"));
                loading.classList.add('hidden');

                if (snapshot.empty) {
                    emptyBox.classList.remove('hidden');
                    emptyBox.innerText = "لا يوجد مطاعم بعد. جرّب صفحة seed_data.html لإضافة بيانات تجريبية.";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    allRestaurants.push({ id: docSnap.id, data: docSnap.data() });
                });

                buildCategoryFilters();
                applyFilters();
            } catch (error) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.innerText = "خطأ بتحميل المطاعم: " + error.message;
            }
        }

        loadRestaurants();
    </script>
</body>
</html>
