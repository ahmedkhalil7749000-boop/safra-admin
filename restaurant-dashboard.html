<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

          extend: {
            colors: {

    <style>
        :root {
            --ink: #231f18;
            --ink-soft: #6b6255;
            --line: #e7ddc9;
            --panel: #ffffff;
            --sand: #f3ecdd;
            --green: #2f6b45;
            --green-deep: #173628;
            --green-tint: #eaf2ea;
            --green-line: #cfe1d2;
            --saffron: #b5651d;
            --saffron-deep: #8f4e14;
            --saffron-tint: #fbf0e2;
            --saffron-line: #ecd7b8;
            --info: #2b6c7a;
            --info-tint: #e9f3f4;
            --info-line: #c7e0e3;
            --red: #ad3b2d;
            --red-tint: #fbeae7;
            --red-line: #eec9c1;
        }
        * { font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; }
        body { color: var(--ink); }

        /* ===== لوحة/بطاقة أساسية ===== */
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(35,31,24,.04), 0 14px 30px -22px rgba(35,31,24,.28);
        }
        .subpanel {
            background: var(--sand);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .hairline { border-top: 1px solid var(--line); }

        /* ===== أزرار ===== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            font-weight: 600; font-size: 13.5px; border-radius: 12px; padding: 10px 18px;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
            cursor: pointer; border: 1.5px solid transparent; line-height: 1.2; white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }
        .btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 10px; }
        .btn-primary { background: var(--saffron); color: #fff; }
        .btn-primary:hover { background: var(--saffron-deep); }
        .btn-dark { background: var(--green-deep); color: #fff; }
        .btn-dark:hover { background: #0f281d; }
        .btn-outline { background: var(--panel); color: var(--ink); border-color: var(--line); }
        .btn-outline:hover { border-color: var(--green); color: var(--green-deep); }
        .btn-ghost { background: transparent; color: var(--ink-soft); }
        .btn-ghost:hover { background: var(--sand); color: var(--ink); }
        .btn-danger-ghost { background: transparent; color: var(--red); }
        .btn-danger-ghost:hover { background: var(--red-tint); }
        .btn-block { width: 100%; }
        .btn[disabled] { opacity: .55; cursor: not-allowed; }
        .icon { width: 15px; height: 15px; flex-shrink: 0; }
        .icon-sm { width: 13px; height: 13px; }

        /* ===== حقول الإدخال ===== */
        .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
        .field-hint { color: var(--ink-soft); font-weight: 400; font-size: 12px; }
        .field {
            width: 100%; padding: 10px 13px; border-radius: 12px; font-size: 14px;
            border: 1.5px solid var(--line); background: var(--panel); color: var(--ink);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .field:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
        .field-file { width: 100%; font-size: 12.5px; color: var(--ink-soft); }

        /* ===== شرائح التصنيف (متعدد الاختيار) ===== */
        .category-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .category-chip {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 14px 7px 8px; border-radius: 9999px; font-size: 13px; font-weight: 600;
            border: 1.5px solid var(--line); background: var(--panel); color: var(--ink-soft);
            cursor: pointer; user-select: none; transition: border-color .15s ease, background-color .15s ease, color .15s ease;
        }
        .category-chip:hover { border-color: var(--green); }
        .category-chip .chip-icon { font-size: 15px; line-height: 1; }
        .category-chip .chip-check {
            width: 15px; height: 15px; border-radius: 9999px; border: 1.5px solid var(--line);
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
            background: var(--panel); transition: all .15s ease;
        }
        .category-chip .chip-check svg { width: 9px; height: 9px; display: none; }
        .category-chip.checked { border-color: var(--green); background: var(--green-tint); color: var(--green-deep); }
        .category-chip.checked .chip-check { background: var(--green); border-color: var(--green); }
        .category-chip.checked .chip-check svg { display: block; }

        /* ===== شارات ===== */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 9999px; font-size: 11.5px; font-weight: 700;
        }
        .badge-cat { background: var(--green-tint); color: var(--green-deep); border: 1px solid var(--green-line); }
        .badge-muted { background: var(--sand); color: var(--ink-soft); border: 1px solid var(--line); }
        .badge-live { background: var(--green-tint); color: var(--green-deep); }
        .badge-paused { background: var(--sand); color: var(--ink-soft); }
        .badge svg { width: 10px; height: 10px; }

        /* ===== بطاقات تنبيه/حالة ===== */
        .status-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); }
        .status-icon { width: 34px; height: 34px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
        .status-icon svg { width: 17px; height: 17px; }
        .status-text { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; line-height: 1.55; }
        .status-warn { background: var(--saffron-tint); border-color: var(--saffron-line); }
        .status-warn .status-icon { background: var(--saffron); }
        .status-warn .status-text { color: var(--saffron-deep); }
        .status-info { background: var(--info-tint); border-color: var(--info-line); }
        .status-info .status-icon { background: var(--info); }
        .status-info .status-text { color: var(--info); }
        .status-success { background: var(--green-tint); border-color: var(--green-line); }
        .status-success .status-icon { background: var(--green); }
        .status-success .status-text { color: var(--green-deep); }
        .status-danger { background: var(--red-tint); border-color: var(--red-line); }
        .status-danger .status-icon { background: var(--red); }
        .status-danger .status-text { color: var(--red); }

        /* ===== صف صنف بالمنيو ===== */
        .item-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
        }

        /* ===== نص حالة (نجاح/خطأ/جاري) ===== */
        .form-msg { font-size: 13px; font-weight: 600; }
        .form-msg.busy { color: var(--info); }
        .form-msg.ok { color: var(--green); }
        .form-msg.err { color: var(--red); }

        .spinner {
            width: 14px; height: 14px; border-radius: 9999px; display: inline-block;
            border: 2px solid currentColor; border-inline-start-color: transparent;
            animation: spin .7s linear infinite; vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 28px 16px; color: var(--ink-soft); font-size: 13.5px; }
    </style>
    <!-- تضمين فايربيس (Firebase v10.8.0) -->
    <script type="module">
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, serverTimestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initPushNotifications } from "./push-notifications.js";
        import { auth, db } from "./firebase-config.js";

        // تفعيل الإشعارات الفورية (Push) لصاحب المطعم (تنبيهات الطلبات المسبقة والجديدة)
        initPushNotifications();

        // ==== تنظيف رقم واتساب المطعم مهما كانت الصيغة يلي كتبها صاحب المطعم ====
        // بتقبل: 0791234567 / 00962791234567 / +962791234567 / 962791234567
        // وبترجعهم كلهم لنفس الصيغة الصحيحة يلي بيفهمها رابط wa.me: 962791234567 (بدون + وبدون 00)
        function normalizeJordanPhone(raw) {
            let digits = (raw || '').replace(/[^0-9]/g, '');
            if (!digits) return '';
            if (digits.startsWith('00')) digits = digits.slice(2);   // شيل بادئة الاتصال الدولي 00
            if (digits.startsWith('962')) return digits;             // رمز الدولة موجود مسبقًا
            if (digits.startsWith('0')) return '962' + digits.slice(1); // صيغة محلية 07XXXXXXXX
            return '962' + digits;                                   // افتراضي: ناقص رمز الدولة بس
        }

        // ==== رفع الصور عبر imgbb بدل Firebase Storage (لتفادي الاشتراك المدفوع) ====
        const IMGBB_API_KEY = "7dfc52facabaef7d38eddf1c83976c5d";

        async function uploadToImgbb(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            if (!result.success) {
                throw new Error((result.error && result.error.message) || "فشل رفع الصورة إلى imgbb");
            }
            return result.data.url;
        }

        // ==== رفع الفيديوهات عبر Cloudinary (Unsigned Upload Preset) ====
        const CLOUDINARY_CLOUD_NAME = "a81hyco5";
        const CLOUDINARY_VIDEO_PRESET = "safra_videos";

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_VIDEO_PRESET);
            const response = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`,
                { method: "POST", body: formData }
            );
            const result = await response.json();
            if (!result.secure_url) {
                throw new Error((result.error && result.error.message) || "فشل رفع الفيديو إلى Cloudinary");
            }
            return result.secure_url;
        }

        // ==== قائمة التصنيفات الموحّدة (تستخدم لتصنيف المطعم وتصنيف كل صنف بالمنيو) ====
        const CATEGORY_LIST = [
            { key: "طبيخ", icon: "🍲" },
            { key: "حلويات", icon: "🍰" },
            { key: "مقبلات", icon: "🥗" },
            { key: "معجنات", icon: "🥐" },
            { key: "فطور", icon: "🍳" },
            { key: "سلطات", icon: "🥬" },
            { key: "مشروبات", icon: "🥤" },
            { key: "مونة", icon: "🫙" },
            { key: "بوكسات مناسبات", icon: "🎁" },
        ];

        // ==== مجموعة أيقونات SVG بسيطة موحّدة (بدل الاعتماد الكامل على الإيموجي بعناصر الواجهة) ====
        const ICONS = {
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            edit: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>`,
            list: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>`,
            trash: `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`,
            plus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
            clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>`,
            alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>`,
            refresh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`,
            key: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"></circle><path d="m21 2-9.6 9.6"></path><path d="m15.5 7.5 3 3L22 7l-3-3"></path></svg>`,
            close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>`,
        };

        // ==== نظام البانر والفيديو (يعتمد على اشتراكي "بانر" و"فيديو" المستقلين) ====

        // هل اشتراك ترويجي (بانر/فيديو) لسا فعّال وما انتهت مدته؟
        function isPromoActive(data, statusField, endDateField) {
            if (data[statusField] !== 'نشط') return false;
            const end = data[endDateField]?.toDate ? data[endDateField].toDate() : (data[endDateField] ? new Date(data[endDateField]) : null);
            if (end && end.getTime() < Date.now()) return false;
            return true;
        }

        // شريحة حالة مراجعة المحتوى (البانر أو الفيديو): قيد المراجعة / معتمد / مرفوض
        function contentStatusBadge(status) {
            if (status === 'معتمد') return `<span class="badge badge-live">${ICONS.check} معتمد ويظهر بالرئيسية</span>`;
            if (status === 'قيد المراجعة') return `<span class="badge badge-paused">${ICONS.clock} قيد مراجعة الأدمن</span>`;
            if (status === 'مرفوض') return `<span class="badge" style="background: var(--red-tint); color: var(--red);">${ICONS.close} مرفوض</span>`;
            return '';
        }

        // يبني قسم "الترويج" (البانر والفيديو) لمطعم معيّن حسب بياناته الحالية
        function renderPromoSection(restaurantId, data) {
            const bannerActive = isPromoActive(data, 'bannerSubscriptionStatus', 'bannerSubscriptionEndDate');
            const videoActive = isPromoActive(data, 'videoSubscriptionStatus', 'videoSubscriptionEndDate');

            const bannerBlock = bannerActive ? `
                ${data.bannerUrl ? `<img src="${data.bannerUrl}" class="w-full h-28 object-cover rounded-xl mb-3 border" style="border-color: var(--line);">` : ''}
                <div class="mb-3">${contentStatusBadge(data.bannerStatus)}</div>
                ${data.bannerStatus === 'مرفوض' && data.bannerRejectReason ? `<p class="text-xs mb-2" style="color: var(--red);">سبب الرفض: ${data.bannerRejectReason}</p>` : ''}
                <form id="banner-form-${restaurantId}" class="space-y-2">
                    <label class="field-label">${data.bannerUrl ? 'تغيير صورة البانر' : 'رفع صورة البانر'} <span class="field-hint">(مقاس أفقي عريض يُفضّل، مثلاً 1200×500)</span></label>
                    <input type="file" id="banner-file-${restaurantId}" accept="image/*" required class="field-file">
                    <button type="submit" class="btn btn-primary btn-sm">رفع البانر لمراجعة الأدمن</button>
                    <p id="banner-msg-${restaurantId}" class="form-msg"></p>
                </form>
            ` : `
                <div class="status-card status-warn">
                    <span class="status-icon">${ICONS.key}</span>
                    <p class="status-text">لازم اشتراك بانر نشط عشان ترفعي صورة بانر تظهر بالصفحة الرئيسية.</p>
                </div>
                <a href="subscription.html" class="btn btn-primary btn-sm mt-3">اشترك بالبانر الآن</a>
            `;

            const videoBlock = videoActive ? `
                <div class="mb-3">${contentStatusBadge(data.videoStatus)}</div>
                ${data.videoStatus === 'مرفوض' && data.videoRejectReason ? `<p class="text-xs mb-2" style="color: var(--red);">سبب الرفض: ${data.videoRejectReason}</p>` : ''}
                <form id="video-form-${restaurantId}" class="space-y-2">
                    <label class="field-label">${data.videoUrl ? 'تغيير فيديو المطعم' : 'رفع فيديو المطعم'} <span class="field-hint">(ملف فيديو من جهازك، مثلاً MP4)</span></label>
                    ${data.videoUrl ? `<video src="${data.videoUrl}" class="w-full rounded-xl mb-2" style="max-height:180px;" controls></video>` : ''}
                    <input type="file" id="video-file-${restaurantId}" accept="video/*" ${data.videoUrl ? '' : 'required'} class="field-file">
                    <button type="submit" class="btn btn-primary btn-sm">إرسال الفيديو لمراجعة الأدمن</button>
                    <p id="video-msg-${restaurantId}" class="form-msg"></p>
                </form>
            ` : `
                <div class="status-card status-warn">
                    <span class="status-icon">${ICONS.key}</span>
                    <p class="status-text">لازم اشتراك فيديو نشط عشان تضيفي فيديو ترويجي لمطعمك يظهر بالرئيسية.</p>
                </div>
                <a href="subscription.html" class="btn btn-primary btn-sm mt-3">اشترك بالفيديو الآن</a>
            `;

            return `
                <div>
                    <h3 class="font-bold mb-3 flex items-center gap-1.5" style="color: var(--ink);">🖼️ بانر الصفحة الرئيسية</h3>
                    ${bannerBlock}
                </div>
                <div class="hairline pt-5">
                    <h3 class="font-bold mb-3 flex items-center gap-1.5" style="color: var(--ink);">🎬 فيديو المطعم</h3>
                    ${videoBlock}
                </div>
            `;
        }

        // يربط أحداث نماذج رفع البانر/الفيديو بعد إدراجها بالـ DOM
        function bindPromoHandlers(restaurantId) {
            const bannerForm = document.getElementById(`banner-form-${restaurantId}`);
            if (bannerForm) {
                bannerForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const msg = document.getElementById(`banner-msg-${restaurantId}`);
                    const file = document.getElementById(`banner-file-${restaurantId}`).files[0];
                    if (!file) return;
                    msg.className = "form-msg busy";
                    msg.innerText = "جاري رفع البانر...";
                    try {
                        const bannerUrl = await uploadToImgbb(file);
                        await updateDoc(doc(db, "restaurants", restaurantId), {
                            bannerUrl,
                            bannerStatus: "قيد المراجعة",
                            bannerRejectReason: "",
                            bannerSubmittedAt: serverTimestamp()
                        });
                        msg.className = "form-msg ok";
                        msg.innerText = "تم الرفع! بانتظار موافقة الأدمن.";
                        await loadMyRestaurant(currentUserEmail);
                    } catch (error) {
                        msg.className = "form-msg err";
                        msg.innerText = "خطأ: " + error.message;
                    }
                });
            }

            const videoForm = document.getElementById(`video-form-${restaurantId}`);
            if (videoForm) {
                videoForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const msg = document.getElementById(`video-msg-${restaurantId}`);
                    const file = document.getElementById(`video-file-${restaurantId}`).files[0];
                    if (!file) return;
                    msg.className = "form-msg busy";

        // بيرجع مصفوفة تصنيفات المطعم بشكل موحّد، حتى لو المطعم قديم ومخزن فيه
        // حقل category المفرد بدل categories (توافق مع بيانات قديمة)
        function restaurantCategories(data) {
            if (Array.isArray(data.categories) && data.categories.length) return data.categories;
            if (data.category) return [data.category];
            return [];
        }

        // برسم مجموعة "چيبس" قابلة للتحديد المتعدد جوا عنصر بمعرّف containerId
        function renderCategoryChips(containerId, selected = []) {
            const box = document.getElementById(containerId);
            if (!box) return;
            box.innerHTML = CATEGORY_LIST.map(c => `
                <label class="category-chip ${selected.includes(c.key) ? 'checked' : ''}">
                    <input type="checkbox" value="${c.key}" ${selected.includes(c.key) ? 'checked' : ''} class="hidden">
                    <span class="chip-check">${ICONS.check}</span>
                    <span class="chip-icon">${c.icon}</span>
                    <span>${c.key}</span>
                </label>
            `).join('');
            box.querySelectorAll('.category-chip').forEach(chip => {
                const input = chip.querySelector('input');
                // مهم: بنسمع لحدث change على الـ checkbox نفسه (بيصير مرة وحدة بالضبط لكل ضغطة)
                // مش لحدث click على الـ label، لأن المتصفح بيولّد كليك تاني تلقائي عالـ checkbox
                // جوا الـ label، فكان عم يصير تبديل مرتين (توجل مرتين) وبالتالي التصنيف ما كان يتغيّر.
                input.addEventListener('change', () => {
                    chip.classList.toggle('checked', input.checked);
                });
            });
        }

        // بيرجع مصفوفة القيم المحددة جوا مجموعة چيبس بمعرّف containerId
        function getCheckedCategories(containerId) {
            const box = document.getElementById(containerId);
            if (!box) return [];
            return [...box.querySelectorAll('input[type="checkbox"]:checked')].map(i => i.value);
        }

        // ===== شريط حالة الاشتراك (يعرض آخر حالة اشتراك لهذا المستخدم) =====
        async function loadSubscriptionBanner(uid) {
            const box = document.getElementById('subscription-banner');
            if (!box) return;
            try {
                // ملاحظة: تفادينا هون استخدام orderBy مع where على حقل مختلف
                // (بيحتاج فهرس مركّب بفايربيس)، وبدلها بنجيب كل طلبات هالمستخدم
                // ونرتبها يدويًا بالجافاسكربت — أبسط وما بتحتاج نشر فهرس إضافي.
                const q = query(collection(db, "subscriptions"), where("ownerUid", "==", uid));
                const snap = await getDocs(q);

                if (snap.empty) {
                    box.innerHTML = `
                        <div class="status-card status-warn flex-col sm:flex-row !items-stretch sm:!items-center">
                            <div class="flex items-center gap-3">
                                <span class="status-icon">${ICONS.key}</span>
                                <p class="status-text">حسابك غير مفعّل بعد. اشتركي الآن لتفعيل مطعمك على المنصة.</p>
                            </div>
                            <a href="subscription.html" class="btn btn-primary btn-sm shrink-0">اشترك الآن</a>
                        </div>`;
                    return;
                }

                // اختيار أحدث طلب اشتراك (الأكبر بـ createdAt) يدويًا
                const docsData = snap.docs.map(d => d.data());
                docsData.sort((a, b) => {
                    const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return tb - ta;
                });
                const sub = docsData[0];
                if (sub.status === "قيد المراجعة") {
                    box.innerHTML = `
                        <div class="status-card status-warn">
                            <span class="status-icon">${ICONS.clock}</span>
                            <p class="status-text">طلب اشتراكك قيد المراجعة حاليًا من فريق سفرة.</p>
                        </div>`;
                } else if (sub.status === "بانتظار كود التفعيل") {
                    box.innerHTML = `
                        <div class="status-card status-info flex-col sm:flex-row !items-stretch sm:!items-center">
                            <div class="flex items-center gap-3">
                                <span class="status-icon">${ICONS.key}</span>
                                <p class="status-text">راجعنا طلبك! رح نرسلّك كود تفعيل، أدخليه من صفحة الاشتراك لتفعيل حسابك فورًا.</p>
                            </div>
                            <a href="subscription.html" class="btn btn-dark btn-sm shrink-0">إدخال الكود</a>
                        </div>`;
                } else if (sub.status === "نشط") {
                    const end = sub.endDate?.toDate ? sub.endDate.toDate() : new Date(sub.endDate);
                    if (end && end.getTime() < Date.now()) {
                        box.innerHTML = `
                            <div class="status-card status-warn flex-col sm:flex-row !items-stretch sm:!items-center">
                                <div class="flex items-center gap-3">
                                    <span class="status-icon">${ICONS.refresh}</span>
                                    <p class="status-text">انتهت مدة اشتراكك. جدّديه الآن حتى يضل مطعمك مفعّلاً.</p>
                                </div>
                                <a href="subscription.html" class="btn btn-primary btn-sm shrink-0">تجديد الاشتراك</a>
                            </div>`;
                    } else {
                        box.innerHTML = `
                            <div class="status-card status-success">
                                <span class="status-icon">${ICONS.check}</span>
                                <p class="status-text">اشتراكك فعّال حتى ${end ? end.toLocaleDateString('ar-EG') : '-'}</p>
                            </div>`;
                    }
                } else if (sub.status === "مرفوض") {
                    box.innerHTML = `
                        <div class="status-card status-danger flex-col sm:flex-row !items-stretch sm:!items-center">
                            <div class="flex items-center gap-3">
                                <span class="status-icon">${ICONS.close}</span>
                                <p class="status-text">تم رفض طلب اشتراكك السابق${sub.adminNote ? ': ' + sub.adminNote : ''}.</p>
                            </div>
                            <a href="subscription.html" class="btn btn-primary btn-sm shrink-0">إعادة المحاولة</a>
                        </div>`;
                } else {
                    box.innerHTML = `
                        <div class="status-card status-warn flex-col sm:flex-row !items-stretch sm:!items-center">
                            <div class="flex items-center gap-3">
                                <span class="status-icon">${ICONS.refresh}</span>
                                <p class="status-text">اشتراكك منتهي. جدّديه للاستمرار باستخدام المنصة.</p>
                            </div>
                            <a href="subscription.html" class="btn btn-primary btn-sm shrink-0">تجديد الاشتراك</a>
                        </div>`;
                }
            } catch (error) {
                console.error("تعذر تحميل حالة الاشتراك:", error);
            }
        }

                    });
                });

                // ربط نماذج رفع البانر/الفيديو لكل مطعم
                querySnapshot.forEach((docSnap) => bindPromoHandlers(docSnap.id));

                // معالجة نموذج إضافة الصنف مع الوصف الجديد
                container.querySelectorAll('[id^="add-item-form-"]').forEach(form => {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const id = form.id.replace('add-item-form-', '');
                        const msg = document.getElementById(`item-message-${id}`);
                        const nameInput = document.getElementById(`item-name-${id}`);
                        const priceInput = document.getElementById(`item-price-${id}`);
                        const descInput = document.getElementById(`item-desc-${id}`);
                        const categoryInput = document.getElementById(`item-category-${id}`);
                        const imageInput = document.getElementById(`item-image-${id}`);

                        const name = nameInput.value.trim();
                        const price = parseFloat(priceInput.value);
                        const description = descInput.value.trim();
                        const category = categoryInput.value;
                        const imageFile = imageInput.files[0];

                        if (!name || isNaN(price)) return;
                        if (!category) {
                            msg.className = "form-msg err mt-2";
                            msg.innerText = "لازم تختار تصنيف الصنف.";
                            return;
                        }

                        msg.className = "form-msg busy mt-2";
                        msg.innerText = "جاري إضافة الوجبة...";

                        try {
                            let imageUrl = "";
                            if (imageFile) {
                                imageUrl = await uploadToImgbb(imageFile);
                            }

                            // حفظ الصنف مع الوصف والتصنيف الجديد في قاعدة البيانات
                            await addDoc(collection(db, "menuItems"), {
                                restaurantId: id,
                                name: name,
                                price: price,
                                description: description,
                                category: category,
                                imageUrl: imageUrl,
                                createdAt: serverTimestamp()
                            });

                            nameInput.value = "";
                            priceInput.value = "";
                            descInput.value = "";
                            categoryInput.value = "";
                            imageInput.value = "";
                            msg.className = "form-msg ok mt-2";
                            msg.innerText = "تمت إضافة الوجبة بنجاح!";
                            await loadMenuItems(id);
                        } catch (error) {
                            msg.className = "form-msg err mt-2";
                            msg.innerText = "خطأ: " + error.message;
                        }
                    });
                });
            } catch (error) {
                console.error("خطأ في جلب بيانات المطعم:", error);
            }
        }

        async function loadMenuItems(restaurantId) {
            const listEl = document.getElementById(`items-list-${restaurantId}`);
            if (!listEl) return;
            listEl.innerHTML = `<div class="empty-state flex items-center justify-center gap-2"><span class="spinner"></span> جاري التحميل...</div>`;

            try {
                const q = query(collection(db, "menuItems"), where("restaurantId", "==", restaurantId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listEl.innerHTML = `<div class="empty-state">لا توجد أصناف مضافة بعد. ضيفي أول صنف من النموذج تحت.</div>`;
                    return;
                }

                listEl.innerHTML = "";
                querySnapshot.forEach((itemDoc) => {
                    const item = itemDoc.data();
                    listEl.innerHTML += `
                        <div class="item-row">
                            <div class="flex items-center gap-3 min-w-0">
                                ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-12 h-12 object-cover rounded-lg shrink-0">` : ''}
                                <div class="min-w-0">
                                    <h4 class="font-bold text-sm truncate" style="color: var(--ink);">${item.name} <span style="color: var(--ink-soft); font-weight: 500;">—</span> <span style="color: var(--saffron);">${item.price} د.أ</span></h4>
                                    <p class="text-xs mb-1.5 truncate" style="color: var(--ink-soft);">${item.description || 'بدون وصف'}</p>
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <select data-item-id="${itemDoc.id}" class="item-category-select text-[11px] font-medium rounded-full px-2 py-1" style="border: 1.5px solid var(--line); background: var(--panel); color: var(--ink);">
                                            <option value="" ${!item.category ? 'selected' : ''}>بدون تصنيف</option>
                                            ${CATEGORY_LIST.map(c => `<option value="${c.key}" ${item.category === c.key ? 'selected' : ''}>${c.icon} ${c.key}</option>`).join('')}
                                        </select>
                                        <button data-item-id="${itemDoc.id}" data-restaurant-id="${restaurantId}" class="save-item-category-btn text-[11px] font-semibold" style="color: var(--green);">حفظ التصنيف</button>
                                        <span data-msg-for="${itemDoc.id}" class="text-[11px] font-semibold"></span>
                                    </div>
                                </div>
                            </div>
                            <button data-item-id="${itemDoc.id}" data-restaurant-id="${restaurantId}" class="delete-item-btn btn btn-ghost btn-sm shrink-0" style="color: var(--red); padding: 8px;">${ICONS.trash}</button>
                        </div>
                    `;
                });

                listEl.querySelectorAll('.save-item-category-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const itemId = btn.dataset.itemId;
                        const select = listEl.querySelector(`.item-category-select[data-item-id="${itemId}"]`);
                        const msgEl = listEl.querySelector(`[data-msg-for="${itemId}"]`);
                        const newCategory = select.value;
                        if (!newCategory) {
                            msgEl.className = "form-msg err text-[11px]";
                            msgEl.innerText = "اختر تصنيف أولاً";
                            return;
                        }
                        msgEl.className = "form-msg busy text-[11px]";
                        msgEl.innerText = "جاري الحفظ...";
                        try {
                            await updateDoc(doc(db, "menuItems", itemId), { category: newCategory });
                            msgEl.className = "form-msg ok text-[11px]";
                            msgEl.innerText = "تم ✓";
                        } catch (error) {
                            msgEl.className = "form-msg err text-[11px]";
                            msgEl.innerText = "خطأ: " + error.message;
                        }
                    });
                });

                listEl.querySelectorAll('.delete-item-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        try {
                            await deleteDoc(doc(db, "menuItems", btn.dataset.itemId));
                            await loadMenuItems(btn.dataset.restaurantId);
                        } catch (error) {
                            console.error("خطأ في حذف الصنف:", error);
                        }
                    });
                });
            } catch (error) {
                listEl.innerHTML = `<p class="form-msg err">خطأ بتحميل الأصناف: ${error.message}</p>`;
            }
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "Auth.html";
            });
        }
    </script>
</head>
<body class="app-wide min-h-screen" style="background: var(--sand);">

    <header class="bg-white flex flex-wrap items-center justify-between gap-3 px-4 sm:px-8" style="padding: 14px 16px calc(14px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line);">
        <div class="flex items-center gap-2.5 min-w-0">
            <img src="logo.png" alt="سفرة" class="h-9 w-9 object-contain rounded-full shrink-0" style="border: 1.5px solid var(--line);">
            <div class="min-w-0 leading-tight">
                <p class="font-display font-extrabold truncate" style="font-size: 19px; color: var(--green-deep);">سفرة</p>
                <p class="text-[11px] truncate" style="color: var(--ink-soft);">لوحة تحكم المطعم</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
            <a href="adman.html" class="btn btn-ghost btn-sm">إدارة الطلبات</a>
            <a href="subscription.html" class="btn btn-ghost btn-sm">اشتراكي</a>
            <span id="user-email" class="hidden sm:inline text-xs font-medium ms-1" style="color: var(--ink-soft);"></span>
            <button onclick="logout()" class="btn btn-danger-ghost btn-sm">خروج</button>
        </div>
    </header>

    <main class="p-4 sm:p-6">
        <div id="subscription-banner" class="mb-5"></div>
        <div class="mb-4">
            <h2 class="font-display font-extrabold" style="font-size: 22px; color: var(--green-deep);">مطعمي</h2>
            <p class="text-sm" style="color: var(--ink-soft);">بيانات مطعمك، تصنيفاته، وقائمة الأصناف من مكان وحد.</p>
        </div>
        <div id="restaurant-info" class="grid grid-cols-1 gap-4">
            <div class="panel p-6 flex items-center justify-center gap-2 text-sm" style="color: var(--ink-soft);">
                <span class="spinner"></span> جاري تحميل بيانات مطعمك...
            </div>
        </div>
    </main>

</body>
</html>
