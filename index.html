<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة سفرة - اكتشف أشهى المطاعم</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- تضمين فايربيس -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // جلب المطاعم وعرضها بتصميم بطاقات حديثة
        async function loadRestaurants() {
            const grid = document.getElementById('restaurants-grid');
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-safra-gold mb-2"></i>
                    <p class="text-gray-500">جاري تحميل أشهى المطاعم...</p>
                </div>
            `;

            try {
                const querySnapshot = await getDocs(collection(db, "restaurants"));
                if (querySnapshot.empty) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-white rounded-2xl shadow-sm border border-gray-100">
                            <i class="fa-solid fa-utensils text-4xl text-gray-300 mb-3"></i>
                            <p class="text-gray-500 font-medium">لا توجد مطاعم متاحة حالياً.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const r = docSnap.data();
                    const rId = docSnap.id;
                    
                    grid.innerHTML += `
                        <div onclick="window.location.href='صفحة_المطعم.html?id=${rId}'" class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition border border-gray-100 cursor-pointer group">
                            <div class="relative h-24 bg-gray-200 overflow-hidden">
                                <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'}" alt="${r.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <span class="absolute top-1.5 right-1.5 bg-white/90 backdrop-blur-sm text-[10px] font-bold px-2 py-0.5 rounded-full text-safra-green shadow-sm">
                                    ${r.status || 'نشط'}
                                </span>
                            </div>
                            <div class="p-2.5">
                                <h3 class="font-bold text-sm text-gray-800 mb-0.5 truncate group-hover:text-safra-gold transition">${r.name}</h3>
                                <p class="text-gray-500 text-[11px] mb-2 line-clamp-1">${r.description || 'مطعم مأكولات متنوعة'}</p>
                                <div class="flex items-center justify-between text-[10px] text-gray-500 pt-2 border-t border-gray-100">
                                    <span class="flex items-center gap-1 text-safra-gold font-bold">
                                        <i class="fa-solid fa-star"></i>
                                        ${r.reviewsCount ? `${r.rating ?? 0}` : `<span class="text-gray-400 font-normal">جديد</span>`}
                                    </span>
                                    <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> 30-40</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500">حدث خطأ أثناء تحميل المطاعم.</p>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadRestaurants);
    </script>
</head>
<body class="app-narrow bg-safra-cream min-h-screen text-gray-800 font-sans">

    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <!-- قسم الهيرو والبحث الترحيبي -->
    <section class="bg-gradient-to-br from-safra-dark via-safra-green to-safra-dark text-white py-10 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-2xl font-extrabold mb-3">اطلب وجبتك المفضلة من أفضل المطاعم</h1>
            <p class="text-white/80 text-sm mb-6">توصيل سريع، أكل ساخن، وبأفضل الأسعار حتى باب بيتك.</p>
            <div class="bg-white p-1.5 rounded-full shadow-lg flex items-center">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3 ml-2"></i>
                <input type="text" placeholder="ابحث عن مطعم أو وجبة معينة..." class="w-full bg-transparent border-none focus:outline-none text-gray-800 text-sm px-2">
                <button class="bg-safra-gold text-white px-4 py-2.5 rounded-full text-sm font-bold hover:bg-safra-gold-dark transition">ابحث</button>
            </div>
        </div>
    </section>

    <!-- محتوى المطاعم -->
    <main class="px-4 py-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-safra-dark">المطاعم المتاحة</h2>
            <span class="text-xs text-gray-500 font-medium">بالقرب منك</span>
        </div>

        <!-- شبكة عرض المطاعم -->
        <div id="restaurants-grid" class="grid grid-cols-2 gap-3">
            <!-- المطاعم ستظهر هنا تلقائياً -->
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

</body>
</html>
