<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الطلبات السابقة - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }

        /* نبضة واحدة فقط حول الخطوة الحالية بالتتبع - حركة واحدة مقصودة بدل تأثيرات متفرقة */
        @keyframes trackPulse {
            0%   { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.35); }
            70%  { box-shadow: 0 0 0 10px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }
        .track-node-active { animation: trackPulse 2s infinite; }

        @media (prefers-reduced-motion: reduce) {
            .track-node-active { animation: none; }
        }
    </style>
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-dark mb-4">طلباتي</h1>

        <div id="login-warning" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-4 text-center mb-4">
            الرجاء تسجيل الدخول لعرض طلباتك.
            <br>
            <a href="Auth.html" class="text-safra-gold font-semibold hover:underline mt-1 inline-block">تسجيل الدخول</a>
        </div>

        <div id="loading" class="text-center text-gray-500 py-10">جاري تحميل الطلبات...</div>
        <div id="empty" class="hidden text-center text-gray-500 py-16">
            <i class="fa-solid fa-receipt text-3xl text-gray-300 mb-3"></i>
            <p>لا توجد لديك أي طلبات حتى الآن.</p>
            <a href="المطاعم.html" class="text-safra-gold font-semibold hover:underline mt-2 inline-block">تصفح المطاعم</a>
        </div>

        <!-- بطاقة التتبع الحي للطلب الحالي (تظهر فقط لو في طلب لسا ما وصل) -->
        <div id="active-order-wrap"></div>

        <!-- سجل الطلبات السابقة -->
        <div id="history-wrap">
            <h2 id="history-title" class="hidden text-sm font-bold text-gray-500 mt-6 mb-3">سجل الطلبات</h2>
            <div id="orders-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginWarning = document.getElementById('login-warning');
        const loading = document.getElementById('loading');
        const empty = document.getElementById('empty');
        const ordersList = document.getElementById('orders-list');
        const historyTitle = document.getElementById('history-title');
        const activeOrderWrap = document.getElementById('active-order-wrap');

        // مراحل تتبع الطلب - مطابقة تمامًا للحالات الفعلية اللي بتحدّثها لوحة المطعم (adman.html)
        // لو الطلب استلمه الزبون بنفسه من المطعم، بتقصر السلسلة (بدون مرحلة "بالطريق إليك")
        function getStagesFor(data) {
            const stages = [
                { key: 'قيد المعالجة', label: 'استُلم الطلب',  icon: 'fa-receipt' },
                { key: 'تم القبول',    label: 'تم قبول الطلب', icon: 'fa-check' },
                { key: 'قيد التنفيذ',  label: 'يتم التحضير',   icon: 'fa-utensils' },
            ];
            if (data.deliveryMethod === 'selfPickup') {
                stages.push({ key: 'تم التسليم', label: 'استلمت طلبك', icon: 'fa-bag-shopping' });
            } else {
                stages.push({ key: 'تم الشحن',   label: 'بالطريق إليك', icon: 'fa-truck' });
                stages.push({ key: 'تم التسليم', label: 'تم التوصيل',   icon: 'fa-circle-check' });
            }
            return stages;
        }

        function stageIndexFor(status, stages) {
            const i = stages.findIndex(s => s.key === status);
            return i === -1 ? 0 : i;
        }

        function timeAgo(date) {
            if (!date) return '';
            const diffMin = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
            if (diffMin < 1) return 'الآن';
            if (diffMin < 60) return `قبل ${diffMin} د`;
            const diffH = Math.round(diffMin / 60);
            if (diffH < 24) return `قبل ${diffH} س`;
            return date.toLocaleDateString('ar-EG');
        }

        function itemsSummary(data) {
            if (Array.isArray(data.items) && data.items.length) {
                return data.items.map(i => `${i.name || 'وجبة'} (${i.qty || 1})`).join('، ');
            }
            if (typeof data.items === 'string') return data.items;
            return 'طلب مطعم';
        }

        // ===== بطاقة التتبع الحي (الخط الزمني) =====
        function renderActiveOrderCard(orderId, data) {
            const status = data.status || 'قيد المعالجة';
            const STAGES = getStagesFor(data);
            const idx = stageIndexFor(status, STAGES);
            const progressPct = STAGES.length > 1 ? Math.round((idx / (STAGES.length - 1)) * 100) : 0;
            const createdAt = data.createdAt?.toDate ? data.createdAt.toDate() : null;
            const totalVal = typeof data.total === 'number' ? data.total.toFixed(2) : (data.total || '0.00');

            const stepsHtml = STAGES.map((stage, i) => {
                let circleClasses, iconColor, labelColor, ring = '';
                if (i < idx) {
                    circleClasses = 'bg-safra-green border-safra-green text-white';
                    labelColor = 'text-safra-dark font-semibold';
                } else if (i === idx) {
                    circleClasses = 'bg-safra-gold border-safra-gold text-white';
                    labelColor = 'text-safra-gold-dark font-bold';
                    ring = 'track-node-active';
                } else {
                    circleClasses = 'bg-white border-gray-300 text-gray-300';
                    labelColor = 'text-gray-400';
                }
                const icon = i < idx ? 'fa-check' : stage.icon;
                return `
                    <div class="relative z-10 flex flex-col items-center gap-2 flex-1">
                        <div class="w-9 h-9 rounded-full border-2 flex items-center justify-center text-sm ${circleClasses} ${ring}">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <span class="text-[11px] text-center leading-tight ${labelColor}">${stage.label}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-2xl shadow-md border border-safra-gold/20 p-5 mb-6">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-safra-gold-dark tracking-tight">طلبك الحالي</span>
                        <span class="text-[11px] text-gray-400">${timeAgo(createdAt)}</span>
                    </div>
                    <p class="text-sm text-gray-700 mb-5">${itemsSummary(data)}</p>

                    <div class="relative flex justify-between items-start px-1">
                        <div class="absolute top-4 right-0 left-0 h-1 bg-gray-200 rounded-full"></div>
                        <div class="absolute top-4 right-0 h-1 bg-safra-green rounded-full transition-all duration-700" style="width: ${progressPct}%;"></div>
                        ${stepsHtml}
                    </div>

                    <div class="flex justify-between items-center text-sm mt-5 pt-3 border-t border-gray-100">
                        <span class="text-xs text-gray-400">رقم الطلب #${orderId.substring(0, 6)}</span>
                        <span class="font-bold text-safra-gold">${totalVal} د.أ</span>
                    </div>
                </div>
            `;
        }

        // ===== بطاقة بسيطة بسجل الطلبات (طلبات سابقة/منتهية) =====
        const STATUS_STYLES = {
            'قيد المعالجة': 'bg-yellow-100 text-yellow-800',
            'تم القبول': 'bg-blue-100 text-blue-800',
            'قيد التنفيذ': 'bg-purple-100 text-purple-800',
            'تم الشحن': 'bg-indigo-100 text-indigo-800',
            'تم التسليم': 'bg-green-100 text-green-800',
            'مرفوض': 'bg-red-100 text-red-800',
        };

        function renderHistoryCard(orderId, data) {
            const status = data.status || 'قيد المعالجة';
            const statusClass = STATUS_STYLES[status] || 'bg-safra-gold/10 text-safra-gold-dark';
            const totalVal = typeof data.total === 'number' ? data.total.toFixed(2) : (data.total || '0.00');
            const dateStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('ar-EG') : 'حديثاً';

            let scheduleBadge = '';
            if (data.isScheduled && data.scheduledFor?.toDate) {
                scheduleBadge = `<p class="text-xs text-safra-gold-dark font-semibold mt-1">🕒 طلب مسبق - الموعد: ${data.scheduledFor.toDate().toLocaleString('ar-EG')}</p>`;
            }

            let rejectionBadge = '';
            if (status === 'مرفوض' && data.rejectionReason) {
                rejectionBadge = `<p class="text-xs text-red-600 mt-1">سبب الرفض: ${data.rejectionReason}</p>`;
            }

            const card = document.createElement('div');
            card.className = "bg-white rounded-lg border border-gray-200 p-4";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2 border-b pb-2">
                    <span class="text-xs text-gray-400">رقم الطلب: #${orderId.substring(0, 6)}</span>
                    <span class="text-xs font-semibold ${statusClass} px-2 py-1 rounded">${status}</span>
                </div>
                <p class="text-sm font-medium text-gray-800 mb-2">${itemsSummary(data)}</p>
                ${scheduleBadge}
                ${rejectionBadge}
                <div class="flex justify-between items-center text-sm mt-3 pt-2 border-t border-gray-100">
                    <span class="text-xs text-gray-500">${dateStr}</span>
                    <span class="font-bold text-safra-gold text-base">${totalVal} د.أ</span>
                </div>
            `;
            return card;
        }

        // ===== تنبيه الطلب المسبق عند حلول الموعد (نفس المنطق السابق) =====
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(ctx.destination);
                o.type = 'sine';
                o.frequency.value = 880;
                g.gain.setValueAtTime(0.15, ctx.currentTime);
                o.start();
                o.stop(ctx.currentTime + 0.4);
            } catch (e) { /* تجاهل لو المتصفح ما يدعم الصوت */ }
        }

        function showScheduleAlert(orderId) {
            const banner = document.createElement('div');
            banner.className = "app-toast bg-safra-gold text-white px-4 py-3 rounded-lg shadow-lg text-sm font-semibold text-center";
            banner.innerText = `⏰ حان موعد طلبك المسبق #${orderId.substring(0, 6)} - جاري تجهيزه الآن!`;
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 7000);

            playAlertSound();

            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('سفرة - تنبيه طلب مسبق', {
                    body: `حان موعد طلبك رقم #${orderId.substring(0, 6)}`,
                    icon: 'logo.png'
                });
            }
        }

        let scheduleWatcher = null;
        function startScheduleWatcher(scheduledOrders) {
            if (scheduleWatcher) clearInterval(scheduleWatcher);
            if (!scheduledOrders.length) return;

            const checkNow = async () => {
                const now = new Date();
                for (const o of scheduledOrders) {
                    if (o.notified || !o.scheduledFor) continue;
                    if (now >= o.scheduledFor) {
                        o.notified = true;
                        showScheduleAlert(o.id);
                        try {
                            await updateDoc(doc(db, "orders", o.id), {
                                status: "قيد المعالجة",
                                scheduleNotified: true
                            });
                            // onSnapshot رح يحدّث الواجهة تلقائيًا
                        } catch (e) {
                            console.error("تعذر تحديث حالة الطلب المسبق:", e);
                        }
                    }
                }
            };

            checkNow();
            scheduleWatcher = setInterval(checkNow, 15000);
        }
        // ===== نهاية منطق تنبيه الطلب المسبق =====

        let unsubscribeOrders = null;

        onAuthStateChanged(auth, (user) => {
            if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; }

            if (!user) {
                loading.classList.add('hidden');
                loginWarning.classList.remove('hidden');
                return;
            }
            loginWarning.classList.add('hidden');

            const q = query(collection(db, "orders"), where("customerId", "==", user.uid));

            unsubscribeOrders = onSnapshot(q, (snapshot) => {
                loading.classList.add('hidden');

                if (snapshot.empty) {
                    empty.classList.remove('hidden');
                    activeOrderWrap.innerHTML = '';
                    ordersList.innerHTML = '';
                    historyTitle.classList.add('hidden');
                    return;
                }
                empty.classList.add('hidden');

                // نرتب الطلبات يدويًا بالأحدث أولاً (بدون orderBy عشان نتفادى الحاجة لفهرس إضافي)
                const orders = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data() || {};
                    const createdMillis = data.createdAt?.toMillis ? data.createdAt.toMillis() : 0;
                    orders.push({ id: docSnap.id, data, createdMillis });
                });
                orders.sort((a, b) => b.createdMillis - a.createdMillis);

                // الطلب النشط: أحدث طلب لسا ما وصل (تم التسليم) ولا انرفض
                const activeIdx = orders.findIndex(o => {
                    const s = o.data.status || 'قيد المعالجة';
                    return s !== 'تم التسليم' && s !== 'مرفوض';
                });

                const scheduledOrders = [];
                orders.forEach(o => {
                    if (o.data.isScheduled && o.data.scheduledFor?.toDate && !o.data.scheduleNotified) {
                        scheduledOrders.push({ id: o.id, scheduledFor: o.data.scheduledFor.toDate(), notified: false });
                    }
                });

                if (activeIdx !== -1) {
                    const active = orders[activeIdx];
                    activeOrderWrap.innerHTML = renderActiveOrderCard(active.id, active.data);
                } else {
                    activeOrderWrap.innerHTML = '';
                }

                const historyOrders = orders.filter((o, i) => i !== activeIdx);
                ordersList.innerHTML = '';
                if (historyOrders.length) {
                    historyTitle.classList.remove('hidden');
                    historyOrders.forEach(o => ordersList.appendChild(renderHistoryCard(o.id, o.data)));
                } else {
                    historyTitle.classList.add('hidden');
                }

                startScheduleWatcher(scheduledOrders);

            }, (error) => {
                loading.classList.add('hidden');
                ordersList.innerHTML = `<p class="text-red-500 text-center bg-red-50 p-4 rounded-lg border border-red-200">حدث خطأ أثناء تحميل الطلبات: ${error.message}</p>`;
            });
        });
    </script>
</body>
</html>
