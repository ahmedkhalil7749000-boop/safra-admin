<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الوجبة - سفرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto p-6">
        <div class="flex justify-between items-center mb-4">
            <a href="#" id="back-link" class="text-sm text-gray-500 hover:text-amber-600">→ رجوع للمطعم</a>
            <a href="السلة.html" class="text-sm text-amber-600 hover:underline">عرض السلة 🛒</a>
        </div>

        <div id="loading" class="text-center text-gray-500 py-10">جاري تحميل بيانات الوجبة...</div>
        <div id="error" class="hidden text-center text-red-500 py-10"></div>

        <div id="meal-box" class="hidden bg-white rounded-lg shadow-md overflow-hidden border border-gray-200">
            <img id="m-image" src="" alt="" class="w-full h-56 object-cover">
            <div class="p-5">
                <h1 id="m-name" class="text-2xl font-bold text-gray-800"></h1>
                <p id="m-description" class="text-gray-500 mt-2"></p>
                <div class="flex justify-between items-center mt-4">
                    <span id="m-price" class="text-xl font-bold text-amber-600"></span>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ملاحظات على الوجبة (اختياري)</label>
                    <textarea id="m-notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="مثال: بدون بصل، صوص إضافي..."></textarea>
                </div>

                <div class="flex items-center justify-between mt-5">
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-semibold text-gray-700">الكمية</span>
                        <button id="qty-dec" class="w-8 h-8 bg-gray-100 rounded hover:bg-gray-200">-</button>
                        <span id="qty-value" class="w-6 text-center font-semibold">1</span>
                        <button id="qty-inc" class="w-8 h-8 bg-gray-100 rounded hover:bg-gray-200">+</button>
                    </div>
                    <span id="m-total" class="font-bold text-gray-800"></span>
                </div>

                <button id="add-btn" class="w-full mt-5 bg-amber-600 text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">أضف للسلة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const restaurantId = params.get('restaurantId');
        const itemId = params.get('itemId');

        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const mealBox = document.getElementById('meal-box');
        const backLink = document.getElementById('back-link');

        let qty = 1;
        let itemData = null;

        function showError(msg) {
            loading.classList.add('hidden');
            errorBox.classList.remove('hidden');
            errorBox.innerText = msg;
        }

        function renderTotals() {
            document.getElementById('qty-value').innerText = qty;
            if (itemData) {
                document.getElementById('m-total').innerText = (itemData.price * qty).toFixed(2) + " د.أ";
            }
        }

        function addToCart() {
            const cart = JSON.parse(localStorage.getItem('safra_cart') || '[]');
            cart.push({
                restaurantId,
                itemId,
                name: itemData.name,
                price: itemData.price,
                image: itemData.image || '',
                notes: document.getElementById('m-notes').value,
                qty
            });
            localStorage.setItem('safra_cart', JSON.stringify(cart));
            alert(`تمت إضافة "${itemData.name}" (${qty}) للسلة`);
        }

        async function loadMeal() {
            if (!restaurantId || !itemId) {
                showError("ما في وجبة محددة. ارجع لصفحة المطعم واختار صنف.");
                return;
            }

            if (restaurantId) {
                backLink.href = `صفحة_المطعم.html?id=${restaurantId}`;
            }

            try {
                const itemDoc = await getDoc(doc(db, "restaurants", restaurantId, "menu", itemId));
                if (!itemDoc.exists()) {
                    showError("هذه الوجبة غير موجودة.");
                    return;
                }

                itemData = itemDoc.data();

                document.getElementById('m-image').src = itemData.image || 'https://via.placeholder.com/800x300?text=No+Image';
                document.getElementById('m-name').innerText = itemData.name;
                document.getElementById('m-description').innerText = itemData.description || '';
                document.getElementById('m-price').innerText = itemData.price + " د.أ";

                loading.classList.add('hidden');
                mealBox.classList.remove('hidden');
                renderTotals();
            } catch (error) {
                showError("خطأ بتحميل بيانات الوجبة: " + error.message);
            }
        }

        document.getElementById('qty-inc').addEventListener('click', () => {
            qty += 1;
            renderTotals();
        });

        document.getElementById('qty-dec').addEventListener('click', () => {
            if (qty > 1) qty -= 1;
            renderTotals();
        });

        document.getElementById('add-btn').addEventListener('click', addToCart);

        loadMeal();
    </script>
</body>
</html>
