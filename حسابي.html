<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البيانات الشخصية والإعدادات - سفرة</title>
    <link rel="stylesheet" href="app-shell.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'safra-dark': '#0b3b2c',
              'safra-green': '#2e6f40',
              'safra-cream': '#fbf9f5',
              'safra-gold': '#d97706',
              'safra-gold-dark': '#b45309',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-narrow bg-safra-cream min-h-screen">
    <!-- الهيدر المشترك: بيتحمّل تلقائيًا من shared-header.js -->
    <div id="app-header"></div>
    <script type="module" src="shared-header.js"></script>

    <div class="p-4">
        <h1 class="text-xl font-bold text-safra-gold mb-5 text-center">حسابي</h1>

        <div id="login-warning" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-4 text-center">
            لازم تسجل دخول عشان تشوف بيانات حسابك.
            <a href="Auth.html" class="text-safra-gold font-semibold hover:underline">سجّل دخول</a>
        </div>

        <div id="account-box" class="hidden bg-white rounded-lg shadow-md border border-gray-200 p-4 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                <p id="user-email" class="text-gray-800"></p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">تاريخ إنشاء الحساب</label>
                <p id="user-created" class="text-gray-800"></p>
            </div>

            <div class="border-t pt-4 flex flex-col gap-2">
                <a href="orders.html" class="text-center bg-gray-100 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-200 transition">طلباتي السابقة</a>
                <button id="logout-btn" class="bg-red-50 text-red-600 py-2 rounded-lg font-semibold hover:bg-red-100 transition">تسجيل الخروج</button>
            </div>
        </div>

        <!-- روابط لأصحاب المطاعم / الإدارة -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4">
            <h2 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wide">إدارة الأعمال</h2>
            <div class="flex flex-col gap-2">
                <a href="لوحة_المطعم.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-store ml-2 text-safra-gold"></i>لوحة تحكم المطعم</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
                <a href="adman.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-clipboard-list ml-2 text-safra-gold"></i>إدارة الطلبات</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
                <a href="لوحة_الإدارة.html" class="flex items-center justify-between bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                    <span><i class="fa-solid fa-user-shield ml-2 text-safra-gold"></i>لوحة الإدارة العامة</span>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-400"></i>
                </a>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <div id="app-bottom-nav"></div>
    <script type="module" src="shared-bottom-nav.js"></script>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loginWarning = document.getElementById('login-warning');
        const accountBox = document.getElementById('account-box');
        const logoutBtn = document.getElementById('logout-btn');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                loginWarning.classList.remove('hidden');
                accountBox.classList.add('hidden');
                return;
            }
            loginWarning.classList.add('hidden');
            accountBox.classList.remove('hidden');

            document.getElementById('user-email').innerText = user.email;
            const created = user.metadata?.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('ar-EG') : '-';
            document.getElementById('user-created').innerText = created;
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "Auth.html";
        });
    </script>
</body>
</html>
